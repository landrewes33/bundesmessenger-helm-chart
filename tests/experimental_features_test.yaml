suite: Experimental Features leakage
templates:
  - configuration.yaml
  - secrets.yaml
set:
  serverName: happy.place.example.org
  call.enabled: true
  mas.enabled: true
  extraConfig:
    experimental_features:
      new_feature: true
  externalPostgresql.existingSecret: postgresql
tests:
  - it: ensures experimental_features is not part of normal configuration file
    template: configuration.yaml
    asserts:
      - notMatchRegex:
          path: data[*]
          pattern: "experimental_features:"
  - it: ensures experimental_features is not part of default secret file
    template: secrets.yaml
    asserts:
      - notMatchRegex:
          path: stringData["config.yaml"]
          pattern: "experimental_features:"

---
suite: Experimental Features configuration
templates:
  - secrets.yaml
set:
  call.enabled: true
  mas.enabled: true
  extraConfig:
    experimental_features:
      new_feature: true
  externalPostgresql.existingSecret: postgresql
  serverName: example.org
tests:
  - it: ensures experimental_features is set for call
    template: secrets.yaml
    documentIndex: 0
    asserts:
      - matchRegex:
          path: stringData["experimental-features.yaml"]
          pattern: "experimental_features:"
      - matchRegex:
          path: stringData["experimental-features.yaml"]
          pattern: "msc3266_enabled: true"
  - it: ensures experimental_features is set for values.yaml
    template: secrets.yaml
    documentIndex: 0
    asserts:
      - matchRegex:
          path: stringData["experimental-features.yaml"]
          pattern: "experimental_features:"
      - matchRegex:
          path: stringData["experimental-features.yaml"]
          pattern: "new_feature: true"

---
suite: Experimental Features overrides
templates:
  - secrets.yaml
set:
  externalPostgresql.existingSecret: postgresql
  serverName: example.org
tests:
  - it: ensures experimental_features overwritten for call
    template: secrets.yaml
    documentIndex: 0
    set:
      call.enabled: true
      extraConfig:
        experimental_features:
          msc3266_enabled: false
    asserts:
      - matchRegex:
          path: stringData["experimental-features.yaml"]
          pattern: "experimental_features:"
      - matchRegex:
          path: stringData["experimental-features.yaml"]
          pattern: "msc3266_enabled: true"
