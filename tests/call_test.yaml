suite: Call
templates:
  - call/client-deployment.yaml
  - call/client-configuration.yaml
  - call/ingress.yaml
set:
  externalPostgresql.existingSecret: postgresql
  serverName: example.org
tests:
  - it: ensures an Ingress if (call enabled, ingress enabled)
    template: call/ingress.yaml
    set:
      call.enabled: true
      ingress.enabled: true
    asserts:
      - containsDocument:
          kind: Ingress
          apiVersion: networking.k8s.io/v1
          name: RELEASE-NAME-call-jwt-service
          any: true
  - it: ensures no Ingress if (call enabled, ingress disabled)
    template: call/ingress.yaml
    set:
      call.enabled: true
      ingress.enabled: false
    asserts:
      - containsDocument:
          kind: Ingress
        not: true
  - it: ensures no Ingress if (call disabled, ingress enabled)
    template: call/ingress.yaml
    set:
      call.enabled: false
      ingress.enabled: true
    asserts:
      - containsDocument:
          kind: Ingress
        not: true
  - it: ensures no Ingress if (call disabled, ingress disabled)
    template: call/ingress.yaml
    set:
      call.enabled: false
      ingress.enabled: false
    asserts:
      - containsDocument:
          kind: Ingress
        not: true
---
suite: Call JWT Service
templates:
  - templates/call/jwtService-deployment.yaml
  - secrets.yaml
set:
  externalPostgresql.existingSecret: postgresql
  serverName: example.org
tests:
  - it: ensures a Deployment if enabled
    template: templates/call/jwtService-deployment.yaml
    set:
      call.enabled: true
    asserts:
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: RELEASE-NAME-call-jwt-service
          any: true
  - it: ensures no Deployment if disabled
    template: templates/call/jwtService-deployment.yaml
    set:
      call.enabled: false
    asserts:
      - containsDocument:
          kind: Deployment
        not: true
  - it: ensures a pull secret is passed in
    template: templates/call/jwtService-deployment.yaml
    documentIndex: 0
    set:
      call.enabled: true
      call.jwtService.image.pullSecrets:
        - name: a-little-secret
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: a-little-secret
  - it: Should not create the Secret when in-config secret is not given.
    template: secrets.yaml
    set:
      call:
        enabled: true
        existingSecret: "use_own_secret"
      # call.livekit.key: null
      # call.livekit.secret: null
    asserts:
      - notEqual:
          path: metadata.name
          value: use_own_secret
  - it: Should create the Secret when in-config secret is given.
    template: secrets.yaml
    set:
      call:
        enabled: true
        existingSecret: "use_own_secret"
        livekit:
          key: k3y
          secret: s3cret
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: use_own_secret
          any: true
