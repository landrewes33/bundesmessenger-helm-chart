suite: Synapse Admin
templates:
  - synapse-admin/synapse-admin-deployment.yaml
  - synapse-admin/synapse-admin-ingress.yaml
set:
  synapse_admin.uri: synapse-admin.example.org
tests:
  - it: ensures a Deployment if enabled
    template: synapse-admin/synapse-admin-deployment.yaml
    set:
      synapse_admin.enabled: true
    asserts:
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: RELEASE-NAME-synapse-admin
          any: true
  - it: ensures no Deployment if disabled
    set:
      synapse_admin.enabled: false
    asserts:
      - containsDocument:
          kind: Deployment
        not: true
  - it: ensures a pull secret is passed in
    template: synapse-admin/synapse-admin-deployment.yaml
    documentIndex: 0
    set:
      synapse_admin.enabled: true
      synapse_admin.image.pullSecrets:
        - name: a-little-secret
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: a-little-secret
  - it: ensures an Ingress if (synapse_admin enabled, ingress enabled)
    template: synapse-admin/synapse-admin-ingress.yaml
    set:
      synapse_admin.enabled: true
      ingress.enabled: true
    asserts:
      - containsDocument:
          kind: Ingress
          apiVersion: networking.k8s.io/v1
          name: RELEASE-NAME-synapse-admin
          any: true
  - it: ensures no Ingress if (synapse_admin enabled, ingress disabled)
    template: synapse-admin/synapse-admin-ingress.yaml
    set:
      synapse_admin.enabled: true
      ingress.enabled: false
    asserts:
      - containsDocument:
          kind: Ingress
        not: true
  - it: ensures no Ingress if (synapse_admin disabled, ingress enabled)
    template: synapse-admin/synapse-admin-ingress.yaml
    set:
      synapse_admin.enabled: false
      ingress.enabled: true
    asserts:
      - containsDocument:
          kind: Ingress
        not: true
  - it: ensures no Ingress if (synapse_admin disabled, ingress disabled)
    template: synapse-admin/synapse-admin-ingress.yaml
    set:
      synapse_admin.enabled: false
      ingress.enabled: false
    asserts:
      - containsDocument:
          kind: Ingress
        not: true
---
suite: Synapse Admin with Admin-Portal
templates:
  - synapse-admin/synapse-admin-deployment.yaml
  # - adminportal/adminportal-deployment.yaml
set:
  synapse_admin.uri: admin.example.org
  adminPortal.uri: admin.example.org
tests:
  - it: ensures Admin-Portal and synapse admin do not have the same uri if enabled
    set:
      adminPortal.enabled: true
      synapse_admin.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: ".Values.synapse_admin.uri must not be .Values.adminPortal.uri"
  - it: ensures Admin-Portal and synapse admin do not have the same uri if disabled
    set:
      adminPortal.enabled: false
      synapse_admin.enabled: true
    asserts:
      - notFailedTemplate: {}
