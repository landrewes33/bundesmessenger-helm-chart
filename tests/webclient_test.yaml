suite: Web Client
templates:
  - webclient/webclient-deployment.yaml
  - webclient/webclient-configuration.yaml
  - webclient/webclient-ingress.yaml
  - nginx-conf.yaml
set:
  webclient.uri: webclient.example.org
  serverName: example.org
tests:
  - it: ensures a Deployment if enabled
    template: webclient/webclient-deployment.yaml
    set:
      webclient.enabled: true
    asserts:
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: RELEASE-NAME-webclient
          any: true
  - it: ensures no Deployment if disabled
    template: webclient/webclient-deployment.yaml
    set:
      webclient.enabled: false
    asserts:
      - containsDocument:
          kind: Deployment
        not: true
  - it: ensures a pull secret is passed in
    template: webclient/webclient-deployment.yaml
    documentIndex: 0
    set:
      webclient.enabled: true
      webclient.image.pullSecrets:
        - name: a-little-secret
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: a-little-secret
  - it: ensures an Ingress if (webclient enabled, ingress enabled)
    template: webclient/webclient-ingress.yaml
    set:
      webclient.enabled: true
      ingress.enabled: true
    asserts:
      - containsDocument:
          kind: Ingress
          apiVersion: networking.k8s.io/v1
          name: RELEASE-NAME-webclient
          any: true
  - it: ensures no Ingress if (webclient enabled, ingress disabled)
    template: webclient/webclient-ingress.yaml
    set:
      webclient.enabled: true
      ingress.enabled: false
    asserts:
      - containsDocument:
          kind: Ingress
        not: true
  - it: ensures no Ingress if (webclient disabled, ingress enabled)
    template: webclient/webclient-ingress.yaml
    set:
      webclient.enabled: false
      ingress.enabled: true
    asserts:
      - containsDocument:
          kind: Ingress
        not: true
  - it: ensures no Ingress if (webclient disabled, ingress disabled)
    template: webclient/webclient-ingress.yaml
    set:
      webclient.enabled: false
      ingress.enabled: false
    asserts:
      - containsDocument:
          kind: Ingress
        not: true

---
suite: Web Client ConfigMap
templates:
  - webclient/webclient-configuration.yaml
set:
  webclient:
    enabled: true
    uri: webclient.example.org
    displayName: "MatrixClient"
  serverName: example.org
tests:
  - it: renders default config without optional blocks
    template: webclient/webclient-configuration.yaml
    documentIndex: 0
    set:
      call.enabled: false
      additionalConfig.locationSharing.enabled: false
    asserts:
      - matchRegex:
          path: data["override_default_config.json"]
          pattern: '"base_url":\s"https://example\.org"'
      - matchRegex:
          path: data["override_default_config.json"]
          pattern: '"server_name":\s"MatrixClient"'
      - matchRegex:
          path: data["override_default_config.json"]
          pattern: '"content_scanner":\s{[^}]*"enabled":\strue[^}]*}'
      - notMatchRegex:
          path: data["override_default_config.json"]
          pattern: '"element_call"'
      - notMatchRegex:
          path: data["override_default_config.json"]
          pattern: '"bwi_setting_defaults"'

  - it: includes bwi_setting_defaults when locationSharing enabled
    template: webclient/webclient-configuration.yaml
    documentIndex: 0
    set:
      additionalConfig.locationSharing.enabled: true
    asserts:
      - matchRegex:
          path: data["override_default_config.json"]
          pattern: '"bwi_setting_defaults":\s{'
      - matchRegex:
          path: data["override_default_config.json"]
          pattern: '"BwiFeature.locationShareTypesEnabled":\s\[\s*"Pin"\s*\]'

  - it: add custom config
    template: webclient/webclient-configuration.yaml
    documentIndex: 0
    set:
      webclient.extraConfig:
        custom_key: "custom_value"
    asserts:
      - matchRegex:
          path: data["override_default_config.json"]
          pattern: '"custom_key":\s*"custom_value"'

  - it: override custom config
    template: webclient/webclient-configuration.yaml
    documentIndex: 0
    set:
      webclient.extraConfig:
        server_name: "NewMatrixClient"
    asserts:
      - matchRegex:
          path: data["override_default_config.json"]
          pattern: '"server_name":\s"NewMatrixClient"'
