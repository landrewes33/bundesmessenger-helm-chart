suite: Admin Portal
templates:
  - adminportal/adminportal-deployment.yaml
  - adminportal/adminportal-configuration.yaml
  - nginx-conf.yaml
  - secrets.yaml
set:
  mas.enabled: true
  adminPortal:
    uri: adminportal.example.com
tests:
  - it: ensures a Deployment if enabled
    template: adminportal/adminportal-deployment.yaml
    set:
      adminPortal:
        enabled: true
    asserts:
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: RELEASE-NAME-adminportal-synapse-core
          any: true
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: RELEASE-NAME-adminportal-synapse-ui
          any: true
  - it: ensures no Deployment if disabled
    template: adminportal/adminportal-deployment.yaml
    set:
      adminPortal.enabled: false
    asserts:
      - containsDocument:
          kind: Deployment
        not: true
  - it: ensures a pull secret is passed in
    template: adminportal/adminportal-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
      matchMany: true
    set:
      adminPortal.enabled: true
      adminPortal.coreImage.pullSecrets:
        - name: a-little-secret
      adminPortal.uiImage.pullSecrets:
        - name: a-medium-secret
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: a-little-secret
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: a-medium-secret
