suite: Schadcodescanner
templates:
  - schadcodescanner/schadcodescanner-deployment.yaml
  - schadcodescanner/schadcodescanner-configuration.yaml
set:
  externalPostgresql.existingSecret: postgresql
tests:
  - it: ensures a StatefulSet if enabled
    template: schadcodescanner/schadcodescanner-deployment.yaml
    set:
      schadcodescanner.enabled: true
      contentscanner.enabled: true
    asserts:
      - containsDocument:
          kind: StatefulSet
          apiVersion: apps/v1
          name: RELEASE-NAME-schadcodescanner
          any: true
  - it: ensures no StatefulSet if disabled
    template: schadcodescanner/schadcodescanner-deployment.yaml
    set:
      schadcodescanner.enabled: false
    asserts:
      - containsDocument:
          kind: StatefulSet
        not: true
  - it: ensures a pull secret is passed in
    template: schadcodescanner/schadcodescanner-deployment.yaml
    documentIndex: 0
    set:
      schadcodescanner.enabled: true
      contentscanner.enabled: true
      schadcodescanner.clamavImage.pullSecrets:
        - name: a-little-secret
      schadcodescanner.icapImage.pullSecrets:
        - name: a-medium-secret
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: a-little-secret
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: a-medium-secret
  - it: requires contentscanner to be enabled
    template: schadcodescanner/schadcodescanner-deployment.yaml
    set:
      schadcodescanner.enabled: true
      contentscanner.enabled: false
    asserts:
      - failedTemplate: {}
