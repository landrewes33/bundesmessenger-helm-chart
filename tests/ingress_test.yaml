templates:
  - ingress.yaml
tests:
  - it: ensures an Ingress if enabled
    set:
      ingress.enabled: true
    asserts:
      - containsDocument:
          kind: Ingress
          apiVersion: networking.k8s.io/v1
          name: RELEASE-NAME-bundesmessenger
          any: true
  - it: ensures no Ingress if disabled
    set:
      ingress.enabled: false
    asserts:
      - containsDocument:
          kind: Ingress
        not: true
