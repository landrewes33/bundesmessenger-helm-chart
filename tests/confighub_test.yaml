suite: Confighub
templates:
  - confighub/confighub-deployment.yaml
  - confighub/confighub-configuration.yaml
  - nginx-conf.yaml
tests:
  - it: ensures a Deployment if enabled
    template: confighub/confighub-deployment.yaml
    set:
      confighub.enabled: true
    asserts:
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: RELEASE-NAME-confighub-nginx
          any: true
  - it: ensures no Deployment if disabled
    template: confighub/confighub-deployment.yaml
    set:
      confighub.enabled: false
    asserts:
      - containsDocument:
          kind: Deployment
        not: true
  - it: ensures a pull secret is passed in
    template: confighub/confighub-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      confighub.image.pullSecrets:
        - name: a-little-secret
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: a-little-secret
