suite: Sygnal
templates:
  - sygnal/sygnal-deployment.yaml
  - sygnal/sygnal-configuration.yaml
set:
  externalPostgresql.existingSecret: postgresql
tests:
  - it: ensures a Deployment if enabled
    template: sygnal/sygnal-deployment.yaml
    set:
      sygnal.enabled: true
    asserts:
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: RELEASE-NAME-sygnal
          any: true
  - it: ensures no Deployment if disabled
    template: sygnal/sygnal-deployment.yaml
    set:
      sygnal.enabled: false
    asserts:
      - containsDocument:
          kind: Deployment
        not: true
---
suite: Sygnal secrets
templates:
  - sygnal/sygnal-deployment.yaml
  - sygnal/sygnal-configuration.yaml
set:
  externalPostgresql.existingSecret: postgresql
tests:
  - it: ensures a Secret on legacy options
    template: sygnal/sygnal-configuration.yaml
    set:
      sygnal.enabled: true
      sygnal.existingSecret: sygnal
      sygnal.fcmkey_filename: bundesmessenger.json
      sygnal.fcmkey_keyvalue: {}
      sygnal.ioskey_filename: AuthKey.p8
      sygnal.ioskey_keyvalue: 53C237
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: sygnal
          any: true
  - it: ensures a Secret key for legacy FCM option
    template: sygnal/sygnal-configuration.yaml
    set:
      sygnal.enabled: true
      sygnal.existingSecret: sygnal
      sygnal.fcmkey_filename: bundesmessenger.json
      sygnal.fcmkey_keyvalue: {"fake": "values"}
    documentSelector:
      path: metadata.name
      value: sygnal
    asserts:
      - equal:
          path: stringData['bundesmessenger.json']
          value: |
            {
              "fake": "values"
            }
  - it: ensures a Secret key for legacy APNS option
    template: sygnal/sygnal-configuration.yaml
    set:
      sygnal.enabled: true
      sygnal.existingSecret: sygnal
      sygnal.ioskey_filename: AuthKey.p8
      sygnal.ioskey_keyvalue: 53C237
    documentSelector:
      path: metadata.name
      value: sygnal
    asserts:
      - equal:
          path: data['AuthKey.p8']
          value: 53C237
  - it: ensures no Secret without legacy options
    template: sygnal/sygnal-configuration.yaml
    set:
      sygnal.enabled: true
      sygnal.existingSecret: sygnal
    asserts:
      - containsDocument:
          kind: Secret
        not: true
