suite: ensures deployment configurations
templates:
  - well-known/well-known-deployment.yaml
  - well-known/well-known-configuration.yaml
  - nginx-conf.yaml
tests:
  - it: ensures a Deployment if enabled
    template: well-known/well-known-deployment.yaml
    set:
      wellknown.enabled: true
      dataPrivacyUrl: yes-i-have-read-and-understand.example.com
      imprintUrl: acme.noreply.example.com
    asserts:
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: RELEASE-NAME-wellknown-nginx
          any: true
  - it: ensures no Deployment if disabled
    template: well-known/well-known-deployment.yaml
    set:
      wellknown.enabled: false
    asserts:
      - containsDocument:
          kind: Deployment
        not: true

---
suite: ensures standard-values are not deleted with additional configurations
templates:
  - well-known/well-known-configuration.yaml
set:
  wellknown.client:
    org.matrix.msc3814: "true"
  dataPrivacyUrl: https://dsgvo.example.org
  imprintUrl: https://impressum.example.org
tests:
  - it: ensures standard values are not dropped
    template: well-known/well-known-configuration.yaml
    asserts:
      - matchRegex:
          path: data["client.json"]
          pattern: "\"de.bwi\":"
  - it: ensures additional value is part of well-known-file
    template: well-known/well-known-configuration.yaml
    asserts:
      - matchRegex:
          path: data["client.json"]
          pattern: "\"org.matrix.msc3814\":"

---
suite: ensures standard values are overwritten as part of the configuration
templates:
  - well-known/well-known-configuration.yaml
set:
  dataPrivacyUrl: https://dsgvo.example.org
  imprintUrl: https://impressum.example.org
  wellknown.client:
    m.homeserver:
      base_url: https://happy.place.example.org
tests:
  - it: ensures value is present and overwritten
    template: well-known/well-known-configuration.yaml
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["client.json"]
          pattern: "\"m.homeserver\":"
      - matchRegex:
          path: data["client.json"]
          pattern: "\"base_url\": \"https://happy.place.example.org\""
  - it: ensures other standard values is set
    template: well-known/well-known-configuration.yaml
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["client.json"]
          pattern: "\"io.element.e2ee\":"
      - matchRegex:
          path: data["client.json"]
          pattern: "\"secure_backup_required\": true"
