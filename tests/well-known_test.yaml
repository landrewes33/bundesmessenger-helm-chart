suite: Well-Known deployment
templates:
  - well-known/well-known-deployment.yaml
  - well-known/well-known-configuration.yaml
  - nginx-conf.yaml
set:
  wellknown.enabled: true
  dataPrivacyUrl: yes-i-have-read-and-understand.example.com
  imprintUrl: acme.noreply.example.com
  externalPostgresql.existingSecret: postgresql
  serverName: example.org
tests:
  - it: ensures a Deployment if enabled
    template: well-known/well-known-deployment.yaml
    asserts:
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: RELEASE-NAME-wellknown-nginx
          any: true
  - it: ensures no Deployment if disabled
    template: well-known/well-known-deployment.yaml
    set:
      wellknown.enabled: false
    asserts:
      - containsDocument:
          kind: Deployment
        not: true
  - it: ensures a pull secret is passed in
    template: well-known/well-known-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      wellknown.image.pullSecrets:
        - name: a-little-secret
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: a-little-secret

---
suite: Well-Known configuration server
templates:
  - well-known/well-known-configuration.yaml
set:
  wellknown.enabled: true
  wellknown.port: 554
  dataPrivacyUrl: yes-i-have-read-and-understand.example.com
  imprintUrl: acme.noreply.example.com
  externalPostgresql.existingSecret: postgresql
  serverName: example.org
tests:
  - it: ensures correct rendering of m.server
    asserts:
      - matchRegex:
          path: data["server.json"]
          pattern: '(?m:"m\.server":\s*"example.org:554")'

---
suite: Well-Known default values
templates:
  - well-known/well-known-configuration.yaml
set:
  wellknown.client:
    org.matrix.msc3814: "true"
  dataPrivacyUrl: https://dsgvo.example.org
  imprintUrl: https://impressum.example.org
  externalPostgresql.existingSecret: postgresql
  serverName: example.org
tests:
  - it: ensures standard values are not dropped
    template: well-known/well-known-configuration.yaml
    asserts:
      - matchRegex:
          path: data["client.json"]
          pattern: "\"de.bwi\":"
  - it: ensures additional value is part of well-known-file
    template: well-known/well-known-configuration.yaml
    asserts:
      - matchRegex:
          path: data["client.json"]
          pattern: "\"org.matrix.msc3814\":"
  - it: ensures additional msc4143 call settings
    template: well-known/well-known-configuration.yaml
    set:
      call.enabled: true
    asserts:
      - matchRegex:
          path: data["client.json"]
          pattern: '"org\.matrix\.msc4143\.rtc_foci"\s*:\s*\[\s*{\s*"livekit_service_url"\s*:\s*"https://example\.org",\s*"type"\s*:\s*"livekit"\s*}\s*\]'

---
suite: Well-Known overrides
templates:
  - well-known/well-known-configuration.yaml
set:
  dataPrivacyUrl: https://dsgvo.example.org
  imprintUrl: https://impressum.example.org
  wellknown.client:
    m.homeserver:
      base_url: https://happy.place.example.org
  externalPostgresql.existingSecret: postgresql
  serverName: example.org
tests:
  - it: ensures value is present and overwritten
    template: well-known/well-known-configuration.yaml
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["client.json"]
          pattern: "\"m.homeserver\":"
      - matchRegex:
          path: data["client.json"]
          pattern: "\"base_url\": \"https://happy.place.example.org\""
  - it: ensures other standard values is set
    template: well-known/well-known-configuration.yaml
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["client.json"]
          pattern: "\"io.element.e2ee\":"
      - matchRegex:
          path: data["client.json"]
          pattern: "\"secure_backup_required\": true"
