suite: Deployment
templates:
  - deployment.yaml
  - configuration.yaml
  - demomode/demomode.yaml
  - secrets.yaml
  - signing-key-job.yaml
set:
  externalPostgresql.existingSecret: postgresql
tests:
  - it: ensures a Deployment
    template: deployment.yaml
    set:
      serverName: happy.place.example.org
    asserts:
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: RELEASE-NAME-bundesmessenger
          any: true
