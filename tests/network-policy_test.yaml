suite: Network Policies
templates:
  - network-policy/*.yaml
tests:
  - it: ensures no NetworkPolicy if disabled
    set:
      networkpolicies.enabled: false
    asserts:
      - containsDocument:
          kind: NetworkPolicy
        not: true

---
suite: Network Policies ACME solver
templates:
  - network-policy/allow-acme-network-policy.yaml
set:
  networkpolicies:
    enabled: true
    ingressNamespace: "default"
    acme:
      labelSelector:
        - key: example.org/own
          operator: In
          values: ["true"]
      port: 1234
tests:
  - it: should create a NetworkPolicy with correct labels and ingress rules
    asserts:
      - containsDocument:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          name: RELEASE-NAME-acme-http01-solver-allow-ingress-controller
      - equal:
          path: spec.podSelector.matchExpressions
          value:
            - key: example.org/own
              operator: In
              values: ["true"]
      - contains:
          path: spec.ingress[0].from
          any: true
          content:
            namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: default
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 1234
      - equal:
          path: spec.ingress[0].ports[0].protocol
          value: TCP

---
suite: Network Policies MAS
templates:
  - network-policy/matrix-authentication-service-network-policy.yaml
set:
  networkpolicies.enabled: true
  mas.enabled: true
tests:
  - it: errors on empty maspostgresql.labelSelector
    set:
      networkpolicies:
        maspostgresql:
          labelSelector: []
    asserts:
      - failedTemplate: {}
  - it: errors on missing maspostgresql.labelSelector
    set:
      networkpolicies:
        maspostgresql:
          labelSelector: null  # Unset by coalescing
    asserts:
      - failedTemplate: {}
  - it: "renders postgres egress rule when maspostgresql.enabled = true and labelSelector is set"
    template: network-policy/matrix-authentication-service-network-policy.yaml
    documentIndex: 0
    set:
      networkpolicies:
        maspostgresql:
          labelSelector:
            - key: example.org/custom
              operator: In
              values: ["postgres-db"]
      maspostgresql:
        enabled: true
        service:
          targetPort: 5433
    asserts:
      - equal:
          path: spec.egress[1].ports[0].port
          value: 5433
      - equal:
          path: spec.egress[1].to[0].podSelector.matchExpressions
          value:
            - key: example.org/custom
              operator: In
              values: ["postgres-db"]
      - notContains:
          path: spec.egress[1].to[0].podSelector.matchExpressions
          content:
            key: app.kubernetes.io/name
          any: true
  - it: "renders postgres egress rule when maspostgresql.enabled = false and labelSelector is set"
    template: network-policy/matrix-authentication-service-network-policy.yaml
    documentIndex: 0
    set:
      networkpolicies:
        maspostgresql:
          labelSelector:
            - key: example.org/custom
              operator: In
              values: ["postgres-db"]
      maspostgresql:
        enabled: false
      externalmasPostgresql:
        port: 5433
    asserts:
      - equal:
          path: spec.egress[1].ports[0].port
          value: 5433
      - equal:
          path: spec.egress[1].to[0].podSelector.matchExpressions
          value:
            - key: example.org/custom
              operator: In
              values: ["postgres-db"]
      - notContains:
          path: spec.egress[1].to[0].podSelector.matchExpressions
          content:
            key: app.kubernetes.io/name
          any: true
  - it: "renders postgres egress rule with ipBlock"
    template: network-policy/matrix-authentication-service-network-policy.yaml
    documentIndex: 0
    set:
      networkpolicies:
        maspostgresql:
          externalPostgresIP: 10.1.2.3
      maspostgresql:
        enabled: false
      externalmasPostgresql:
        port: 25432
    asserts:
      - equal:
          path: spec.egress[1].ports[0].port
          value: 25432
      - equal:
          path: spec.egress[1].to[0].ipBlock.cidr
          value: "10.1.2.3/32"

