suite: Secrets auto-generation
templates:
  - secrets.yaml
set:
  externalPostgresql.existingSecret: postgresql
kubernetesProvider:
  scheme:
    v1/Secret:
      gvr:
        version: v1
        resource: secrets
      namespaced: true
  objects:
    # An already existing Secret.
    - apiVersion: v1
      kind: Secret
      metadata:
        name: synapse-custom-secret
        namespace: NAMESPACE
      data:
        formo: Zm9ybW9kYWJlbA==
      type: Opaque
tests:
  - it: succeeds on existing Secret with all keys
    set:
      config.formSecret.existingSecret: synapse-custom-secret
      config.formSecret.existingSecretKey: formo
    asserts:
      - containsDocument:
          name: synapse-custom-secret
        not: true
  - it: fails on existing Secret with missing keys
    set:
      config.formSecret.existingSecret: synapse-custom-secret
      config.formSecret.existingSecretKey: formo
      config.macaroonSecretKey.existingSecret: synapse-custom-secret
      config.macaroonSecretKey.existingSecretKey: macaroona
    asserts:
      - failedTemplate:
          errorPattern: synapse-custom-secret.*macaroona.*NAMESPACE
  - it: ensures no Secret generation on ArgoCD
    set:
      config.workerReplicationSecret.existingSecret: synapse-alt
      argoCD: true
    asserts:
      - containsDocument:
          name: synapse-alt
        not: true
