suite: PostgreSQL authentication
templates:
  - deployment.yaml
  - configuration.yaml
  - secrets.yaml
  - signing-key-job.yaml
set:
  serverName: example.org
tests:
  - it: ensures internal PostgreSQL works with existingSecret
    set:
      postgresql.enabled: true
      postgresql.customUser.existingSecret: postgresql-secret
      postgresql.customUser.secretKeys.password: lepass
      # Using null here would cause Helm to *coalesce* it with the property in
      # the values.yaml – effectively removing the property. The result would be
      # *merged* with the subchart’s value, resulting in the use of the
      # postgresql subchart’s default, which is of type `string`. To work around
      # this issue and get the Next Best Thing™, values.schema.json is relaxed
      # to allow simple emptiness for these properties. This workaround
      # especially guards from the subtleties of a values.yaml coalesced with
      # itself.
      #
      # Coalesce vs. merge:
      # https://github.com/helm/helm/blob/d1e9c022c68e36112aa40f6983d4d27e67501cf4/pkg/chartutil/coalesce.go#L252-L293
      #
      postgresql.customUser.password: ""
    asserts:
      - notFailedTemplate: {}
  - it: errors if an internal PostgreSQL password is set
    set:
      postgresql.enabled: true
      postgresql.customUser.existingSecret: postgresql-secret
      postgresql.customUser.password: P455W02D
    asserts:
      - failedTemplate: {}
  - it: errors if an internal PostgreSQL admin password is set
    set:
      postgresql.enabled: true
      postgresql.auth.existingSecret: postgresql-secret
      postgresql.auth.password: P455W02D
    asserts:
      - failedTemplate: {}
  - it: ensures external PostgreSQL works with existingSecret
    set:
      postgresql.enabled: false
      externalPostgresql.existingSecret: postgresql-secret
      externalPostgresql.existingSecretPasswordKey: lepass
      externalPostgresql.password: null
    asserts:
      - notFailedTemplate: {}
  - it: ensures external PostgreSQL works with password
    set:
      postgresql.enabled: false
      externalPostgresql.existingSecret: postgresql-secret
      externalPostgresql.existingSecretPasswordKey: lepass
      externalPostgresql.password: P455W02D
    asserts:
      - template: secrets.yaml
        documentSelector:
          path: metadata.name
          value: postgresql-secret
        equal:
          path: stringData.lepass
          value: P455W02D
  - it: ensures external PostgreSQL errors without credentials
    set:
      postgresql.enabled: false
      externalPostgresql.existingSecret: null
      externalPostgresql.password: null
    asserts:
      - failedTemplate: {}
---
suite: PostgreSQL Secret generation
templates:
  - secrets.yaml
set:
  postgresql.customUser.secretKeys.password: password-key
  postgresql.auth.secretKeys.adminPasswordKey: admin-password-key
tests:
  - it: ensures internal PostgreSQL Secret if required
    set:
      postgresql.enabled: true
      postgresql.auth.existingSecret: postgresql-secret
      postgresql.customUser.existingSecret: postgresql-secret
      postgresql.customUser.password: ""
    documentSelector:
      path: metadata.name
      value: postgresql-secret
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: postgresql-secret
          any: true
      - matchRegex:
          path: stringData.password-key
          pattern: '^[a-zA-z0-9]{42}$'
      - matchRegex:
          path: stringData.admin-password-key
          pattern: '^[a-zA-z0-9]{42}$'
  - it: ensures internal PostgreSQL errors if no existingSecret is given
    set:
      postgresql.enabled: true
      postgresql.customUser.existingSecret: ""
    asserts:
      - failedTemplate: {}
  - it: ensures no internal PostgreSQL Secret if not required
    set:
      postgresql.enabled: false
      externalPostgresql.existingSecret: postgresql-secret
    asserts:
      - containsDocument:
          kind: Secret
          name: postgresql-secret
        not: true
---
suite: PostgreSQL Secret lookup
templates:
  - secrets.yaml
set:
  postgresql.enabled: true
  postgresql.customUser.secretKeys.name: name-key
  postgresql.customUser.secretKeys.database: database-key
  postgresql.customUser.secretKeys.password: password-key
  postgresql.auth.secretKeys.adminPasswordKey: postgres-password-key
kubernetesProvider:
  scheme:
    v1/Secret:
      gvr:
        version: v1
        resource: secrets
      namespaced: true
  objects:
    # An already existing Secret.
    - apiVersion: v1
      kind: Secret
      metadata:
        name: postgresql-secret
        namespace: NAMESPACE
      data:
        name-key: c3luYXBzZQo=  # synapse
        database-key: c3luYXBzZQo=  # synapse
        password-key: bGVwYXNzd29yZA==  # lepassword
      type: Opaque
tests:
  - it: ensures internal PostgreSQL Secret is not generated if already existing
    set:
      postgresql.customUser.existingSecret: postgresql-secret
      postgresql.auth.existingSecret: postgresql-secret-new
    asserts:
      - notEqual:
          path: metadata.name
          value: postgresql-secret
  - it: ensures internal PostgreSQL Secret is generated if non existing
    set:
      postgresql.customUser.existingSecret: postgresql-secret-new
      postgresql.auth.existingSecret: postgresql-secret-new
    documentSelector:
      path: metadata.name
      value: postgresql-secret-new
    asserts:
      - containsDocument:
          apiVersion: v1
          kind: Secret
          name: postgresql-secret-new
      - exists:
          path: stringData.name-key
      - exists:
          path: stringData.database-key
      - exists:
          path: stringData.password-key
      - exists:
          path: stringData.postgres-password-key
