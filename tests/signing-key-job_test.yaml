suite: Signing Key generation
templates:
  - signing-key-job.yaml
set:
  externalPostgresql.existingSecret: postgresql
tests:
  - it: ensures a Job if enabled
    set:
      signingkey.job.enabled: true
    asserts:
      - containsDocument:
          kind: Job
          apiVersion: batch/v1
          name: RELEASE-NAME-signingkey-job
          any: true
  - it: ensures a pull secret is passed in
    documentSelector:
      path: kind
      value: Job
    set:
      signingkey.job.generateImage.pullSecrets:
        - name: a-little-secret
      signingkey.job.publishImage.pullSecrets:
        - name: a-medium-secret
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: a-little-secret
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: a-medium-secret
  - it: ensures no Job if disabled
    set:
      signingkey.job.enabled: false
      signingkey.existingSecret: very-signing
      signingkey.existingSecretKey: much.key
    asserts:
      - containsDocument:
          kind: Job
        not: true
  - it: ensures mutually exclusive generation and use of keys
    set:
      signingkey.job.enabled: true
      signingkey.existingSecret: fake-secret
    asserts:
      - failedTemplate: {}
