suite: Signing Key generation
templates:
  - signing-key-job.yaml
set:
  externalPostgresql.existingSecret: postgresql
tests:
  - it: ensures a Job if enabled
    set:
      signingkey.job.enabled: true
    asserts:
      - containsDocument:
          kind: Job
          apiVersion: batch/v1
          name: RELEASE-NAME-signingkey-job
          any: true
  - it: ensures no Job if disabled
    set:
      signingkey.job.enabled: false
      signingkey.existingSecret: very-signing
      signingkey.existingSecretKey: much.key
    asserts:
      - containsDocument:
          kind: Job
        not: true
  - it: ensures mutually exclusive generation and use of keys
    set:
      signingkey.job.enabled: true
      signingkey.existingSecret: fake-secret
    asserts:
      - failedTemplate: {}
