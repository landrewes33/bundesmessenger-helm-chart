suite: MAS
templates:
  - matrix-authentication-service/matrix-authentication-service-deployment.yaml
  - matrix-authentication-service/matrix-authentication-service-configuration.yaml
  - matrix-authentication-service/matrix-authentication-service-ingress.yaml
  - secrets.yaml
set:
  externalPostgresql.existingSecret: postgresql
  serverName: example.org
tests:
  - it: ensures a StatefulSet if enabled
    template: matrix-authentication-service/matrix-authentication-service-deployment.yaml
    set:
      mas.enabled: true
    asserts:
      - containsDocument:
          kind: StatefulSet
          apiVersion: apps/v1
          name: RELEASE-NAME-matrix-authentication-service
          any: true
  - it: ensures no StatefulSet if disabled
    template: matrix-authentication-service/matrix-authentication-service-deployment.yaml
    set:
      mas.enabled: false
    asserts:
      - containsDocument:
          kind: StatefulSet
        not: true
  - it: ensures a pull secret is passed in
    template: >-
      matrix-authentication-service/matrix-authentication-service-deployment.yaml
    documentIndex: 0
    set:
      mas.enabled: true
      mas.image.pullSecrets:
        - name: a-little-secret
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: a-little-secret
  - it: ensures upstream_oauth2.providers
    template: secrets.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-matrix-authentication-service
    set:
      mas.enabled: true
      mas.upstream_oauth2_provider:
        - client_id: fake-cafebabecafebabe
          id: 00000000000VA11D111V11D222
          scope: openid email profile
          token_endpoint_auth_method: client_secret_basic
    asserts:
      - matchRegex:
          path: stringData["mas-secret.yaml"]
          pattern: "(?ms:\
            ^\\s*upstream_oauth2:.*?\
            ^\\s*  providers:.*?\
            ^\\s*    - client_id: fake-cafebabecafebabe\n.*?\
            ^\\s*      id: 00000000000VA11D111V11D222\n.*?\
            ^\\s*      scope: openid email profile\n.*?\
            ^\\s*      token_endpoint_auth_method: client_secret_basic\n.*?\
            )"
---
suite: MAS config
templates:
  - matrix-authentication-service/matrix-authentication-service-deployment.yaml
  - matrix-authentication-service/matrix-authentication-service-configuration.yaml
  - matrix-authentication-service/matrix-authentication-service-ingress.yaml
  - secrets.yaml
set:
  externalPostgresql.existingSecret: postgresql
  mas.enabled: true
  serverName: example.org
tests:
  - it: ensures configuration is set for MAS
    template: secrets.yaml
    documentIndex: 0
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "(?ms:\
            ^\\s*matrix_authentication_service:.*?\
            ^\\s*  enabled: true.*?\
            )"
  - it: ensures full config
    template: secrets.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-matrix-authentication-service
    set:
      mas:
        postgresql:
          host: different.mas.example.org
          port: 1
          database: mas
          username: Frank
          password: ididitmyway
          min_connections: 3
          max_connections: 20
          connect_timeout: 60
          idle_timeout: 1212
          max_lifetime: 1818
          extraArgs:
            sslmode: require
            sslrootcert: /path/to/ca.pem
            sslcert: /path/to/cert.pem
            sslkey: /path/to/key.pem
    asserts:
      - matchRegex:
          path: stringData["mas-secret.yaml"]
          pattern: "(?ms:\
            ^\\s*database:.*?\
            ^\\s*  # host: \"different.mas.example.org\".*?\
            ^\\s*  # port: 1.*?\
            ^\\s*  # database: \"mas\".*?\
            ^\\s*  # username: \"Frank\".*?\
            ^\\s*  # password: \"ididitmyway\".*?\
            ^\\s*  # ssl_mode: \"require\".*?\
            ^\\s*  # ssl_ca_file: \"/path/to/ca.pem\".*?\
            ^\\s*  # ssl_certificate_file: \"/path/to/cert.pem\".*?\
            ^\\s*  # ssl_key_file: \"/path/to/key.pem\".*?\
            ^\\s*  min_connections: 3.*?\
            ^\\s*  max_connections: 20.*?\
            ^\\s*  connect_timeout: 60.*?\
            ^\\s*  idle_timeout: 1212.*?\
            ^\\s*  max_lifetime: 1818.*?\
            )"
      - matchRegex:
          path: stringData["mas-secret.yaml"]
          pattern: "(?ms:\
            ^\\s*database:.*?\
            ^\\s*  uri: \"\
            postgresql://Frank:ididitmyway@different.mas.example.org:1/mas\
            \\?sslcert=%2Fpath%2Fto%2Fcert.pem\
            &sslkey=%2Fpath%2Fto%2Fkey.pem\
            &sslmode=require\
            &sslrootcert=%2Fpath%2Fto%2Fca.pem\
            \")"
  - it: use synapse main process
    template: secrets.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-matrix-authentication-service
    set:
      workers:
        generic_worker:
          enabled: false
    asserts:
      - matchRegex:
          path: stringData["mas-secret.yaml"]
          pattern: "(?ms:\
            ^\\s*matrix:.*?\
            ^\\s*  endpoint: \"http://RELEASE-NAME-bundesmessenger:8008\".*?\
            )"
  - it: use synapse worker process
    template: secrets.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-matrix-authentication-service
    set:
      workers:
        generic_worker:
          enabled: true
    asserts:
      - matchRegex:
          path: stringData["mas-secret.yaml"]
          pattern: "(?ms:\
            ^\\s*matrix:.*?\
            ^\\s*  endpoint: \"http://RELEASE-NAME-generic-worker:8083\".*?\
            )"
---
suite: MAS ingress
templates:
  - matrix-authentication-service/matrix-authentication-service-deployment.yaml
  - matrix-authentication-service/matrix-authentication-service-configuration.yaml
  - matrix-authentication-service/matrix-authentication-service-ingress.yaml
  - secrets.yaml
set:
  externalPostgresql.existingSecret: postgresql
  serverName: example.org
tests:
  - it: ensures an Ingress if (mas enabled, ingress enabled)
    template: matrix-authentication-service/matrix-authentication-service-ingress.yaml
    set:
      mas.enabled: true
      ingress.enabled: true
    asserts:
      - containsDocument:
          kind: Ingress
          apiVersion: networking.k8s.io/v1
          name: RELEASE-NAME-matrix-authentication-service
          any: true
  - it: ensures no Ingress if (mas enabled, ingress disabled)
    template: matrix-authentication-service/matrix-authentication-service-ingress.yaml
    set:
      mas.enabled: true
      ingress.enabled: false
    asserts:
      - containsDocument:
          kind: Ingress
        not: true
  - it: ensures no Ingress if (mas disabled, ingress enabled)
    template: matrix-authentication-service/matrix-authentication-service-ingress.yaml
    set:
      mas.enabled: false
      ingress.enabled: true
    asserts:
      - containsDocument:
          kind: Ingress
        not: true
  - it: ensures no Ingress if (mas disabled, ingress disabled)
    template: matrix-authentication-service/matrix-authentication-service-ingress.yaml
    set:
      mas.enabled: false
      ingress.enabled: false
    asserts:
      - containsDocument:
          kind: Ingress
        not: true
---
suite: MAS Secrets
templates:
  - secrets.yaml
tests:
  - it: tests creation of the MAS signingkey Secret
    set:
      mas.enabled: true
      mas.signingkeys.existingSecret: mas-sig-key-sec
    documentSelector:
      path: metadata.name
      value: mas-sig-key-sec
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: mas-sig-key-sec
          any: true
      - matchRegex:
          path: stringData["0000-mas-signingkey-rsa.pem"]
          pattern: "^-----BEGIN RSA PRIVATE KEY-----"
      - matchRegex:
          path: stringData["0001-mas-signingkey-ec.pem"]
          pattern: "^-----BEGIN EC PRIVATE KEY-----"
  - it: tests creation of the MAS encryption Secret
    set:
      mas.enabled: true
      mas.encryption:
        existingSecret: mas-enc-sec
        existingSecretKey: enc
    documentSelector:
      path: metadata.name
      value: mas-enc-sec
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: mas-enc-sec
          any: true
      - matchRegex:
          path: stringData.enc
          pattern: "^[a-zA-z0-9]{64}$"
