publiccodeYmlVersion: '0.2'
applicationSuite: BundesMessenger
categories:
  - communications
  - collaboration
developmentStatus: stable
name: BundesMessenger Helm Chart
description:
  de:
    genericName: Messenger
    longDescription: |
      Das BundesMessenger Backend ist Bestandteil einer Sammlung von
      Repositories zum BundesMessenger. Allgemeine Informationen zum Projekt
      befinden sich im übergeordneten [BundesMessenger
      Repository](https://gitlab.opencode.de/bwi/bundesmessenger/info).


      Dieses Repository stellt ein [Helm Chart](https://helm.sh/) zur
      automatisierten Bereitstellung eines Backends bzw. Infrastruktur für die
      Nutzung mit dem BundesMessenger Client zur Verfügung. Hauptbestandteil ist
      der [Synapse Server](https://github.com/element-hq/synapse), Dieser ist
      eine Matrix homeserver Implementierung in Python auf Basis des [Matrix
      Protokolls](https://matrix.org/).
    shortDescription: BundesMessenger Backend Helm Chart
    features:
      - Messaging
      - Direktnachrichten
      - Chaträume
      - Föderation
      - Statusanzeige
      - Umfragen
      - Standort teilen
      - Sprachnachrichten
      - Emojis und Reaktionen
      - Videokonferenzen (Huddles)
      - Profilverwaltung
      - Sicherheitsfunktionen
      - Plattformübergreifend
platforms:
  - linux
releaseDate: '2025-03-31'
softwareType: standalone/backend
url: 'https://gitlab.opencode.de/bwi/bundesmessenger/backend/helm-chart'
logo: ./docs/images/bum_core_sw.svg
dependsOn:
  open:
    - name: Kubernetes
      optional: false
      versionMin: 1.29.14
softwareVersion: 1.13.0
maintenance:
  contacts:
    - name: BWI GmbH
      email: bundesmessenger@bwi.de
  contractors:
    - name: BWI GmbH
      until: '2027-12-31'
      website: 'https://messenger.bwi.de/'
  type: internal
legal:
