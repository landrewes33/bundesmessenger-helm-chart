      - image
      - podSecurityContext
      - securityContext
      - resources
      - livenessProbe
      - readinessProbe
      - nodeSelector
      - tolerations
      - affinity
      - apps
      - existingSecret
    unevaluatedProperties: false
  wellknown:
    type: object
    title: nginx-Server, der auf alle `/.well-known/matrix/server`-Anfragen antwortet
    description: Ermöglicht den Verbund ohne Hinzufügen von SRV-Einträgen zu DNS.
    properties:
      enabled:
        type: boolean
        description: Aktivieren des Wellknown-Container.
        default: true
      host:
        type: ["null", "string"]
        title: DNS-Name des Wellknown-Servers
        description: Fall nicht gesetzt, wird der öffentliche Servername verwendet.
        default: null
        examples:
          - wellknown.example.org
      port:
        type: integer
        title: Port des Wellknown-Servers
        default: 443
      server:
        type: ["null", "object"]
        title: >-
          Die Host- und Port-Kombination, die auf .well-known/matrix/server zu
          bedienen ist
        description: >-
          Falls null, wird der der Homeserver-Name (publicServerName, sonst
          serverName) mit Port 443 verwendet.
        properties:
          m.server:
            $comment: ""
            type: string
            pattern: ^([A-Za-z0-9.-]+):([0-9]+)$
        examples:
          - m.server: matrix.example.com:443
        required:
          - m.server
        unevaluatedProperties: true
      client:
        type: object
        title: Daten, die auf .well-known/matrix/client bereitgestellt werden sollen
        description: >-
          Die Angabe des Objektes "de.bwi": {"data_privacy_url":
          "https://example.com/privacy", "imprintUrl":
          "https://example.com/imprint"} ist verpflichtend, wenn keine
          .Values.dataPrivacyUrl und .Values.imprintUrl angegeben wurde und auf
          den WellKnown-Server verzichtet wird.


          Alle Angaben, welche die selben Schlüssel wie in der
          Standardkonfiguration setzen, überschreiben unsere generierte
          client.json. Zusätzliche Angaben werden hinzugefügt.
        default: {}
        examples:
          - io.element.e2ee:
              secure_backup_required: true
              secure_backup_setup_methods:
                - passphrase
              outbound_keys_pre_sharing_mode: on_room_opening
            m.homeserver:
              base_url: https://matrix.example.com
            de.bwi:
              data_privacy_url: https://example.com/privacy
              imprintUrl: https://example.com/imprint
        unevaluatedProperties: true
      replicaCount:
        type: integer
        title: Replica-Count
        default: 1
      extraData:
        type: object
        title: >-
          Zusätzliche Daten, die unter .well-known/matrix/<data> bereitgestellt werden
        description: >-
          Dictionaries werden in JSON umgewandelt, einfache Strings werden
          direkt ausgeliefert. (Beispiel MSC1929)
        default: {}
        examples:
          - support:
              admins:
                - matrix_id: "@admin:example.com"
                  email_address: admin@example.com
                  role: admin
              support_page: https://example.com/support
        unevaluatedProperties: true
      htdocsPath:
        type: string
        minLength: 1
        title: Ein benutzerdefinierter htdocs-Pfad
        description: >-
          Nützlich, wenn ein anderes Image ausgeführt wird.
        default: /usr/share/nginx/html
      image:
        type: object
        allOf:
          - $ref: "#/$defs/image"
            title: Das Webserver Image
            default:
              registry: registry.opencode.de
              repository: bwi/bundesmessenger/backend/container-images/nginx
              pullPolicy: IfNotPresent
          - properties:
              pullSecrets:
                $ref: "#/$defs/pullSecrets"
        required:
          - registry
          - repository
          - tag
          - pullPolicy
          - pullSecrets
        unevaluatedProperties: false
      podSecurityContext:
        $ref: "#/$defs/podSecurityContext"
        type: object
        title: Informationen zum Sicherheitskontext, die der Pod übernehmen soll
        default:
          runAsUser: 1001
          runAsGroup: 1001
          fsGroup: 1001
        unevaluatedProperties: false
      securityContext:
        $ref: "#/$defs/securityContext"
        type: object
        title: Konfiguration für die Container-Sicherheitsrichtlinie
        default:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        unevaluatedProperties: false
      resources:
        $ref: >-
          https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.ResourceRequirements.schema.json
        type: object
        title: Resource-Konfiguration für well-known-Server
        properties:
          limits:
            properties:
              cpu:
                title: >-
                  Rechenressourcengrenzen, die auf den well-known server anzuwenden sind
                default: 50m
              memory:
                title: >-
                  RAM Ressourcengrenzen, die auf den well-known server anzuwenden sind
                default: 50Mi
          requests:
            properties:
              cpu:
                title: >-
                  Anforderungen an Rechenressourcen, die auf den well-known
                  server anzuwenden sind
                default: 5m
              memory:
                title: >-
                  Anforderungen an RAM Ressourcen, die auf den well-known server
