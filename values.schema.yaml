      tolerations:
        $ref: >-
          https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.PodSpec.schema.json#/properties/tolerations
        type: array
        title: Tolerations/Tains Konfiguration für den Confighub
        default: []
      affinity:
        $ref: >-
          https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.PodSpec.schema.json#/properties/affinity
        type: object
        title: Affinitäts-Konfiguration für den Confighub
        default: {}
        unevaluatedProperties: false
    required:
      - enabled
