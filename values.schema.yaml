        description: Wird nur berücksichtigt, wenn `existingSecret` gesetzt ist.
        properties:
          livekitUrl:
            type: string
            title: Verweisname zur URL des LiveKit Servers
            default: livekit-url
          livekitKey:
            type: string
            title: Verweisname zum Schlüssel für den LiveKit Servers
            default: livekit-key
          livekitSecret:
            type: string
            title: Verweisname zum Secret des LiveKit Servers
            default: livekit-secret
        required:
          - livekitUrl
          - livekitKey
          - livekitSecret
        unevaluatedProperties: false
