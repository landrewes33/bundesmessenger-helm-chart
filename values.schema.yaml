        description: >-
          Key und Secret müssen mit den Angabe im LiveKit Server überein stimmen.
        properties:
          url:
            type: string
            title: URL des LiveKit Servers
            default: wss://livekit.example.com
          key:
            type: string
            title: Schlüssel für den LiveKit Servers
            default: devkey
          secret:
            type: string
            title: Secret des LiveKit Servers
            default: secret
        required:
          - url
          - key
          - secret
