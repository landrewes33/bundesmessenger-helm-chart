  additionalConfig:
    type: object
    title: zusätzliche Konfigurationen für den BundesMessenger
    description: >-
      Konfigurationen, die übergreifend sind und nicht nur eine einzelne
      Komponenten betreffen. Die Abschnitte `config` und `extraConfig` betreffen
      Einstellungen, die direkt in die Konfiguration von Synapse eingehen. Die
      Abschnitte `wellknown` oder `webclient` betreffen bevorzugt diese
      Komponenten direkt. Die Einstellungen, die hier statt finden, greifen
      komponentenübergreifend, z.B. alle Clients (auch die mobilen Apps) und
      nicht nur den Webclient.
    properties:
      verifyJWT:
        type: array
        title: Liste an JWTs, die dem Client bereit gestellt werden
        description: >-
          Wird verwendet, um die Infrastruktur als legitim auszuweisen. Die JWTs
          werden via `<public_baseurl>/_bum/configure/v1/verify` abgerufen.
        items:
          type: string
        default: []
      dsgvoExport:
        type: object
        properties:
          enabled:
            type: boolean
          serviceAccount:
            type: object
            properties:
              create:
                type: boolean
              name:
                type: ["null", "boolean"]
                title: Name des ServiceAccounts für den dsgo-exporter-job
                default: null
                examples:
                  - non-default-dsgvo-exporter-name
            required:
              - create
            unevaluatedProperties: false
        required:
          - enabled
          - serviceAccount
        unevaluatedProperties: false
      locationSharing:
        type: object
        properties:
          enabled:
            type: boolean
            default: false
          map_style_url:
            type: ["null", "string"]
          map_style_config:
            type: ["null", "object"]
            properties:
              version:
                type: ["null", "number"]
              name:
                type: ["null", "string"]
                minLength: 1
              sources:
                type: ["null", "object"]
                properties:
                  wms_topplus:
                    type: ["null", "object"]
                    properties:
                      type:
                        type: ["null", "string"]
                        minLength: 1
                      tiles:
                        type: ["null", "array"]
                        items:
                          properties: {}
                      tileSize:
                        type: ["null", "number"]
                      attribution:
                        type: ["null", "string"]
                        minLength: 1
                    unevaluatedProperties: true
                unevaluatedProperties: true
              layers:
                type: ["null", "array"]
                minItems: 1
                items:
                  properties:
                    id:
                      type: ["null", "string"]
                      minLength: 1
                    source:
                      type: ["null", "string"]
                      minLength: 1
                    source-layer:
                      type: ["null", "string"]
                      minLength: 1
                    type:
                      type: ["null", "string"]
                      minLength: 1
                uniqueItems: true
            unevaluatedProperties: true
        if:
          properties:
            enabled:
              const: true
        then:
          required:
            - map_style_config
        required:
          - enabled
        unevaluatedProperties: false
      maintenance:
        type: object
        default: {}
        unevaluatedProperties: true
    required:
      - verifyJWT
      - dsgvoExport
      - locationSharing
      - maintenance
    unevaluatedProperties: false
