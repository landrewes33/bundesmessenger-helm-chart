  contentscanner:
    type: object
    properties:
      enabled:
        type: boolean
        title: Aktivieren des Matrix-Content-Scanner
        description: Mittelsmann zwischen AV und Matrix-Synapse
        default: false
      allowed_mimetypes:
        type: ["null", "array"]
        title: Liste der zulässigen MIME-Typen
        description: >-
          Falls angegeben, darf `blocked_mimetypes` nicht ebenfalls angegeben werden.
          Wenn eine Datei einen MIME-Typ hat, der nicht in dieser Liste enthalten ist,
          wird ihr Scan als fehlgeschlagen betrachtet.
          Nicht erkannte Binärdateien werden als „application/octet-stream“ betrachtet.
          Nicht erkannte Textdateien werden als „text/plain“ betrachtet.
          Optional, standardmäßig werden alle MIME-Typen zugelassen.
        items:
          type: string
        default: null
      blocked_mimetypes:
        type: ["null", "array"]
        minItems: 1
        title: Liste der blockierten MIME-Typen
        description: >-
          Falls angegeben, darf `allowed_mimetypes` nicht ebenfalls angegeben werden.
          Falls angegeben, führt eine Datei, deren MIME-Typ auf dieser
          Liste steht, zu einem Scan, der als fehlgeschlagen gilt.
          Nicht erkannte Binärdateien werden als `application/octet-stream` betrachtet.
          Nicht erkannte Textdateien werden als `text/plain` betrachtet.dann
        items:
          type: string
        default: null
      max_file_size:
        type: string
        title: Die maximale zwischenspeicherbare Dateigröße
        description: >-
          Wenn eine Datei größer als diese Größe ist, wird eine Kopie davon
          nicht zwischengespeichert, selbst wenn der Scan erfolgreich ist.
          Wenn die Datei erneut angefordert wird, wird sie erneut vom Homeserver
          heruntergeladen, aber nicht auf die Festplatte geschrieben oder gescannt.
        default: "100MB"
      max_cache_size:
        type: integer
        title: Maximale Anzahl von Ergebnissen, die im Cache gespeichert werden können
        description: >-
          Wenn mehr Dateien gescannt werden, bevor vorhandene Elemente ihre TTL erreichen,
          werden die zuletzt aufgerufenen entfernt.
        default: 2048
      ttl:
        type: string
        title: >-
          Die maximale Zeit, die ein Eintrag im Cache verbleibt, bevor er entfernt wird
        default: "1d"
      extraVolumes:
        type: array
        title: >-
          Zusätzliche in den Matrix-Content-Scanner zu mountende Datenträger (Volumes)
        items:
          $ref: >-
            https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.Volume.schema.json
          type: object
          unevaluatedProperties: false
        examples:
          - - name: custom-scanscript
              configMap:
                name: custom-scanscript
                defaultMode: 493
                items:
                  - key: script.sh
                    path: script.sh
      extraVolumeMounts:
        type: array
        title: >-
          Zusätzliche in den Matrix-Content-Scanner zu mountende
          Datenträgerpfade (Volumes)
        items:
          $ref: >-
            https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.VolumeMount.schema.json
          type: object
          unevaluatedProperties: false
        examples:
          - - name: custom-scanscript
              mountPath: /opt/custom/
              subMountPath: script.sh
              readOnly: true
      scanScript:
        type: string
        title: Names und Pfad des Scriptes welches zum Scannen ausgeführt wird
        description: >-
          Das Script muss in der ConfigMap `contentscanner.existingConfigmap`
          enthalten sein.


          Wenn kein Schadcode gefunden wurde, muss das Script den Exit-Code 0
          zurück geben.


          Siehe:
          https://github.com/element-hq/matrix-content-scanner-python/blob/da1783c6bce638c3f616fb061425520fc19863a6/config.sample.yaml#L22-L26
        default: /opt/scanner.sh
      image:
        $ref: "#/$defs/image"
        type: object
        title: Konfiguration des Image/Repository
        default:
          registry: registry.opencode.de
          repository: >-
            bwi/bundesmessenger/backend/container-images/matrix-content-scanner
          pullPolicy: IfNotPresent
        required:
          - registry
          - repository
          - tag
          - pullPolicy
        unevaluatedProperties: false
      replicaCount:
        type: integer
        default: 1
      resources:
        $ref: >-
          https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.ResourceRequirements.schema.json
        type: object
        title: Ressourcen-Konfiguration für den Content-Scanner
        properties:
          limits:
            properties:
              cpu:
                title: >-
                  Rechenressourcengrenzen, die auf den
                  Matrix-Content-Scanner-Container anzuwenden sind
                default: 500m
              memory:
                title: >-
                  RAM Ressourcengrenzen, die auf den
                  Matrix-Content-Scanner-Container anzuwenden sind
                default: 1Gi
          requests:
            properties:
              cpu:
                title: >-
                  Anforderungen an Rechenressourcen, die auf den
                  Matrix-Content-Scanner-Container anzuwenden sind
                default: 300m
              memory:
                title: >-
                  Anforderungen an RAM Ressourcen, die auf den
                  Matrix-Content-Scanner-Container anzuwenden sind
                default: 500Mi
        unevaluatedProperties: false
      podSecurityContext:
        $ref: "#/$defs/podSecurityContext"
        type: object
        title: Informationen zum Sicherheitskontext, die der Pod übernehmen soll
        default:
          runAsUser: 1334
          runAsGroup: 1334
          fsGroup: 1334
        unevaluatedProperties: false
      securityContext:
        $ref: "#/$defs/securityContext"
        type: object
        title: Konfiguration für die Container-Sicherheitsrichtlinie
        default:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        unevaluatedProperties: false
    oneOf:
      - properties:
          allowed_mimetypes:
            type: "null"
          blocked_mimetypes:
            type: "null"
      - properties:
          allowed_mimetypes:
            type: array
          blocked_mimetypes:
            type: "null"
        required:
          - allowed_mimetypes
      - properties:
          allowed_mimetypes:
            type: "null"
          blocked_mimetypes:
            type: array
        required:
          - blocked_mimetypes
    required:
      - enabled
      - extraVolumes
      - extraVolumeMounts
      - scanScript
      - image
      - replicaCount
      - resources
      - podSecurityContext
      - securityContext
    unevaluatedProperties: false
