    unevaluatedProperties: false
  postgresql:
    type: object
    title: Konfiguration des internen PostgreSQL-Servers
    description: >-
      Der mitgelieferte PostgreSQL-Datenbankserver bietet eine einfache und
      schnelle Möglichkeit, Demo- und Testsysteme des BundesMessengers
      aufzusetzen. Nicht empfohlen ist die Aktivierung für Produktivsysteme.


      Empfohlen: Um einen extern vorhandenen PostgreSQL-Server zu verwenden,
      setzen Sie `postgresql.enabled` auf `false` und konfigurieren Sie den
      `externalPostgresql`-Block.
    properties:
      enabled:
        type: boolean
        title: Aktivieren des internen PostgreSQL-Servers
        description: >-
          Hinweis: Nur für Demo- und Testsysteme empfohlen. Um einen extern
          vorhandenen PostgreSQL-Server zu verwenden, setzen Sie
          `postgresql.enabled` auf `false` und konfigurieren Sie den
          `externalPostgresql`-Block.
        default: false
      image:
        $ref: "#/$defs/image"
        type: object
        title: Das zu verwendende PostgreSQL-Container-Abbild
        properties:
          pullSecrets:
            type: array
            title: Liste von Kubernetes Pull-Secrets
            items:
              type: string
            default: []
        default:
          registry: docker.io
          repository: bitnami/postgresql
          pullSecrets: []
          pullPolicy: IfNotPresent
        required:
          - registry
          - repository
          - tag
          - pullSecrets
          - pullPolicy
        unevaluatedProperties: true
      auth:
        type: object
        title: Authentifizierung gegenüber dem internen PostgreSQL-Server
        properties:
          database:
            type: string
            title: Name der PostgreSQL-Datenbank
            default: synapse_db
          username:
            type: string
            title: Name des PostgreSQL-Nutzers
            default: synapse
          password:
            type: ["null", "string"]
            title: Password für PostgreSQL Nutzer
            default: synapse
          existingSecret:
            type: string
            minLength: 1
            title: Name des Secrets, in dem das PostgreSQL-Passwort steht
            description: >-
              Ist `postgresql.enabled` und es existiert kein Secret mit dem
              angegebenen Namen, so wird ein neues Secret automatisch erstellt
              und verwendet.
            default: postgresql
          secretKeys:
            type: object
            title: Schlüsselinformationen für ein genanntes Secret
            properties:
              userPasswordKey:
                type: string
                title: Verweis im `existingSecret` auf das Datenbank-Passwort
                description: Wird nur berücksichtigt, wenn `existingSecret` gesetzt ist.
                default: password
              adminPasswordKey:
                type: string
                title: Verweis im `existingSecret` auf das Passwort des postgres-Nutzers
                description: Wird nur berücksichtigt, wenn `existingSecret` gesetzt ist.
                default: postgres-password
            required:
              - userPasswordKey
              - adminPasswordKey
            unevaluatedProperties: true
        required:
          - database
          - username
          - existingSecret
          - secretKeys
        unevaluatedProperties: true
      containerPorts:
        type: object
        properties:
          postgresql:
            type: integer
            title: Port des PostgreSQL-Containers
            default: 5342
        required:
          - postgresql
        unevaluatedProperties: true
      primary:
        type: object
        properties:
          service:
            type: object
            properties:
              ports:
                type: object
                properties:
                  postgresql:
                    type: integer
                    title: Port des PostgreSQL-Service
                    default: 5432
                required:
                  - postgresql
                unevaluatedProperties: true
            required:
              - ports
            unevaluatedProperties: true
          initdb:
            type: object
            properties:
              args:
                type: string
                description: Extra Argumente zur Initialisierung der Datenbank
                default: --lc-collate=C --lc-ctype=C --encoding=UTF8
            unevaluatedProperties: true
          extendedConfiguration:
            type: string
            title: Extra Konfiguration der Datenbank
            description: >-
              Die Anzahl an max. Verbindungen ist oft eine Limitierung, da jeder
              Synapseprozess seine Verbindungen zur Datenbank hält
            default: max_connections = 1024
          persistence:
            type: object
            title: Persistenzkonfiguration für Storage für PostgreSQL
            properties:
              storageClass:
                type: string
                default: ""
              size:
                type: string
                default: 16Gi
            required:
              - storageClass
              - size
            unevaluatedProperties: true
          resources:
            $ref: >-
              https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.ResourceRequirements.schema.json
            type: object
            properties:
              limits:
                properties:
                  cpu:
                    title: >-
                      Rechenressourcengrenzen, die auf den PostgreSQL-Container
                      anzuwenden sind
                    default: 1
                  memory:
                    title: >-
                      RAM Ressourcengrenzen, die auf den PostgreSQL-Container
                      anzuwenden sind
                    default: 4096Mi
              requests:
                properties:
                  cpu:
                    title: >-
                      Anforderungen an Rechenressourcen, die auf den
                      PostgreSQL-Container anzuwenden sind
                    default: 250m
                  memory:
                    title: >-
                      Anforderungen an RAM Ressourcen, die auf den
                      PostgreSQL-Container anzuwenden sind
                    default: 256Mi
            unevaluatedProperties: false
        required:
          - service
          - initdb
          - extendedConfiguration
          - persistence
          - resources
        unevaluatedProperties: true
      extraArgs:
        $comment: This config option is not part of the `postgresql` chart.
        type: object
        title: Zusätzliche Argumente für die Datenbankverbindung
        description: >-
          Ref: https://element-hq.github.io/synapse/latest/postgres.html#synapse-config
        additionalProperties:
          type: ["null", "string", "number", "integer", "boolean"]
        default: {}
        unevaluatedProperties: false
    required:
      - enabled
      - image
      - auth
      - containerPorts
      - primary
      - extraArgs
    unevaluatedProperties: true
  externalPostgresql:
    type: object
    title: Authentifizierung für externen PostgreSQL
    properties:
      host:
        type: string
        minLength: 1
        title: Hostname für externen PostgreSQL Server
        default: postgres-4-matrix-postgresql.postgres.svc.cluster.local
      port:
        $ref: >-
          https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.ContainerPort.schema.json#/properties/containerPort
        type: integer
        title: Port für externe PostgreSQL-DB
        default: 5342
      database:
        type: string
        minLength: 1
        title: DB-Name für PostgreSQL-DB
        default: synapse_db
      username:
        type: string
        minLength: 1
        title: Nutzername für PostgreSQL-DB
        default: synapse
      password:
        type: ["null", "string"]
        minLength: 1
        title: Password für PostgreSQL Nutzer
        default: synapse
      existingSecret:
        type: ["null", "string"]
        title: Bestehendes Secret
        description: Wird anstelle eines statischen Passwortes verwendet.
      existingSecretPasswordKey:
        type: ["null", "string"]
        title: Passwortschlüssel
        description: Wird aus dem bestehenden Secret abgerufen.
      sslmode:
        type: string
        enum:
          - disable
          - allow
          - prefer
          - require
          - verify-ca
          - verify-full
        title: Verwendeter SSL-Modus.
        description: >-
          https://www.postgresql.org/docs/current/libpq-ssl.html#LIBPQ-SSL-SSLMODE-STATEMENTS
        default: prefer
      extraArgs:
        type: object
        title: Zusätzliche Argumente für die Datenbankverbindung
        description: >-
          ref: https://element-hq.github.io/synapse/latest/postgres.html#synapse-config
        default: {}
        unevaluatedProperties: false
    required:
      - host
      - port
      - database
      - username
      - sslmode
      - extraArgs
    unevaluatedProperties: false
  redis:
    type: object
    title: Konfiguration des Redis-Servers
    description: >-
      Diese Konfiguration ist für den internen Redis, der für die Verwendung mit
      Worker/Sharding eingesetzt wird. Für einen externen Redis-Server setzen
      Sie `redis.enabled: false` und konfigurieren den `externalRedis`-Block.
    properties:
      enabled:
        type: boolean
        tiitle: Aktivieren des internen Redis-Servers
        description: >-
          Hinweis: Durch Setzten auf `true`, wird der `externalRedis`-Block ignoriert.
        default: true
      image:
        $ref: "#/$defs/image"
        type: object
        title: Das verwendete Redis-Image
        properties:
          pullSecrets:
            type: array
            title: Liste von Kubernetes Pull-Secrets
            items:
              type: string
            default: []
            examples:
              - ["myRegistryKeySecretName"]
        default:
          registry: registry.opencode.de
          repository: bwi/bundesmessenger/backend/container-images/redis
          pullSecrets: []
          pullPolicy: IfNotPresent
        required:
          - registry
          - repository
          - tag
          - pullSecrets
          - pullPolicy
        unevaluatedProperties: true
      auth:
        type: object
        title: Authentifikation gegenüber Redis
        description: >-
          Verwenden Sie ein bestehendes Secret mit `redis-password`-Eintrag
          anstelle eines statischen Passworts.
        properties:
          enabled:
            type: boolean
            const: true
            title: Aktivieren der Authentifikation
            default: true
          password:
            type: ["null", "string"]
            title: Password für Redis
            description: Ist der Wert null, wird stattdessen `existingSecret` verwendet.
            default: null
          existingSecret:
            type: string
            minLength: 1
            title: Name des Secrets mit dem Redis-Passwort
            description: >-
              Existiert noch kein Kubernetes Secret mit dem angegebenen Namen,
              wird es mit einem zufälligen Passwort automatisch generiert.
            default: redis
          existingSecretPasswordKey:
            type: string
            title: Verweis im `existingSecret` auf das Redis-Passwort
            description: Wird nur berücksichtigt, wenn `existingSecret` gesetzt ist.
            default: redis-password
        required:
          - enabled
          - existingSecret
          - existingSecretPasswordKey
        unevaluatedProperties: true
      architecture:
        type: string
        enum:
          - standalone
          - replication
        title: Form der Architektur des Deployments
        default: standalone
      master:
        type: object
        properties:
          kind:
            type: string
            enum:
              - Deployment
              - StatefulSet
              - DaemonSet
            default: StatefulSet
          persistence:
            type: object
            title: Persistenzkonfiguration des Redis
            description: >-
              Beachten Sie, dass Synapse Redis nur als
              Synchronisierungsdienstprogramm verwendet, so dass keine Daten
              jemals persistiert werden müssen.
            properties:
              enabled:
                type: boolean
                default: false
            unevaluatedProperties: true
          service:
            type: object
            properties:
              ports:
                type: object
                properties:
                  redis:
                    $ref: >-
                      https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.ContainerPort.schema.json#/properties/containerPort
                    type: integer
                    default: 6379
                unevaluatedProperties: true
            unevaluatedProperties: true
          resources:
            $ref: >-
              https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.ResourceRequirements.schema.json
            type: object
            properties:
              limits:
                properties:
                  cpu:
                    title: >-
                      Rechenressourcengrenzen, die auf den Redis-Container
                      anzuwenden sind
                    default: 500m
                  memory:
                    title: >-
                      RAM Ressourcengrenzen, die auf den Redis-Container
                      anzuwenden sind
                    default: 768Mi
              requests:
                properties:
                  cpu:
                    title: >-
                      Anforderungen an Rechenressourcen, die auf den
                      Redis-Container anzuwenden sind
                    default: 300m
                  memory:
                    title: >-
                      Anforderungen an RAM Ressourcen, die auf den
                      Redis-Container anzuwenden sind
                    default: 256Mi
            unevaluatedProperties: false
        unevaluatedProperties: true
    required:
      - enabled
      - image
      - auth
      - architecture
      - master
    unevaluatedProperties: true
  externalRedis:
    type: object
    title: Authentifizierung für externen Redis Server
    properties:
      host:
        type: string
        minLength: 1
        title: Hostname für externen Redis Server
        default: redis
      port:
        $ref: >-
          https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.ContainerPort.schema.json#/properties/containerPort
        type: integer
        title: Port für externe PostgreSQL-DB
        default: 6379
      password:
        type: ["null", "string"]
        title: Password für Redis
        default: synapse
      existingSecret:
        type: ["null", "string"]
        title: Bestehendes Secret
        description: Wird anstelle eines statischen Passwortes verwendet.
        default: null
      existingSecretPasswordKey:
        type: ["null", "string"]
        title: Schlüsselinformationen für ein genanntes Secret
        default: redis-password
    required:
      - host
      - port
    unevaluatedProperties: false
  ingress:
    type: object
    properties:
      enabled:
        type: boolean
        default: true
      traefikPaths:
        type: boolean
        default: false
      annotations:
        $comment: >-
          Allow unevaluatedProperties to work around a bug in check-jsonschema:
          https://github.com/json-schema-org/JSON-Schema-Test-Suite/pull/755
        $ref: >-
          https://schema.bundesmessenger.dev/kubernetes/io.k8s.apimachinery.pkg.apis.meta.v1.ObjectMeta.schema.json#/properties/annotations
        type: object
        description: >-
          Annotations zur Konfiguration des Ingress
          (regex,proxy-body-size,owasp,cors). Folgende Einträge sind bei der
          Nutzung des Cert-Managers mit lets-encrypt notwendig:

          kubernetes.io/ingress.class: nginx

          kubernetes.io/tls-acme: "true"
        default:
          nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
          nginx.ingress.kubernetes.io/cors-allow-methods: PUT, GET, POST, OPTIONS
          nginx.ingress.kubernetes.io/cors-allow-origin: "*"
          nginx.ingress.kubernetes.io/enable-cors: "true"
          nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
          nginx.ingress.kubernetes.io/proxy-body-size: 50m
          nginx.ingress.kubernetes.io/use-regex: "true"
        unevaluatedProperties: true
      annotationsAdminAPI:
        type: object
        title: Annotations zur Konfiguration des Ingress für die Admin-API
        description: >-
          Dies ermöglicht z.B. das Konfigurieren eines IP-Filters für den
          administrativen Zugriff.
        additionalProperties:
          $ref: >-
            https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.networking.v1.IPBlock.schema.json#/properties/cidr
          type: string
        examples:
          - nginx.ingress.kubernetes.io/whitelist-source-range: >-
              192.168.10.0/24, 10.10.12.0/24, 10.0.0.1
        unevaluatedProperties: false
      annotationsAdminPortal:
        $ref: >-
          https://schema.bundesmessenger.dev/kubernetes/io.k8s.apimachinery.pkg.apis.meta.v1.ObjectMeta.schema.json#/properties/annotations
        type: object
        title: Annotations zur Konfiguration des Ingress für das Admin-Portal
        description: >-
          Dies ermöglicht z.B. das Konfigurieren eines IP-Filters für den
          administrativen Zugriff.
        default: {}
        examples:
          - nginx.ingress.kubernetes.io/whitelist-source-range: >-
              192.168.10.0/24, 10.10.12.0/24, 10.0.0.1
        unevaluatedProperties: false
      csHosts:
        type: array
        description: >-
          Hosts, die der Ingress-Konfiguration für die Verarbeitung von
          Client-to-Server-API-Anfragepfade hinzugefügt werden sollen. Hinweis:
          serverName bzw. publicServerName wird einbezogen, wenn
          includeServerName gesetzt ist. (default)


          Beispiel:
            - matrix.example.com
        items:
          type: string
        default: []
      hosts:
        type: array
        description: >-
          Zusätzliche Hosts, die der Ingress-Konfiguration für die Bearbeitung
          von Server-zu-Server-API-Anfragen hinzugefügt werden sollen. Hinweis:
          serverName bzw. publicServerName wird einbezogen, wenn
          includeServerName gesetzt ist. (default)


          Beispiel:
            - example.com
        items:
          type: string
        default: []
      wkHosts:
        type: array
        description: >-
          Zusätzliche Hosts, die der Ingress-Konfiguration für die Bearbeitung
          von wellknown-Anfragen hinzugefügt werden sollen. Hinweis: serverName
          bzw. publicServerName wird einbezogen, wenn includeServerName gesetzt
          ist. (default)


          Beispiel:
            - example.com
        items:
          type: string
        default: []
      paths:
        type: array
        description: >-
          Zusätzliche Pfade, die zu den Server-zu-Server-Eingangsblöcken
          hinzugefügt werden sollen. Werden vor dem `/_matrix` Catch-all-Pfad
          eingefügt.


          Beispiele:
            - path: /_matrix/media
              pathType: Prefix
              backend:
                service:
                  name: matrix-media-repo
                  port: 8000
        items:
          $ref: >-
            https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.networking.v1.HTTPIngressPath.schema.json#/properties
          type: object
          unevaluatedProperties: false
        default: []
      csPaths:
        type: array
        description: >-
          Zusätzliche Pfade, die zu den Client-zu-Server-Eingangsblöcken
          hinzugefügt werden sollen. Werden vor den `/_matrix` und `/_synapse`
          Catch-all-Pfaden eingefügt.


          Beispiele:
            - path: /_matrix/media
              pathType: Prefix
              backend:
                service:
                  name: matrix-media-repo
                  port: 8000
        items:
          $ref: >-
            https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.networking.v1.HTTPIngressPath.schema.json#/properties
          type: object
          unevaluatedProperties: false
        default: []
      includeUnderscoreSynapse:
        type: boolean
        description: >-
          Soll der `/_synapse`-Pfad im Ingress enthalten sein, werden die
          Client-APIs unter diesem Pfad bereitgestellt.
        default: true
      includeServerName:
        type: boolean
        description: >-
          Nimmt `serverName` bzw. `publicServerName` in die Liste der Domains
          für den Ingress mit auf. Kann auf `false` gesetzt werden, wenn die
          Hauptdomäne auf irgendeine externe Weise verwaltet wird.
        default: true
      tls:
        type: array
        title: >-
          Zusätzliche Pfade, die zu den Client-zu-Server-Eingangsblöcken
          hinzugefügt werden sollen
        description: >-
          Werden vor den `/_matrix` und `/_synapse` Catch-all-Pfaden eingefügt.


          Beispiele:
            - path: /_matrix/media
              pathType: Prefix
              backend:
                service:
                  name: matrix-media-repo
                  port: 8000
        items:
          $ref: >-
            https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.networking.v1.IngressTLS.schema.json
          type: object
          unevaluatedProperties: false
        default: []
      className:
        type: string
        default: nginx
    required:
      - enabled
      - traefikPaths
      - annotations
      - annotationsAdminAPI
      - csHosts
      - hosts
      - wkHosts
      - paths
      - csPaths
      - includeUnderscoreSynapse
      - includeServerName
      - tls
      - className
    unevaluatedProperties: false
  mas:
    type: object
    properties:
      enabled:
        type: boolean
        title: Aktivieren des Matrix-Authentication-Service.
        default: false
      image:
        $ref: "#/$defs/image"
        type: object
        title: Konfiguration des MAS Image
        default:
          registry: ghcr.io
          repository: element-hq/matrix-authentication-service
          pullPolicy: IfNotPresent
        required:
          - registry
          - repository
          - tag
          - pullPolicy
        unevaluatedProperties: false
      uri:
        type: string
        title: URI für den Matrix-Authentication-Service bzw. OpenID-Connect Provider.
        description: >-
          Eine URI ist dringend ratsam, damit der Dienst routing-technisch
          getrennt ist. Ein stabiles Deployment ohne eigene URI wurde bisher
          nicht erprobt.
      postgresql:
        type: object
        properties:
          host:
            type: ["null", "string"]
            title: Host für PostgreSQL-DB von MAS
            description: Falls ungesetzt, wird die Haupt-PostgreSQL-Instanz verwendet.
            default: null
            examples:
              - masdb.example.org
          port:
            type: integer
            title: Port für PostgreSQL-DB von MAS
            default: 5432
          database:
            type: string
            minLength: 1
            title: DB-Name für PostgreSQL-DB von MAS
            default: mas_synapse
          username:
            type: string
            minLength: 1
            title: Nutzername für PostgreSQL-DB von MAS
            default: massynapse
          password:
            type: string
            minLength: 1
            title: Password für PostgreSQL Nutzer von MAS
            default: mas-synapse
          sslmode:
            type: string
            enum:
              - disable
              - allow
              - prefer
              - require
              - verify-ca
              - verify-full
            title: Verwendeter SSL-Modus
            description: >-
              https://www.postgresql.org/docs/current/libpq-ssl.html#LIBPQ-SSL-SSLMODE-STATEMENTS
            default: prefer
          extraArgs:
            type: object
            title: Zusätzliche Optionen für MAS PostgreSQL
            description: >-
              https://www.postgresql.org/docs/current/libpq-connect.html#LIBPQ-PARAMKEYWORDS
            additionalProperties:
              type: string
            default: {}
            unevaluatedProperties: false
        required:
          - port
          - database
          - username
          - password
          - sslmode
          - extraArgs
        unevaluatedProperties: false
      paths:
        type: array
        title: URLs überlagern die URLs vom Synapse
        description: >-
          D.h., dass diese URLs vom MAS anstatt von Synapse beantwortet werden
          müssen. Die hier definierten URLs werden von dem Ingress des Synapse
          entfernt und dem MAS zugeordnet, wenn vorhanden.
        items:
          type: string
        default:
          - /_matrix/client/(api/v1|r0|v3|unstable)/login
          - /_matrix/client/(api/v1|r0|v3|unstable)/logout
          - /_matrix/client/(api/v1|r0|v3|unstable)/refresh
      masPaths:
        type: array
        title: >-
          Liste der URL-Einstiegspunkte, die der MAS benötigt bzw. der `mas.uri`
          zugeordnet werden
        items:
          type: string
        default:
          - /authorize
          - /oauth2
          - /account
          - /graphql
          - /.well-known/openid-configuration
          - /
      upstream_oauth2_provider:
        type: array
        title: >-
          Konfiguration eines Upstream Authentification Providers zur
          Delegierung der Authentifizierung
        description: >-
          Die Angaben werden automatisch in die Konfiguration unter
          `upstream_oauth2.providers` bereit gestellt.


          https://matrix-org.github.io/matrix-authentication-service/setup/sso.html#configure-an-upstream-sso-provider

          https://matrix-org.github.io/matrix-authentication-service/usage/configuration.html#upstream_oauth2
        items:
          type: object
          properties:
            id:
              type: string
          required:
            - id
          unevaluatedProperties: true
        default: []
      clients:
        type: array
        title: OIDC Clients
        description: >-
          Werden zusätzlich zum Synypase Client konfiguriert.


          https://matrix-org.github.io/matrix-authentication-service/reference/configuration.html#clients
        items:
          type: object
          unevaluatedProperties: true
      passwords:
        type: object
        title: Passwords.
        description: >-
          https://matrix-org.github.io/matrix-authentication-service/reference/configuration.html#passwords
        properties:
          enabled:
            type: boolean
            title: Whether to enable the password database
            description: >-
              If disabled, users will only be able to log in using upstream OIDC
              providers.
          schemes:
            type: array
            title: List of password hashing schemes being used.
            description: ⚠ Only change this if you know what you're doing.
            items:
              type: object
              properties:
                version:
                  type: integer
                algorithm:
                  type: string
              required:
                - version
                - algorithm
              unevaluatedProperties: false
            default:
              - version: 1
                algorithm: argon2id
        unevaluatedProperties: true
      account:
        type: object
        title: Account.
        description: >-
          https://matrix-org.github.io/matrix-authentication-service/reference/configuration.html#account
        properties:
          email_change_allowed:
            type: boolean
            title: Whether users are allowed to change their email addresses
            default: true
          displayname_change_allowed:
            type: boolean
            title: Whether users are allowed to change their display names
            description: >-
              This should be in sync with the policy in the homeserver configuration.
            default: true
          password_registration_enabled:
            type: boolean
            title: Whether to enable self-service password registration
            description: This has no effect if password login is disabled.
            default: true
          password_change_allowed:
            type: boolean
            title: Whether users are allowed to change their passwords
            description: This has no effect if password login is disabled.
            default: true
          password_recovery_enabled:
            type: boolean
            title: Whether email-based password recovery is enabled
            description: This has no effect if password login is disabled.
            default: true
        unevaluatedProperties: true
      policy:
        type: object
        title: Zusätzliche Policy Konfiguration für MAS
        description: >-
          Die Angaben werden automatisch in die Konfiguration unter
          `policy.data` bereit gestellt.


          https://matrix-org.github.io/matrix-authentication-service/reference/configuration.html#policy
        properties:
          admin_users:
            type: array
            items:
              properties: {}
            default: []
          passwords:
            type: object
            title: Registration using passwords
            properties:
              min_length:
                type: integer
                title: Minimum length of a password.
                default: 8
              require_lowercase:
                type: boolean
                title: Require at least one lowercase character in a password
                default: false
              require_uppercase:
                type: boolean
                title: Require at least one uppercase character in a password
                default: false
              require_number:
                type: boolean
                title: Require at least one number in a password
                default: false
            unevaluatedProperties: true
        unevaluatedProperties: true
      rate_limiting:
        type: object
        title: Rate-limiting.
        description: >-
          https://matrix-org.github.io/matrix-authentication-service/reference/configuration.html#rate_limiting
        unevaluatedProperties: true
      email:
        type: object
        title: Zusätzliche E-Mail Konfiguration für MAS
        description: >-
          https://matrix-org.github.io/matrix-authentication-service/reference/configuration.html#email
        properties:
          transport:
            type: string
            minLength: 1
            default: blackhole
        unevaluatedProperties: true
      extraVolumes:
        type: array
        title: Zusätzliche in den MAS zu mountende Datenträger (Volumes)
        items:
          $ref: >-
            https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.Volume.schema.json
          type: object
          unevaluatedProperties: false
        default: []
        examples:
          - - name: oauth2
              configMap:
                name: oauth
      extraVolumeMounts:
        type: array
        title: Zusätzliche in den MAS zu mountende Datenträgerpfade (Volumes)
        items:
          $ref: >-
            https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.VolumeMount.schema.json
          type: object
          unevaluatedProperties: false
        default: []
        examples:
          - - name: oauth2
              mountPath: /etc/ssl/certs/
              subMountPath: oauthprovider.crt
              readOnly: true
      podSecurityContext:
        $ref: "#/$defs/podSecurityContext"
        type: object
        title: Informationen zum Sicherheitskontext, die der Pod übernehmen soll
        default:
          runAsUser: 2666
          runAsGroup: 2666
          fsGroup: 2666
          runAsNonRoot: true
        unevaluatedProperties: false
      securityContext:
        $ref: "#/$defs/securityContext"
        type: object
        title: Konfiguration für die Container-Sicherheitsrichtlinie
        default:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 2666
        unevaluatedProperties: false
      resources:
        $ref: >-
          https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.ResourceRequirements.schema.json
        type: object
        properties:
          limits:
            properties:
              cpu:
                title: Rechenressourcengrenzen, die auf den MAS anzuwenden sind
                default: 500m
              memory:
                title: RAM Ressourcengrenzen, die auf den MAS anzuwenden sind
                default: 200Mi
          requests:
            properties:
              cpu:
                title: >-
                  Anforderungen an Rechenressourcen, die auf den MAS anzuwenden sind
                default: 300m
              memory:
                title: Anforderungen an RAM Ressourcen, die auf den MAS anzuwenden sind
                default: 50Mi
        unevaluatedProperties: false
      livenessProbe:
        $ref: >-
          https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.Probe.schema.json
        type: object
        properties:
          periodSeconds:
            default: 10
          httpGet:
            properties:
              path:
                default: /health
              port:
                default: metrics
        unevaluatedProperties: false
      readinessProbe:
        $ref: >-
          https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.Probe.schema.json
        type: object
        properties:
          periodSeconds:
            default: 3
          httpGet:
            properties:
              path:
                default: /health
              port:
                default: metrics
        unevaluatedProperties: false
      startupProbe:
        $ref: >-
          https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.Probe.schema.json
        type: object
        properties:
          failureThreshold:
            default: 6
          httpGet:
            properties:
              path:
                default: /health
              port:
                default: metrics
        unevaluatedProperties: false
    required:
      - enabled
      - image
      - uri
      - postgresql
      - paths
      - masPaths
      - upstream_oauth2_provider
      - clients
      - passwords
      - account
      - policy
