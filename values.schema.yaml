$defs:
  image:
    type: object
    properties:
      registry:
        type: string
        minLength: 1
      repository:
        type: string
        minLength: 1
      tag:
        type: string
        minLength: 1
      pullPolicy:
        title: Image-Pull-Policy
        $ref: >-
          https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.Container.schema.json#/properties/imagePullPolicy
        default: IfNotPresent
        enum:
          - Always
          - Never
          - IfNotPresent
    required:
      - registry
      - repository
      - tag
      - pullPolicy
  pullSecrets:
    type: array
    title: Array von imagePullSecrets
    default: []
    items:
      $ref: >-
        https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.LocalObjectReference.schema.json
      type: object
  podSecurityContext:
    $ref: >-
      https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.PodSecurityContext.schema.json
    type: object
    properties:
      runAsUser:
        minimum: 1001
        maximum: 60000
      runAsGroup:
        minimum: 1001
        maximum: 60000
      fsGroup:
        minimum: 1001
        maximum: 60000
  securityContext:
    $ref: >-
      https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.SecurityContext.schema.json
    type: object
    properties:
      runAsUser:
        minimum: 1001
        maximum: 60000
  worker:
    type: object
    properties:
      enabled:
        type: boolean
        default: false
      replicaCount:
        type: integer
        description: >-
          DEFAULT Die Anzahl der Worker-Replikate. Beachten Sie, dass einige
          Worker eine besondere Behandlung erfordern. Siehe dazu die
          Dokumentation:
          https://element-hq.github.io/synapse/latest/workers.html


          Hinweis: Wenn autoscaling.enabled=true und replicaCount geringer
          als autoscaling.minReplicas oder wenn nicht gesetzt, dann wird
          autoscaling.minReplicas übernommen.
        default: 1
        minimum: 0
      listeners:
        type: array
        title: Entsprechende Endpunkte für den Worker
        items:
          type: string
          enum:
            - client
            - consent
            - federation
            - keys
            - media
            - metrics
            - openid
            - replication
            - static
            - health
        default:
          - media
      csPaths:
        type: array
        title: >-
          Pfade für die Ingress-Konfiguration des Workers, Client-Server-Kommunikation
        items:
          type: string
        default: []
      paths:
        type: array
        title: >-
          Pfade für die Ingress-Konfiguration des Workers, Server-Server-Kommunikation
        items:
          type: string
        default: []
      autoscaling:
        type: object
        title: Schalte das HPA für die Container ein.
        description: >-
          Dazu muss entsprechende Konfiguration in die separaten Sektionen
          eingefügt werden.

          Hinweis: Kann für alle spezifischen Worker benutzt werden. Eine
          Ausnahme besteht für Stream Writer Worker mit "listeners:
          [replication]".
          https://element-hq.github.io/synapse/latest/workers.html#stream-writers

          Auf Grund der Synapse und HPA Architektur ist dies nicht möglich. Wenn
          diese Worker genutzt werden, wird empfohlen die Anzahl der worker
          manuell via "replicaCount" zu konfigurieren.
        properties:
          enabled:
            type: boolean
            default: false
          minReplicas:
            type: integer
            title: Minimale Anzahl der Worker-Container
            default: 2
          maxReplicas:
            type: integer
            title: Maximale Anzahl der Worker-Container
            default: 10
          targetCPUUtilizationPercentage:
            type: integer
            title: Prozentsatz für CPU-Auslastung um Scaling zu auszulösen
            default: 80
          targetMemoryUtilizationPercentage:
            type: integer
            title: Prozentsatz für RAM-Auslastung um Scaling zu auszulösen
            default: 80
        required:
          - enabled
          - minReplicas
          - maxReplicas
          - targetCPUUtilizationPercentage
          - targetMemoryUtilizationPercentage
        unevaluatedProperties: false
      strategy:
        type: object
        properties:
          type:
            type: string
            enum:
              - RollingUpdate
              - Recreate
            description: >-
              DEFAULT gilt für alle Synapse-Worker-Container.


              Nur wirklich anwendbar, wenn das Deployment ein RWO PV
              angehängt hat (z.B. Media Repository).


              Da Replikate = 1 sind, kann eine Aktualisierung "hängen
              bleiben", da der vorherige Container mit dem PV verbunden
              bleibt und der "neu-aufgebaute" Container nie starten kann.
              Das Ändern der Strategie auf "Recreate" wird den einzelnen
              vorherigen Container beenden, so dass der neue, ankommende
              Container sich mit dem PV verbinden kann.
            default: RollingUpdate
        required:
          - type
        unevaluatedProperties: false
      extraConfig:
        type: object
        description: Zusätzliche Konfiguration für die Worker
        default: {}
        unevaluatedProperties: true
      annotations:
        type: object
        title: Annotations
        description: DEFAULT sind auf alle Synapse-Worker-Container anzuwenden.
        default: {}
        unevaluatedProperties: true
      extraEnv:
        type: array
        title: Zusätzliche Umgebungsvariablen
        description: DEFAULT sind auf alle Synapse-Worker-Container anzuwenden.
        items:
          type: object
          properties:
            name:
              type: string
            value:
              type: string
          required:
            - name
            - value
          unevaluatedProperties: false
        default: []
        examples:
          - name: LD_PRELOAD
            value: /usr/lib/x86_64-linux-gnu/libjemalloc.so.2
          - name: SYNAPSE_CACHE_FACTOR
            value: "1.0"
      volumes:
        type: array
        title: Zusätzliche Volumes für den Worker
        description: >-
          DEFAULT gilt für alle Synapse-Worker-Container. Nützlich für das
          Media-Repo oder zum Hinzufügen von Python-Modulen. Daher besser im
          entsprechenden Konfigurationsteil der spez. Worker.
        default: []
      volumeMounts:
        type: array
        title: Zusätzliche zu mountende Datenträgerpfade
        description: DEFAULT gilt für alle Synapse-Worker-Container.
        default: []
      extraCommands:
        type: array
        title: Zusätzliche Befehle, die beim Starten von Synapse ausgeführt werden
        description: DEFAULT gilt für alle Synapse-Worker-Container.
        items:
          type: string
        default: []
        examples:
          - - apt-get update -yqq && apt-get install patch -yqq
            - patch -d/usr/local/lib/python3.10/site-packages/synapse -p2 < /synapse/patches/something.patch
      podSecurityContext:
        $ref: "#/$defs/podSecurityContext"
        type: object
        title: Informationen zum Pod-Sicherheitskontext
        description: DEFAULT gilt für alle Synapse-Worker-Container.
        default:
          runAsUser: 2666
          runAsNonRoot: true
          runAsGroup: 2666
          fsGroup: 2666
        unevaluatedProperties: false
      securityContext:
        $ref: "#/$defs/securityContext"
        type: object
        title: Konfiguration für die Container-Sicherheitsrichtlinie
        description: DEFAULT gilt für alle Synapse-Worker-Container.
        default:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 2666
        unevaluatedProperties: false
      resources:
        $ref: >-
          https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.ResourceRequirements.schema.json
        type: object
        properties:
          limits:
            properties:
              cpu:
                title: >-
                  Rechenressourcengrenzen, die auf alle
                  Synapse-Worker-Container anzuwenden sind
                description: >-
                  DEFAULT gilt für alle Synapse-Worker-Container. Empfohlen
                  gesondert zu verwalten.
                default: 600m
              memory:
                title: >-
                  RAM Ressourcengrenzen, die auf alle
                  Synapse-Worker-Container anzuwenden sind
                description: >-
                  DEFAULT gilt für alle Synapse-Worker-Container. Empfohlen
                  gesondert zu verwalten.
                default: 768Mi
          requests:
            properties:
              cpu:
                title: >-
                  Anforderungen an Rechenressourcen, die auf alle
                  Synapse-Worker-Container anzuwenden sind
                description: >-
                  DEFAULT gilt für alle Synapse-Worker-Container. Empfohlen
                  gesondert zu verwalten.
                default: 100m
              memory:
                title: >-
                  Anforderungen an RAM Ressourcen, die auf alle
                  Synapse-Worker-Container anzuwenden sind
                description: >-
                  DEFAULT gilt für alle Synapse-Worker-Container. Empfohlen
                  gesondert zu verwalten.
                default: 150Mi
        unevaluatedProperties: false
      livenessProbe:
        $ref: >-
          https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.Probe.schema.json
        type: object
        title: Healthcheck
        properties:
          periodSeconds:
            default: 10
          httpGet:
            properties:
              path:
                default: /health
              port:
                default: metrics
        unevaluatedProperties: false
      readinessProbe:
        $ref: >-
          https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.Probe.schema.json
        type: object
        title: Bereitschaftscheck
        properties:
          periodSeconds:
            default: 3
          httpGet:
            properties:
              path:
                default: /health
              port:
                default: metrics
        unevaluatedProperties: false
      startupProbe:
        $ref: >-
          https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.Probe.schema.json
        type: object
        title: Startup-Check
        properties:
          failureThreshold:
            default: 6
          httpGet:
            properties:
              path:
                default: /health
              port:
                default: metrics
        unevaluatedProperties: false
      nodeSelector:
        $ref: >-
          https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.PodSpec.schema.json#/properties/nodeSelector
        type: object
        title: >-
          Node Selektor Konfiguration, die auf alle Synapse-Worker-Container
          anzuwenden sind
        description: DEFAULT gilt für alle Synapse-Worker-Container.
        default: {}
        unevaluatedProperties: false
      tolerations:
        $ref: >-
          https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.PodSpec.schema.json#/properties/tolerations
        type: array
        title: >-
          Tolerations/Tains Konfiguration, die auf alle
          Synapse-Worker-Container anzuwenden sind
        description: DEFAULT gilt für alle Synapse-Worker-Container.
        default: []
        unevaluatedProperties: false
      affinity:
        $ref: >-
          https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.PodSpec.schema.json#/properties/affinity
        type: object
        default: {}
        unevaluatedProperties: false
    required:
      - enabled
      - replicaCount
      - listeners
      - csPaths
      - paths
      - autoscaling
      - strategy
      - extraConfig
      - annotations
      - extraEnv
      - volumes
      - volumeMounts
      - extraCommands
      - podSecurityContext
      - securityContext
      - resources
      - livenessProbe
      - readinessProbe
      - startupProbe
      - nodeSelector
      - tolerations
      - affinity
    unevaluatedProperties: false
