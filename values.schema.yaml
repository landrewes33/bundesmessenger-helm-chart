        $ref: >-
          https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.PodSpec.schema.json#/properties/nodeSelector
        type: object
        title: Node Selektor Konfiguration für Sygnal-Container
        default: {}
        unevaluatedProperties: false
      tolerations:
        $ref: >-
          https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.PodSpec.schema.json#/properties/tolerations
        type: array
        title: Tolerations/Tains Konfiguration für Sygnal-Container
        default: []
      affinity:
        $ref: >-
          https://schema.bundesmessenger.dev/kubernetes/io.k8s.api.core.v1.PodSpec.schema.json#/properties/affinity
        type: object
        title: Affinitäts-Konfiguration für Sygnal-Container
        default: {}
        unevaluatedProperties: false
      apps:
        type: object
        title: Konfiguration für Push-Dienste (APNS und FCM)
        default: {}
        examples:
          - de.opencode.dvs.ios:
              type: apns
              keyfile: /de.opencode.dvs.ios.p8
        unevaluatedProperties: true
      existingSecret:
        type: string
        title: Name des Secrets, welches Schlüsseldateien für FCM und iOS Push enthält
        description: >-
          Die Schlüssel des Secrets sind die Dateinamen, welche unter
          `sygnal.apps` mit dem Präfix `/secrets` referenziert werden.
        default: sygnal
      ioskey_filename:
        type: ["null", "string"]
        minLength: 1
        title: iOS-Key Dateiname
        description: >-
          Wenn iOS Push mit genutzt wird, muss ein gültiger und valider
          Dateiname angegeben werden. Bei Nutzung von iOS-Pushservice, muss Key
          mit angegeben werden. Weiteres siehe README.md


          Durch Filename-Vergabe wird der unten angegebene ioskey geladen.


          Beispiel: ioskey_filename: de.opencode.dvs.ios.p8 <<-- muss zwingend
          mit dem Keyfile-Dateinamen aus der APNS-Sektion der vorhergehenden
          Apps-Konfiguration übereinstimmen!
        default: null
      ioskey_keyvalue:
        type: ["null", "string"]
        minLength: 1
        title: iOS-Key Datei-Inhalt
        default: null
        examples:
          - ioskey_keyvalue: HIER KÖNNTE IHR KEY STEHEN
      fcmkey_filename:
        type: ["null", "string"]
        minLength: 1
        title: FCM-Key Dateiname
        description: >-
          Bei Nutzung von FCM-Pushservice, muss Key mit angegeben werden.
          Weiteres siehe README.md.


          Wenn FCM Push mit genutzt wird, muss ein gültiger und valider
          Dateiname angegeben werden. Durch Filename-Vergabe wird der unten
          angegebene FCM-Service-Account-File geladen.


          Beispiel: fcmkey_filename: de.opencode.dvs.bundesmessenger.json <<--
          muss zwingend mit dem service_account_file-Dateinamen aus der
          gcm-Sektion der vorhergehenden Apps-Konfiguration übereinstimmen!
        default: null
      fcmkey_keyvalue:
        type: ["null", "object"]
        title: FCM-Key Service Account File Inhalt
        default: null
        examples:
          - fcmkey_keyvalue: HIER KÖNNTE IHR SERVICE ACCOUNT FILE INHALT STEHEN
        unevaluatedProperties: true
    allOf:
      - oneOf:
          - properties:
              ioskey_filename:
                type: "null"
              ioskey_keyvalue:
                type: "null"
          - properties:
              ioskey_filename:
                type: string
              ioskey_keyvalue:
                type: string
            required:
