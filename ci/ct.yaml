# See https://github.com/helm/chart-testing#configuration
target-branch: main
charts: .
chart-dirs:
  - .
lint-conf: ci/yamllintconf.yaml
helm-extra-args: ""
chart-repos: []
helm-dependency-extra-args: "--skip-refresh"
validate-chart-schema: true
validate-chart-values: true
validate-maintainers: false
validate-yaml: true
excluded-charts: []
additional-commands:
  - helm unittest -t JUnit -o report.xml .
