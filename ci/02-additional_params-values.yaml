serverName: example.org
publicServerName: matrix.example.org
adminAPIServerName: admin-api.example.org
dataPrivacyUrl: example.com/privacy
imprintUrl: example.com/imprint

image:
  pullSecrets:
    - name: test-secret

monitoring:
  enabled: true
  labels:
    release: kube-prom-stack

synapse:
  annotations:
    test-annotation: synapse

workers:
  default:
    annotations:
      test-annotation: default-workers
  generic_worker:
    replicaCount: 1
    # Kubernetes v1.23+.
    # autoscaling:
    #  enabled: true
  appservice:
    enabled: true
  pusher:
    enabled: true

synapse_admin:
  enabled: true
  uri: admin-client.example.org

webclient:
  enabled: true
  uri: web.example.org

contentscanner:
  enabled: true

schadcodescanner:
  enabled: true

sygnal:
  enabled: true
  fcmkey_filename: bum.json
  fcmkey_keyvalue:
    type: "service_account"
    project_id: "dummy"
  ioskey_filename: AuthKey.p8
  ioskey_keyvalue: "TFMwdExTMUNSVWRKVGlCUVVrbFdRVlJGSUV0c2Rmc2QK"
  apps:
    de.opencode.dvs.gcm:
      type: gcm
      api_key: example-value
      service_account_file: /bum.json
    de.opencode.dvs.ios:
      type: apns
      keyfile: /AuthKey.p8
      key_id: example
      team_id: example
      topic: example

wellknown:
  enabled: true

postgresql:
  enabled: true

networkpolicies:
  enabled: true

# optional pullSecrets
# image:
#   pullSecrets:
#     - name: bum-git
# redis:
#   image:
#     pullSecrets: bum-git

# only to validate template
demomode:
  enabled: true

mas:
  enabled: true

additionalConfig:
  dsgvoExport:
    enabled: true