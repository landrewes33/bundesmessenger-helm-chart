{{- $config := $.Values.coturn }}
{{- if and $config.enabled (not (eq (toString $config.existingcoturn.enabled) `"false"`)) }}

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  namespace:  {{ $config.default_ns }}
  name: coturn
  labels:
    name: coturn
    instance: coturn
spec:
  selector:
    matchLabels:
      name: coturn
      instance: coturn
  template:
    metadata:
      labels:
        name: coturn
        instance: coturn
    spec:
      hostNetwork: true
      containers:
        - name: coturn
          image: "{{ $.Values.coturn.image.repository }}:{{ $.Values.coturn.image.tag }}"
          imagePullPolicy: {{ $.Values.coturn.image.pullPolicy }} 
          ports:
            - name: turn-port-tcp
              containerPort: 3478
              hostPort: 3478
              protocol: TCP
            - name: turn-port-udp
              containerPort: 3478
              hostPort: 3478
              protocol: UDP
          securityContext:
            {{- toYaml .Values.coturn.securityContext | nindent 12 }}
          #   capabilities:
          #     drop:
          #       - ALL
          args:
          #   - --stun-only
            - -v
          volumeMounts:
            - name: config
              mountPath: /etc/turnserver/turnserver.conf
      volumes:
        - name: config
          configMap:
            name: coturn


---
{{- $v1Ingress := .Capabilities.APIVersions.Has "networking.k8s.io/v1" -}}
{{- if $v1Ingress -}}
apiVersion: networking.k8s.io/v1
{{- else -}}
apiVersion: networking.k8s.io/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: coturn-udp-{{ .Release.Namespace  }}
  labels:
    app: coturn-udp
spec:
  ingressClassName: nginx-{{ .Release.Namespace  }}
  defaultBackend:
    service:
      name: coturn-udp
      port:
        name: turn-port-udp

--- 
apiVersion: v1
kind: Service
metadata:
  name: coturn-tcp
  namespace:  {{ .Release.Namespace }}
  labels:
       name: coturn
       instance: coturn
spec:
  type: ClusterIP
  ports:
    # - port: 3000
    #   targetPort: 3000
    #   protocol: UDP
    #   name: turn-udp
    - port: 3478
      targetPort: 3478
      protocol: TCP
      name: turn-port-tcp
    # - port: 3478
    #   targetPort: 3478
    #   protocol: TCP
    #   name: turn-port3
    # - port: 3479
    #   targetPort: 3479
    #   protocol: TCP
    #   name: turn-port4
    
  selector:
       name: coturn
       instance: coturn


--- 
apiVersion: v1
kind: Service
metadata:
  name: coturn-udp
  namespace:  {{ .Release.Namespace }}
  labels:
       name: coturn
       instance: coturn
spec:
  type: ClusterIP
  ports:
    # - port: 3000
    #   targetPort: 3000
    #   protocol: UDP
    #   name: turn-udp
    - port: 3478
      targetPort: 3478
      protocol: UDP
      name: turn-port-udp
    # - port: 3478
    #   targetPort: 3478
    #   protocol: TCP
    #   name: turn-port3
    # - port: 3479
    #   targetPort: 3479
    #   protocol: TCP
    #   name: turn-port4
    
  selector:
       name: coturn
       instance: coturn

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tcp-services
  namespace: "{{ $.Values.coturn.ingress_tcp_ns }}"
data:
  3478: "{{ .Release.Namespace }}/coturn-tcp:3478"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn
  namespace:  {{ .Release.Namespace}}
data:
  turnconfig.conf: "
# Coturn TURN SERVER configuration file\n
#\n
# Boolean values note: where boolean value is supposed to be used,\n
# you can use '0', 'off', 'no', 'false', 'f' as 'false, \n
# and you can use '1', 'on', 'yes', 'true', 't' as 'true' \n
# If the value is missed, then it means 'true'.\n
#\n
\n
# Listener interface device (optional, Linux only).\n
# NOT RECOMMENDED. \n
#\n
listening-device=ens192\n
\n
# TURN listener port for UDP and TCP (Default: 3478).\n
# Note: actually, TLS & DTLS sessions can connect to the \n
# 'plain' TCP & UDP port(s), too - if allowed by configuration.\n
#\n
listening-port=3478\n
\n
# TURN listener port for TLS (Default: 5349).\n
# Note: actually, 'plain' TCP & UDP sessions can connect to the TLS & DTLS\n
# port(s), too - if allowed by configuration. The TURN server \n
# 'automatically' recognizes the type of traffic. Actually, two listening\n
# endpoints (the 'plain' one and the 'tls' one) are equivalent in terms of\n
# functionality; but we keep both endpoints to satisfy the RFC 5766 specs.\n
# For secure TCP connections, we currently support SSL version 3 and \n
# TLS version 1.0, 1.1 and 1.2.\n
# For secure UDP connections, we support DTLS version 1.\n
#\n
#tls-listening-port=5349\n
\n
# Alternative listening port for UDP and TCP listeners;\n
# default (or zero) value means 'listening port plus one'. \n
# This is needed for RFC 5780 support\n
# (STUN extension specs, NAT behavior discovery). The TURN Server \n
# supports RFC 5780 only if it is started with more than one \n
# listening IP address of the same family (IPv4 or IPv6).\n
# RFC 5780 is supported only by UDP protocol, other protocols\n
# are listening to that endpoint only for 'symmetry'.\n
#\n
#alt-listening-port=0\n
                                                         \n
# Alternative listening port for TLS and DTLS protocols.\n
# Default (or zero) value means 'TLS listening port plus one'.\n
#\n
#alt-tls-listening-port=0\n
        \n
# Listener IP address of relay server. Multiple listeners can be specified.\n
# If no IP(s) specified in the config file or in the command line options, \n
# then all IPv4 and IPv6 system IPs will be used for listening.\n
#\n
#listening-ip=10.0.1.5\n
#listening-ip=172.17.19.101\n
#listening-ip=10.207.21.238\n
#listening-ip=2607:f0d0:1002:51::4\n
\n
# Auxiliary STUN/TURN server listening endpoint.\n
# Aux servers have almost full TURN and STUN functionality.\n
# The (minor) limitations are:\n
#\n
# 1) Auxiliary servers do not have alternative ports and\n
# they do not support STUN RFC 5780 functionality (CHANGE REQUEST).\n
#\n
# 2) Auxiliary servers also are never returning ALTERNATIVE-SERVER reply.\n
# \n
# Valid formats are 1.2.3.4:5555 for IPv4 and [1:2::3:4]:5555 for IPv6.\n
#\n
# There may be multiple aux-server options, each will be used for listening\n
# to client requests.\n
#\n
#aux-server=172.17.19.110:33478\n
#aux-server=[2607:f0d0:1002:51::4]:33478\n
\n
# (recommended for older Linuxes only)\n
# Automatically balance UDP traffic over auxiliary servers (if configured).\n
# The load balancing is using the ALTERNATE-SERVER mechanism.\n
# The TURN client must support 300 ALTERNATE-SERVER response for this \n
# functionality.\n
#\n
#udp-self-balance\n
\n
# Relay interface device for relay sockets (optional, Linux only).\n
# NOT RECOMMENDED.\n
#\n
#relay-device=eth1\n
relay-device=ens192 \n
\n
# Relay address (the local IP address that will be used to relay the \n
# packets to the peer).\n
# Multiple relay addresses may be used.\n
# The same IP(s) can be used as both listening IP(s) and relay IP(s).\n
#\n
# If no relay IP(s) specified, then the turnserver will apply the default\n
# policy: it will decide itself which relay addresses to be used, and it \n
# will always be using the client socket IP address as the relay IP address\n
# of the TURN session (if the requested relay address family is the same\n
# as the family of the client socket).\n
#\n
#relay-ip=172.17.19.105\n
#relay-ip=2607:f0d0:1002:51::5\n
\n
# For Amazon EC2 users:\n
#\n
# TURN Server public/private address mapping, if the server is behind NAT.\n
# In that situation, if a -X is used in form '-X <ip>' then that ip will be reported\n
# as relay IP address of all allocations. This scenario works only in a simple case\n
# when one single relay address is be used, and no RFC5780 functionality is required.\n
# That single relay address must be mapped by NAT to the 'external' IP.\n
# The 'external-ip' value, if not empty, is returned in XOR-RELAYED-ADDRESS field.\n
# For that 'external' IP, NAT must forward ports directly (relayed port 12345\n
#\n
# In more complex case when more than one IP address is involved,\n
# that option must be used several times, each entry must\n
# have form '-X <public-ip/private-ip>', to map all involved addresses.\n
# RFC5780 NAT discovery STUN functionality will work correctly,\n
# if the addresses are mapped properly, even when the TURN server itself \n
# is behind A NAT.\n
#\n
# By default, this value is empty, and no address mapping is used.\n
#\n
#external-ip=60.70.80.91\n
external-ip=217.92.40.173/10.21.251.60 \n
#\n
#OR:\n
#\n
#external-ip=60.70.80.91/172.17.19.101\n
#external-ip=60.70.80.92/172.17.19.102\n
\n
# Number of the relay threads to handle the established connections\n
# (in addition to authentication thread and the listener thread).\n
# If explicitly set to 0 then application runs relay process in a \n
# single thread, in the same thread with the listener process \n
# (the authentication thread will still be a separate thread).\n
#\n
# If this parameter is not set, then the default OS-dependent \n
# thread pattern algorithm will be employed. Usually the default\n
# algorithm is the most optimal, so you have to change this option\n
# only if you want to make some fine tweaks. \n
#\n
# In the older systems (Linux kernel before 3.9),\n
# the number of UDP threads is always one thread per network listening\n
# endpoint - including the auxiliary endpoints - unless 0 (zero) or \n
# 1 (one) value is set.\n
#\n
#relay-threads=0\n
\n
# Lower and upper bounds of the UDP relay endpoints:\n
# (default values are 49152 and 65535)\n
#\n
#min-port=49152\n
#max-port=65535\n
        \n
# Uncomment to run TURN server in 'normal' 'moderate' verbose mode.\n
# By default the verbose mode is off.\n
#verbose\n
        \n
# Uncomment to run TURN server in 'extra' verbose mode.\n
# This mode is very annoying and produces lots of output.\n
# Not recommended under any normal circumstances.\n
#       \n
#Verbose\n
\n
# Uncomment to use fingerprints in the TURN messages.\n
# By default the fingerprints are off.\n
#\n
#fingerprint\n
\n
# Uncomment to use long-term credential mechanism.\n
# By default no credentials mechanism is used (any user allowed).\n
#\n
#lt-cred-mech\n
\n
# This option is opposite to lt-cred-mech. \n
# (TURN Server with no-auth option allows anonymous access).\n
# If neither option is defined, and no users are defined,\n
# then no-auth is default. If at least one user is defined, \n
# in this file or in command line or in usersdb file, then\n
# lt-cred-mech is default.\n
#\n
#no-auth\n
\n
# TURN REST API flag.\n
# Flag that sets a special authorization option that is based upon authentication secret.\n
# This feature can be used with the long-term authentication mechanism, only.\n
# This feature purpose is to support 'TURN Server REST API', see\n
# 'TURN REST API' link in the project's page \n
# https://github.com/coturn/coturn/\n
#\n
# This option is used with timestamp:\n
# \n
# usercombo -> 'timestamp:userid'\n
# turn user -> usercombo\n
# turn password -> base64(hmac(secret key, usercombo))\n
#\n
# This allows TURN credentials to be accounted for a specific user id.\n
# If you don't have a suitable id, the timestamp alone can be used.\n
# This option is just turning on secret-based authentication.\n
# The actual value of the secret is defined either by option static-auth-secret,\n
# or can be found in the turn_secret table in the database (see below).\n
# \n
use-auth-secret\n
\n
# 'Static' authentication secret value (a string) for TURN REST API only. \n
# If not set, then the turn server\n
# will try to use the 'dynamic' value in turn_secret table\n
# in user database (if present). The database-stored  value can be changed on-the-fly\n
# by a separate program, so this is why that other mode is 'dynamic'.\n
#\n
static-auth-secret=j8dOQy5TgYv0x7r9LL3so08jZReoZ9JgbpjdFO73toyqloQuCZywGihhbqYU7jZL\n
\n
# Server name used for\n
# the oAuth authentication purposes.\n
# The default value is the realm name.\n
#\n
#server-name=blackdow.carleon.gov\n
\n
# Flag that allows oAuth authentication.\n
#\n
#oauth\n
\n
#The default realm to be used for the users when no explicit origin/realm \n
#relationship was found in the database. Must be used with long-term \n
#credentials mechanism or with TURN REST API.\n
#\n
#realm=realm\n
\n
# 'Static' user accounts for long term credentials mechanism, only.\n
# This option cannot be used with TURN REST API.\n
# This option require a realm.\n
# 'Static' user accounts are NOT dynamically checked by the turnserver process, \n
# so that they can NOT be changed while the turnserver is running.\n
#\n
#user=username1:key1\n
#user=username2:key2\n
# OR:\n
#user=username1:password1\n
#user=username2:password2\n
#\n
# Keys must be generated by turnadmin utility. The key value depends\n
# on user name, realm, and password:\n
#\n
# Example:\n
# $ turnadmin -k -u ninefingers -r north.gov -p youhavetoberealistic\n
# Output: 0xbc807ee29df3c9ffa736523fb2c4e8ee\n
# ('0x' in the beginning of the key is what differentiates the key from\n
# password. If it has 0x then it is a key, otherwise it is a password).\n
#\n
# The corresponding user account entry in the config file will be:\n
# \n
#user=ninefingers:0xbc807ee29df3c9ffa736523fb2c4e8ee\n
# Or, equivalently, with open clear password (less secure):\n
#user=ninefingers:youhavetoberealistic\n
#\n
\n
# SQLite database file name.\n
#\n
# Default file name is /var/db/turndb or /usr/local/var/db/turndb or\n
# /var/lib/turn/turndb.\n
# \n
#userdb=/var/db/turndb\n
\n
# PostgreSQL database connection string in the case that we are using PostgreSQL\n
# as the user database.\n
# This database can be used for long-term credential mechanism\n
# and it can store the secret value for secret-based timed authentication in TURN RESP API. \n
# See http://www.postgresql.org/docs/8.4/static/libpq-connect.html for 8.x PostgreSQL\n
# versions connection string format, see \n
# http://www.postgresql.org/docs/9.2/static/libpq-connect.html#LIBPQ-CONNSTRING\n
# for 9.x and newer connection string formats.\n
#\n
#psql-userdb='host=<host> dbname=<database-name> user=<database-user> password=<database-user-password> connect_timeout=30'\n
\n
# MySQL database connection string in the case that we are using MySQL\n
# as the user database.\n
# This database can be used for long-term credential mechanism\n
# and it can store the secret value for secret-based timed authentication in TURN RESP API.\n
#\n
# Optional connection string parameters for the secure communications (SSL): \n
# ca, capath, cert, key, cipher \n
# (see http://dev.mysql.com/doc/refman/5.1/en/ssl-options.html for the \n
# command options description).\n
#\n
# Use string format as below (space separated parameters, all optional):\n
#\n
#mysql-userdb='host=<host> dbname=<database-name> user=<database-user> password=<database-user-password> port=<port> connect_timeout=<seconds> read_timeout=<seconds>'\n
\n
# MongoDB database connection string in the case that we are using MongoDB\n
# as the user database.\n
# This database can be used for long-term credential mechanism\n
# and it can store the secret value for secret-based timed authentication in TURN RESP API. \n
# Use string format is described at http://hergert.me/docs/mongo-c-driver/mongoc_uri.html\n
#\n
#mongo-userdb='mongodb://[username:password@]host1[:port1][,host2[:port2],...[,hostN[:portN]]][/[database][?options]]'\n
\n
# Redis database connection string in the case that we are using Redis\n
# as the user database.\n
# This database can be used for long-term credential mechanism\n
# and it can store the secret value for secret-based timed authentication in TURN RESP API. \n
# Use string format as below (space separated parameters, all optional):\n
#\n
#redis-userdb='ip=<ip-address> dbname=<database-number> password=<database-user-password> port=<port> connect_timeout=<seconds>'\n
\n
# Redis status and statistics database connection string, if used (default - empty, no Redis stats DB used).\n
# This database keeps allocations status information, and it can be also used for publishing\n
# and delivering traffic and allocation event notifications.\n
# The connection string has the same parameters as redis-userdb connection string. \n
# Use string format as below (space separated parameters, all optional):\n
#\n
#redis-statsdb='ip=<ip-address> dbname=<database-number> password=<database-user-password> port=<port> connect_timeout=<seconds>'\n
\n
# The default realm to be used for the users when no explicit \n
# origin/realm relationship was found in the database, or if the TURN\n
# server is not using any database (just the commands-line settings\n
# and the userdb file). Must be used with long-term credentials \n
# mechanism or with TURN REST API.\n
#\n
realm={{ .Values.config.publicBaseurl | default (printf "%s" (.Values.publicServerName | default .Values.serverName)) }}
\n
# The flag that sets the origin consistency \n
# check: across the session, all requests must have the same\n
# main ORIGIN attribute value (if the ORIGIN was\n
# initially used by the session).\n
#\n
#check-origin-consistency\n
\n
# Per-user allocation quota.\n
# default value is 0 (no quota, unlimited number of sessions per user).\n
# This option can also be set through the database, for a particular realm.\n
#\n
user-quota=4\n
\n
# Total allocation quota.\n
# default value is 0 (no quota).\n
# This option can also be set through the database, for a particular realm.\n
#\n
total-quota=1200\n
\n
# Max bytes-per-second bandwidth a TURN session is allowed to handle\n
# (input and output network streams are treated separately). Anything above\n
# that limit will be dropped or temporary suppressed (within\n
# the available buffer limits).\n
# This option can also be set through the database, for a particular realm.\n
#\n
#max-bps=0\n
\n
#\n
# Maximum server capacity.\n
# Total bytes-per-second bandwidth the TURN server is allowed to allocate\n
# for the sessions, combined (input and output network streams are treated separately).\n
#\n
# bps-capacity=0\n
\n
# Uncomment if no UDP client listener is desired.\n
# By default UDP client listener is always started.\n
#\n
#no-udp\n
\n
# Uncomment if no TCP client listener is desired.\n
# By default TCP client listener is always started.\n
#\n
#no-tcp\n
\n
# Uncomment if no TLS client listener is desired.\n
# By default TLS client listener is always started.\n
#\n
no-tls\n
\n
# Uncomment if no DTLS client listener is desired.\n
# By default DTLS client listener is always started.\n
#\n
#no-dtls\n
\n
# Uncomment if no UDP relay endpoints are allowed.\n
# By default UDP relay endpoints are enabled (like in RFC 5766).\n
#\n
#no-udp-relay\n
\n
# Uncomment if no TCP relay endpoints are allowed.\n
# By default TCP relay endpoints are enabled (like in RFC 6062).\n
#\n
no-tcp-relay\n
\n
# Uncomment if extra security is desired,\n
# with nonce value having limited lifetime.\n
# By default, the nonce value is unique for a session,\n
# and has unlimited lifetime. \n
# Set this option to limit the nonce lifetime. \n
# It defaults to 600 secs (10 min) if no value is provided. After that delay, \n
# the client will get 438 error and will have to re-authenticate itself.\n
#\n
#stale-nonce=600\n
\n
# Uncomment if you want to set the maximum allocation\n
# time before it has to be refreshed.\n
# Default is 3600s.\n
#\n
#max-allocate-lifetime=3600\n
\n
# Uncomment to set the lifetime for the channel.\n
# Default value is 600 secs (10 minutes).\n
# This value MUST not be changed for production purposes.\n
#\n
#channel-lifetime=600\n
\n
# Uncomment to set the permission lifetime.\n
# Default to 300 secs (5 minutes).\n
# In production this value MUST not be changed,\n
# however it can be useful for test purposes.\n
#\n
#permission-lifetime=300\n
\n
# Certificate file.\n
# Use an absolute path or path relative to the \n
# configuration file.\n
#\n
#cert=/usr/local/etc/turn_server_cert.pem\n
#cert=/etc/letsencrypt/live/msgk8s.lab-mobility.de/fullchain.pem\n
\n
# Private key file.\n
# Use an absolute path or path relative to the \n
# configuration file.\n
# Use PEM file format.\n
#\n
#pkey=/usr/local/etc/turn_server_pkey.pem\n
#pkey=/etc/letsencrypt/live/msgk8s.lab-mobility.de/privkey.pem\n
\n
# Private key file password, if it is in encoded format.\n
# This option has no default value.\n
#\n
#pkey-pwd=...\n
\n
# Allowed OpenSSL cipher list for TLS/DTLS connections.\n
# Default value is 'DEFAULT'.\n
#\n
#cipher-list='DEFAULT'\n
#cipher-list='ECDH+AESGCM:DH+AESGCM:ECDH+AES256:DH+AES256:ECDH+AES128:DH+AES:ECDH+3DES:DH+3DES:RSA+AES:RSA+3DES:!ADH:!AECDH:!MD5'\n
\n
# CA file in OpenSSL format. \n
# Forces TURN server to verify the client SSL certificates.\n
# By default it is not set: there is no default value and the client\n
# certificate is not checked.\n
#\n
# Example:\n
#CA-file=/etc/ssh/id_rsa.cert\n
\n
# Curve name for EC ciphers, if supported by OpenSSL \n
# library (TLS and DTLS). The default value is prime256v1, \n
# if pre-OpenSSL 1.0.2 is used. With OpenSSL 1.0.2+,\n
# an optimal curve will be automatically calculated, if not defined\n
# by this option.\n
#\n
#ec-curve-name=prime256v1\n
\n
# Use 566 bits predefined DH TLS key. Default size of the key is 1066.\n
#\n
#dh566\n
\n
# Use 2066 bits predefined DH TLS key. Default size of the key is 1066.\n
#\n
#dh2066\n
\n
# Use custom DH TLS key, stored in PEM format in the file.\n
# Flags --dh566 and --dh2066 are ignored when the DH key is taken from a file.\n
#\n
#dh-file=<DH-PEM-file-name>\n
\n
# Flag to prevent stdout log messages.\n
# By default, all log messages are going to both stdout and to \n
# the configured log file. With this option everything will be \n
# going to the configured log only (unless the log file itself is stdout).\n
#\n
#no-stdout-log\n
\n
# Option to set the log file name.\n
# By default, the turnserver tries to open a log file in \n
# /var/log, /var/tmp, /tmp and current directories directories\n
# (which open operation succeeds first that file will be used).\n
# With this option you can set the definite log file name.\n
# The special names are 'stdout' and '-' - they will force everything \n
# to the stdout. Also, the 'syslog' name will force everything to\n
# the system log (syslog). \n
# In the runtime, the logfile can be reset with the SIGHUP signal \n
# to the turnserver process.\n
#\n
#log-file=/var/tmp/turn.log\n
\n
# Option to redirect all log output into system log (syslog).\n
#\n
#syslog\n
\n
# This flag means that no log file rollover will be used, and the log file\n
# name will be constructed as-is, without PID and date appendage.\n
# This option can be used, for example, together with the logrotate tool.\n
#\n
#simple-log\n
\n
# Option to set the 'redirection' mode. The value of this option\n
# will be the address of the alternate server for UDP & TCP service in form of \n
# <ip>[:<port>]. The server will send this value in the attribute\n
# ALTERNATE-SERVER, with error 300, on ALLOCATE request, to the client.\n
# Client will receive only values with the same address family\n
# as the client network endpoint address family. \n
# See RFC 5389 and RFC 5766 for ALTERNATE-SERVER functionality description. \n
# The client must use the obtained value for subsequent TURN communications.\n
# If more than one --alternate-server options are provided, then the functionality\n
# can be more accurately described as 'load-balancing' than a mere 'redirection'. \n
# If the port number is omitted, then the default port \n
# number 3478 for the UDP/TCP protocols will be used.\n
# Colon (:) characters in IPv6 addresses may conflict with the syntax of \n
# the option. To alleviate this conflict, literal IPv6 addresses are enclosed \n
# in square brackets in such resource identifiers, for example: \n
# [2001:db8:85a3:8d3:1319:8a2e:370:7348]:3478 . \n
# Multiple alternate servers can be set. They will be used in the\n
# round-robin manner. All servers in the pool are considered of equal weight and \n
# the load will be distributed equally. For example, if we have 4 alternate servers, \n
# then each server will receive 25% of ALLOCATE requests. A alternate TURN server \n
# address can be used more than one time with the alternate-server option, so this \n
# can emulate 'weighting' of the servers.\n
#\n
# Examples: \n
#alternate-server=1.2.3.4:5678\n
#alternate-server=11.22.33.44:56789\n
#alternate-server=5.6.7.8\n
#alternate-server=[2001:db8:85a3:8d3:1319:8a2e:370:7348]:3478\n
                        \n
# Option to set alternative server for TLS & DTLS services in form of \n
# <ip>:<port>. If the port number is omitted, then the default port \n
# number 5349 for the TLS/DTLS protocols will be used. See the previous \n
# option for the functionality description.\n
#\n
# Examples: \n
#tls-alternate-server=1.2.3.4:5678\n
#tls-alternate-server=11.22.33.44:56789\n
#tls-alternate-server=[2001:db8:85a3:8d3:1319:8a2e:370:7348]:3478\n
\n
# Option to suppress TURN functionality, only STUN requests will be processed.\n
# Run as STUN server only, all TURN requests will be ignored.\n
# By default, this option is NOT set.\n
#\n
#stun-only\n
\n
# Option to suppress STUN functionality, only TURN requests will be processed.\n
# Run as TURN server only, all STUN requests will be ignored.\n
# By default, this option is NOT set.\n
#\n
#no-stun\n
\n
# This is the timestamp/username separator symbol (character) in TURN REST API.\n
# The default value is ':'.\n
# rest-api-separator=:  \n
\n
# Flag that can be used to disallow peers on the loopback addresses (127.x.x.x and ::1).\n
# This is an extra security measure.\n
#\n
no-loopback-peers \n
\n
# Flag that can be used to disallow peers on well-known broadcast addresses (224.0.0.0 and above, and FFXX:*).\n
# This is an extra security measure.\n
#\n
no-multicast-peers \n
\n
# Option to set the max time, in seconds, allowed for full allocation establishment. \n
# Default is 60 seconds.\n
#\n
#max-allocate-timeout=60\n
\n
# Option to allow or ban specific ip addresses or ranges of ip addresses. \n
# If an ip address is specified as both allowed and denied, then the ip address is \n
# considered to be allowed. This is useful when you wish to ban a range of ip \n
# addresses, except for a few specific ips within that range.\n
#\n
# This can be used when you do not want users of the turn server to be able to access\n
# machines reachable by the turn server, but would otherwise be unreachable from the \n
# internet (e.g. when the turn server is sitting behind a NAT)\n
#\n
# Examples:\n
# denied-peer-ip=83.166.64.0-83.166.95.255\n
# allowed-peer-ip=83.166.68.45\n
# Azure nutzt die 10.0.0.0 Adressen\n
#denied-peer-ip=10.0.0.0-10.255.255.255\n
#denied-peer-ip=192.168.0.0-192.168.255.255\n
#denied-peer-ip=172.16.0.0-172.31.255.255\n
#allowed-peer-ip=10.0.1.5\n
\n
# File name to store the pid of the process.\n
# Default is /var/run/turnserver.pid (if superuser account is used) or\n
# /var/tmp/turnserver.pid .\n
#\n
#pidfile='/var/run/turnserver.pid'\n
pidfile='/turnserver.pid'\n
\n
# Require authentication of the STUN Binding request.\n
# By default, the clients are allowed anonymous access to the STUN Binding functionality.\n
#\n
#secure-stun\n
\n
# Mobility with ICE (MICE) specs support.\n
#\n
#mobility\n
\n
# User name to run the process. After the initialization, the turnserver process\n
# will make an attempt to change the current user ID to that user.\n
#\n
#proc-user=<user-name>\n
\n
# Group name to run the process. After the initialization, the turnserver process\n
# will make an attempt to change the current group ID to that group.\n
#\n
#proc-group=<group-name>\n
\n
# Turn OFF the CLI support.\n
# By default it is always ON.\n
# See also options cli-ip and cli-port.\n
#\n
#no-cli\n
\n
#Local system IP address to be used for CLI server endpoint. Default value\n
# is 127.0.0.1.\n
#\n
#cli-ip=127.0.0.1\n
\n
# CLI server port. Default is 5766.\n
#\n
#cli-port=5766\n
\n
# CLI access password. Default is empty (no password).\n
# For the security reasons, it is recommended to use the encrypted\n
# for of the password (see the -P command in the turnadmin utility).\n
#\n
# Secure form for password 'qwerty':\n
#\n
#cli-password=$5$79a316b350311570$81df9cfb9af7f5e5a76eada31e7097b663a0670f99a3c07ded3f1c8e59c5658a\n
#\n
# Or unsecure form for the same paassword:\n
#\n
#cli-password=qwerty\n
\n
# Server relay. NON-STANDARD AND DANGEROUS OPTION. \n
# Only for those applications when we want to run \n
# server applications on the relay endpoints.\n
# This option eliminates the IP permissions check on \n
# the packets incoming to the relay endpoints.\n
#\n
#server-relay\n
# Maximum number of output sessions in ps CLI command.\n
# This value can be changed on-the-fly in CLI. The default value is 256.\n
#\n
#cli-max-output-sessions\n
\n
# Set network engine type for the process (for internal purposes).\n
#\n
#ne=[1|2|3]\n
\n
# Do not allow an TLS/DTLS version of protocol\n
#\n
#no-tlsv1\n
#no-tlsv1_1\n
#no-tlsv1_2\n
\n
"

