{{- if .Values.synapse_admin.enabled }}
---
apiVersion: v1
kind: Service
metadata: 
  name: synapse-admin
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
    app.kubernetes.io/component: synapse-admin
spec: 
  selector:
    {{- include "matrix-synapse.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: synapse-admin
  ports: 
    - name: "admin-port"
      port: 8080
      targetPort: 8080
{{- end }}
