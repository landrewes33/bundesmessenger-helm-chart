{{- $v1Ingress := .Capabilities.APIVersions.Has "networking.k8s.io/v1" -}}
{{- if $v1Ingress -}}
apiVersion: networking.k8s.io/v1
{{- else -}}
apiVersion: networking.k8s.io/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: synapse-admin
  labels:
    app: synapse-admin
spec:
  ingressClassName: nginx
  rules:
    - host: msgk8sadmin.itlab.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: synapse-admin
                port:
                  number: 8080
