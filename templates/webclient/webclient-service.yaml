{{- if .Values.webclient.enabled }}
{{- $webclientName := include "matrix-synapse.externalname" (dict "global" . "external" "webclient") -}}
{{- $component := "webclient" -}}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $webclientName }}
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  selector:
    app.kubernetes.io/component: {{ $component }}
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
{{- end }}
