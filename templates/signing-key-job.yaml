{{- if .Values.signingkey.job.enabled }}
{{- if .Values.signingkey.existingSecret }}
{{- fail "Can't specify both signingkey.job.enabled and signingkey.existingSecret" }}
{{- end }}
{{- $name := include "matrix-synapse.workername" (dict "global" . "worker" "signingkey-job") }}
{{- $secretName := include "matrix-synapse.workername" (dict "global" . "worker" "signingkey") }}
{{- if not (lookup "v1" "secret" .Release.Namespace $secretName)}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
    app.kubernetes.io/component: signingkey-job
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
    app.kubernetes.io/component: signingkey-job
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - {{ $secretName }}
    verbs:
      - get
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
    app.kubernetes.io/component: signingkey-job
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-check
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
data: 
  check.sh: |
    #!/bin/bash
    # Das Script dient zur Fake-Überwachung vom signing-key-job

    # Überprüfen der Anzahl der übergebenen Parameter
    # Optionen und ihre Standardwerte
    option=""

    # Optionen parsen
    while getopts ":rh:" opt; do
      case $opt in
        o)
          option=$OPTARG
          ;;
        \?)
          echo "Ungültige Option: -$OPTARG"
          echo "[-o ready] für readiness oder [-o health] für healtcheck"
          exit 1
          ;;
      esac
    done

    # Überprüfen der Eingabeoption
    case $option in
      ready)
        if [ -f "/usr/local/bin/generate_signing_key" ]; then
          #Job ist bereit
        else
          exit 1
        fi
        ;;
      health)
        if pgrep -f "generate_signing_key.py" >/dev/null || pgrep -f "/scripts/signing-key.sh" >/dev/null ; then
        #Job läuft, alles gut
          exit 0
        else
        #Job läuft nicht
          exit 1
        fi
        ;;
      *)
        echo "Ungültige Eingabeoption. Bitte ready oder health als Option angeben angeben."
        exit 1
        ;;
    esac

---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
    app.kubernetes.io/component: signingkey-job
spec:
  ttlSecondsAfterFinished: 0
  template:
    metadata:
      labels:
        {{- include "matrix-synapse.labels" . | nindent 8 }}
        app.kubernetes.io/component: signingkey-job
        to-apiserver: allowed
    spec:
      {{- include "matrix-synapse.imagePullSecrets" $ | nindent 6 }}
      serviceAccountName: {{ $name }}
      containers:
        - command:
            - sh
            - -c
            - |
              echo "Generating signing key..."
              if which generate_signing_key.py >/dev/null; then
                generate_signing_key.py -o /synapse/keys/signing.key
              else
                generate_signing_key -o /synapse/keys/signing.key
              fi
          image: "{{ .Values.signingkey.job.generateImage.repository }}:{{ .Values.signingkey.job.generateImage.tag | default ( include "matrix-synapse.imageTag" .) }}"
          imagePullPolicy: {{ .Values.signingkey.job.generateImage.pullPolicy }}
          name: signing-key-generate
          readinessProbe:
            exec:
              command:
              - /bin/bash
              - -c
              - /config/check.sh -o ready
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
              - /bin/bash
              - -c
              - /config/check.sh -o health
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.signingkey.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /synapse/keys
              name: matrix-synapse-keys
            - name: check-mount
              mountPath: /config
          securityContext:
            runAsNonRoot: true
            runAsUser: 2018
            readOnlyRootFilesystem: true
        - command:
            - sh
            - -c
            - |
              printf "Checking rights to update secret... "
              kubectl auth can-i update secret/${SECRET_NAME}
              /scripts/signing-key.sh
          env:
            - name: SECRET_NAME
              value: {{ $secretName }}
          image: "{{ .Values.signingkey.job.publishImage.repository }}:{{ .Values.signingkey.job.publishImage.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.signingkey.job.publishImage.pullPolicy }}
          name: signing-key-upload
          readinessProbe:
            exec:
              command:
              - /bin/bash
              - -c
              - /config/check.sh -o ready
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
              - /bin/bash
              - -c
              - /config/check.sh -o health
            initialDelaySeconds: 10
            periodSeconds: 15          
          securityContext:
            runAsNonRoot: true
            runAsUser: 2019
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.signingkey.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /scripts
              name: scripts
              readOnly: true
            - name: check-mount
              mountPath: /config              
            - mountPath: /synapse/keys
              name: matrix-synapse-keys
              readOnly: true
      restartPolicy: Never
      serviceAccount: {{ $name }}
      volumes:
        - name: scripts
          configMap:
            name: {{ include "matrix-synapse.fullname" . }}-scripts
            defaultMode: 0755
        - name: check-mount
          configMap: 
            name: {{ $name }}-check
            defaultMode: 0755
        - name: matrix-synapse-keys
          emptyDir:
            sizeLimit: 1Mi
  parallelism: 1
  completions: 1
  backoffLimit: 1
{{- end }}
{{- end }}
