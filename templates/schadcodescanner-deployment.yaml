{{- if and .Values.contentscanner.enabled .Values.schadcodescanner.enabled }}
{{  $config := .Values.schadcodescanner }}

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "matrix-synapse.schadcodescannername" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "matrix-synapse.labels" $ | nindent 4 }}
    app.kubernetes.io/component:  {{ include "matrix-synapse.schadcodescannername" . }}
spec:
  replicas: {{ $config.replicaCount }}
  selector:
    matchLabels:
      {{- include "matrix-synapse.schadcodescannerselectorLabels" . | nindent 6 }}
  serviceName: {{ include "matrix-synapse.schadcodescannername" . }}
  template:
    metadata:
      labels:
        {{- include "matrix-synapse.schadcodescannerselectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/schadcodescanner-configuration.yaml") . | sha256sum }}
    spec:
      securityContext:
        fsGroup: 1001
      containers:
      - name: clamav
        image: "{{ $config.image.repository }}:{{ $config.image.tag }}"
        imagePullPolicy: {{ $config.image.pullPolicy }}
        ports:
          - name: clamav
            containerPort: {{ $config.service.port }}
            protocol: TCP
        resources:
          {{- toYaml $config.resources | nindent 10 }}
        volumeMounts:
          - name: clamsocket
            mountPath: /run/clamav/
          - name: signatures
            mountPath: /var/lib/clamav
      volumes:
      - name: clamsocket
        emptyDir: {}
      - name: config-volume
        projected:
          sources:
          - configMap:
              name: {{ include "matrix-synapse.schadcodescannername" . }}
      - name: signatures
        persistentVolumeClaim:
            claimName: {{ $config.persistence.claimName }} 
      {{- with $config.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $config.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $config.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- if hasKey $config "autoscaling" }}
  {{- if $config.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name:  hpa-{{ include "matrix-synapse.schadcodescannername" . }}
  labels:
    {{- include "matrix-synapse.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v2
    kind: StatefulSet
    name: {{ include "matrix-synapse.schadcodescannername" . }}
  minReplicas: {{ $config.autoscaling.minReplicas }}
  maxReplicas: {{ $config.autoscaling.maxReplicas }}
  metrics:
  {{- if $config.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $config.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
  {{- if $config.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $config.autoscaling.targetMemoryUtilizationPercentage }}
  {{- end }}
{{- end }}
{{- end }}


{{- end }}
