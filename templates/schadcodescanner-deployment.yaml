{{- if and .Values.contentscanner.enabled .Values.schadcodescanner.enabled }}
{{  $config := .Values.schadcodescanner }}

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "matrix-synapse.schadcodescannername" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "matrix-synapse.labels" $ | nindent 4 }}
    app.kubernetes.io/component:  {{ include "matrix-synapse.schadcodescannername" . }}
spec:
  replicas: {{ $config.replicaCount }}
  selector:
    matchLabels:
      {{- include "matrix-synapse.schadcodescannerselectorLabels" . | nindent 6 }}
  serviceName: {{ include "matrix-synapse.schadcodescannername" . }}
  template:
    metadata:
      labels:
        {{- include "matrix-synapse.schadcodescannerselectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/schadcodescanner-configuration.yaml") . | sha256sum }}
    spec:
    {{- include "matrix-synapse.imagePullSecrets" $ | nindent 6 }}
      containers:
      - name: c-icap-server
        image: "{{ $config.imagecicap.repository }}:{{ $config.imagecicap.tag }}"
        ports:
          - name: c-icap-clamav
            containerPort: {{ $config.service.port }}
            protocol: TCP
        volumeMounts:
          - name: clamsocket
            mountPath: /run/clamav/
          - name: config-volume
            mountPath: /clamav/config/
      - name: clamav
        image: "{{ $config.imageclamav.repository }}:{{ $config.imageclamav.tag }}"
        {{- if .Values.schadcodescanner.extraEnv }}
        env:
          {{- with .Values.schadcodescanner.extraEnv }}
              {{- . | toYaml | nindent 12 }}
          {{- end }}
        {{- end }}
        resources:
          {{- toYaml $config.resources | nindent 10 }}
        volumeMounts:
          - name: clamsocket
            mountPath: /run/clamav/
          - name: signatures
            mountPath: /clamav/database
          - name: config-volume
            mountPath: /clamav/config/
      volumes:
      - name: clamsocket
        emptyDir:
          sizeLimit: 50Mi
      - name: config-volume
        projected:
          sources:
          - configMap:
              name: {{ include "matrix-synapse.schadcodescannername" . }}
      - name: signatures
        persistentVolumeClaim:
      {{- if .Values.schadcodescanner.persistence.existingClaim }}
            claimName: {{ .Values.schadcodescanner.persistence.existingClaim }}
      {{- else }}
            claimName: {{ template "matrix-synapse.schadcodescannername" . }}
      {{- end }}
      {{- with $config.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $config.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $config.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- if hasKey $config "autoscaling" }}
  {{- if $config.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name:  hpa-{{ include "matrix-synapse.schadcodescannername" . }}
  labels:
    {{- include "matrix-synapse.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v2
    kind: StatefulSet
    name: {{ include "matrix-synapse.schadcodescannername" . }}
  minReplicas: {{ $config.autoscaling.minReplicas }}
  maxReplicas: {{ $config.autoscaling.maxReplicas }}
  metrics:
  {{- if $config.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $config.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
  {{- if $config.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $config.autoscaling.targetMemoryUtilizationPercentage }}
  {{- end }}
{{- end }}
{{- end }}

{{- end }}
