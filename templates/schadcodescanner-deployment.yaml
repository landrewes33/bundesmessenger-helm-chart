{{- if and .Values.contentscanner.enabled .Values.schadcodescanner.enabled }}
{{  $config := .Values.schadcodescanner }}

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "matrix-synapse.schadcodescannername" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "matrix-synapse.labels" $ | nindent 4 }}
    app.kubernetes.io/component:  {{ include "matrix-synapse.schadcodescannername" . }}
spec:
  replicas: {{ $config.replicaCount }}
  selector:
    matchLabels:
      {{- include "matrix-synapse.schadcodescannerselectorLabels" . | nindent 6 }}
  serviceName: {{ include "matrix-synapse.schadcodescannername" . }}
  template:
    metadata:
      labels:
        {{- include "matrix-synapse.schadcodescannerselectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/schadcodescanner-configuration.yaml") . | sha256sum }}
    spec:
    {{- include "matrix-synapse.imagePullSecrets" $ | nindent 6 }}
      containers:
      - name: c-icap-server
        image: "{{ $config.imagecicap.repository }}:{{ $config.imagecicap.tag }}"
#        image: registry.opencode.de/bwi/bundesmessenger/backend/container-images/jammy-base:latest
        ports:
          - name: c-icap-clamav
            containerPort: {{ $config.service.port }}
            protocol: TCP
#        command:
#          - sh
#          - -c
#          - |
#            echo 'Acquire::http::Proxy "http://pa-bwm-vm014.example.com:3128";' > /etc/apt/apt.conf && apt -y install c-icap libc-icap-mod-virus-scan libc-icap-mod-urlcheck libc-icap-mod-contentfiltering clamav-daemon && clamdscan --ping 1000 -c /clamav/config/clamdcheck.conf && /usr/bin/c-icap -f /clamav/config/c-icap.conf -D -N
        volumeMounts:
          - name: clamsocket
            mountPath: /run/clamav/
          - name: config-volume
            mountPath: /clamav/config/
      - name: clamav
        image: "{{ $config.imageclamav.repository }}:{{ $config.imageclamav.tag }}"
#        image: clamav/clamav:latest
#        imagePullPolicy: {{ $config.image.pullPolicy }}
        env:
        {{- if .Values.extraEnv }}
          {{- with .Values.extraEnv }}
              {{- . | toYaml | nindent 12 }}
          {{- end }}
        {{- end }}
#        command:
#          - sh
#          - -c
#          - |
#            echo 'Acquire::http::Proxy "http://pa-bwm-vm014.example.com:3128";' > /etc/apt/apt.conf && \
#            apt -y install libc-icap-mod-virus-scan libc-icap-mod-urlcheck libc-icap-mod-contentfiltering sudo && \ 
#            clamdbin=$(which clamd) && sudo -u clamav "$clamdbin -c /clamav/config/clamd.conf -F" && \
#            freshclambin=$(which freshclam) &&  sudo -u clamav "$freshclambin /clamav/config/freshclam.conf --foreground --datadir=/clamav/database --verbose"
        resources:
          {{- toYaml $config.resources | nindent 10 }}
        volumeMounts:
          - name: clamsocket
            mountPath: /run/clamav/
          - name: signatures
            mountPath: /clamav/database
          - name: config-volume
            mountPath: /clamav/config/
      volumes:
      - name: clamsocket
        emptyDir: {}
      - name: config-volume
        projected:
          sources:
          - configMap:
              name: {{ include "matrix-synapse.schadcodescannername" . }}
      - name: signatures
        persistentVolumeClaim:
      {{- if .Values.schadcodescanner.persistence.existingClaim }}
            claimName: {{ .Values.schadcodescanner.persistence.existingClaim }}
      {{- else }}
            claimName: {{ template "matrix-synapse.schadcodescannername" . }} 
      {{- end }}
      {{- with $config.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $config.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $config.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- if hasKey $config "autoscaling" }}
  {{- if $config.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name:  hpa-{{ include "matrix-synapse.schadcodescannername" . }}
  labels:
    {{- include "matrix-synapse.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v2
    kind: StatefulSet
    name: {{ include "matrix-synapse.schadcodescannername" . }}
  minReplicas: {{ $config.autoscaling.minReplicas }}
  maxReplicas: {{ $config.autoscaling.maxReplicas }}
  metrics:
  {{- if $config.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $config.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
  {{- if $config.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $config.autoscaling.targetMemoryUtilizationPercentage }}
  {{- end }}
{{- end }}
{{- end }}

{{- end }}
