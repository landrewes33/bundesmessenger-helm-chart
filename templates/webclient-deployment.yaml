{{- if .Values.webclient.enabled }}
{{- $wkName := include "matrix-synapse.externalname" (dict "global" . "external" "webclient") -}}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $wkName }}
  labels:
    {{- include "matrix-synapse.labels" $ | nindent 4 }}
    app.kubernetes.io/component: webclient
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ $wkName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ $wkName }}
    spec:
      {{- include "matrix-synapse.imagePullSecrets" . | nindent 6 }}
      containers:
      - name: element
        image: "{{ $.Values.webclient.image.repository }}:{{  $.Values.webclient.image.tag }}"
        imagePullPolicy: {{ $.Values.webclient.image.pullPolicy }}
        volumeMounts:
        - name: files
          mountPath: /app/config.json
          subPath: config.json
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        readinessProbe:
            httpGet:
                path: /
                port: http
            initialDelaySeconds: 2
            periodSeconds: 3
        livenessProbe:
            httpGet:
                path: /
                port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
      - name: files
        configMap:
          name: {{ $wkName }}
{{- end }}
