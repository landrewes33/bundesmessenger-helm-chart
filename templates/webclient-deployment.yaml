{{- $wkName := include "matrix-synapse.externalname" (dict "global" . "external" "webclient") -}}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $wkName }}
  labels:
    {{- include "matrix-synapse.labels" $ | nindent 4 }}
    app.kubernetes.io/component: webclient
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: webclient
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/component: webclient
    spec:
      {{- include "matrix-synapse.imagePullSecrets" . | nindent 6 }}
#      imagePullSecrets:
#      - name: bum-gitlab
      containers:
      - name: element
        image: vectorim/element-web:latest
#        image: registry.opencode.de/bwi/bundesmessenger/backend/container-images/bundesmessenger-web:latest
        volumeMounts:
        - name: files
          mountPath: /app/config.json
          subPath: config.json
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        readinessProbe:
            httpGet:
                path: /
                port: http
            initialDelaySeconds: 2
            periodSeconds: 3
        livenessProbe:
            httpGet:
                path: /
                port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
      - name: files
        configMap:
          name: {{ $wkName }}
