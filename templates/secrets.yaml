---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "matrix-synapse.fullname" . }}
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
stringData:
  config.yaml: |
    {{- if .Values.config.recaptcha }}
    ## Captcha ##

    recaptcha_private_key: {{ .Values.config.recaptcha.privateKey | quote }}
    {{- end }}
    {{- if .Values.config.turnSecret }}

    ## Turn ##

    turn_shared_secret: {{ .Values.config.turnSecret | quote }}

    {{- end }}
    ## Registration ##

    registration_shared_secret: {{ .Values.config.registrationSharedSecret | default (randAlphaNum 24) | quote }}

    ## API Configuration ##

    {{- if .Values.config.macaroonSecretKey }}

    macaroon_secret_key: {{ .Values.config.macaroonSecretKey | quote }}
    {{- end }}

{{- $postgresHost := include "matrix-synapse.postgresql.host" . }}
{{- $postgresDB   := include "matrix-synapse.postgresql.database" . }}
{{- $postgresUser := include "matrix-synapse.postgresql.username" . }}
{{- $postgresPort := include "matrix-synapse.postgresql.port" . }}
{{- $postgresPass := include "matrix-synapse.postgresql.password" . }}
{{- $postgresSSLMode := include "matrix-synapse.postgresql.sslmode" . }}
{{- $postgresExtraArgs := include "matrix-synapse.postgresql.extraArgs" . }}

    ## Database configuration ##

    database:
      name: "psycopg2"
      args:
        user: {{ $postgresUser | quote }}
        {{- if and $postgresPass (not .Values.postgresql.existingSecret) }}
        password: {{ $postgresPass | quote }}
        {{- else }}
        password: "@@POSTGRES_PASSWORD@@"
        {{- end }}
        database: {{ $postgresDB | quote }}
        host: {{ $postgresHost | quote }}
        port: {{ $postgresPort }}
        sslmode: {{ $postgresSSLMode | quote }}
        cp_min: 5
        cp_max: 10
        {{- $postgresExtraArgs | nindent 8 }}

{{- $redisHost := include "matrix-synapse.redis.host" . }}
{{- $redisPort := include "matrix-synapse.redis.port" . }}
{{- $redisPass := include "matrix-synapse.redis.password" . }}

    ## Redis configuration ##

    redis:
      enabled: true
      host: {{ $redisHost | quote }}
{{- if or .Values.redis.auth.enabled .Values.redis.usePassword .Values.redis.password .Values.redis.auth.password .Values.externalRedis.password }}
  {{- if and $redisPass (not .Values.redis.existingSecret)  }}
      password: {{ $redisPass | quote }}
  {{- else }}
      password: "@@REDIS_PASSWORD@@"
  {{- end }}
  {{- if $redisPort }}
      port: {{ $redisPort }}
  {{- end }}
{{- end }}

    {{- with .Values.extraSecrets }}

    ## Extra secrets ##
    {{ . | toYaml | nindent 4 }}
    {{- end }}

{{- if and .Values.signingkey.job.enabled (not .Values.signingkey.existingSecret) }}
  {{- $name := include "matrix-synapse.workername" (dict "global" . "worker" "signingkey") }}
  {{- if not (lookup "v1" "Secret" .Release.Namespace $name) }}
---
apiVersion: v1
kind: Secret
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: {{ $name }}
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
    app.kubernetes.io/component: signingkey-job
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: matrix-synapse-sygnal
stringData:
  sygnal.yaml: |
    ##
    # This is a configuration for Sygnal, the reference Push Gateway for Matrix
    # See: matrix.org
    ##

    # The 'database' setting defines the database that sygnal uses to store all of
    # its data.
    #
    # 'name' gives the database engine to use: either 'sqlite3' (for SQLite) or
    # 'psycopg2' (for PostgreSQL).
    #
    # 'args' gives options which are passed through to the database engine,
    # except for options starting 'cp_', which are used to configure the Twisted
    # connection pool. For a reference to valid arguments, see:
    #   * for sqlite: https://docs.python.org/3/library/sqlite3.html#sqlite3.connect
    #   * for postgres: https://www.postgresql.org/docs/current/libpq-connect.html#LIBPQ-PARAMKEYWORDS
    #   * for the connection pool: https://twistedmatrix.com/documents/current/api/twisted.enterprise.adbapi.ConnectionPool.html#__init__
    #
    # BEST PRACTISE BWI GmbH
    
    ## Logging #
    #
    log:
      # Specify a Python logging 'dictConfig', as described at:
      #   https://docs.python.org/3.7/library/logging.config.html#logging.config.dictConfig
      #
      setup:
        version: 1
        formatters:
          normal:
            format: "%(asctime)s [%(process)d] %(levelname)-5s %(name)s %(message)s"
        handlers:
          # This handler prints to Standard Error
          #
          stderr:
            class: "logging.StreamHandler"
            formatter: "normal"
            stream: "ext://sys.stderr"

          # This handler prints to Standard Output.
          #
          stdout:
            class: "logging.StreamHandler"
            formatter: "normal"
            stream: "ext://sys.stdout"

          # This handler demonstrates logging to a text file on the filesystem.
          # You can use logrotate(8) to perform log rotation.
          #
          file:
            class: "logging.handlers.WatchedFileHandler"
            formatter: "normal"
            filename: "/log/sygnal.log"
        loggers:
          # sygnal.access contains the access logging lines.
          # Comment out this section if you don't want to give access logging
          # any special treatment.
          #
          sygnal.access:
            propagate: false
            handlers: ["stdout"]
            level: "DEBUG"

          # sygnal contains log lines from Sygnal itself.
          # You can comment out this section to fall back to the root logger.
          #
          sygnal:
            propagate: false
            handlers: ["stderr", "file"]

        root:
          # Specify the handler(s) to send log messages to.
          handlers: ["stderr"]
          level: "DEBUG"

        disable_existing_loggers: false


      access:
        # Specify whether or not to trust the IP address in the `X-Forwarded-For`
        # header. In general, you want to enable this if and only if you are using a
        # reverse proxy which is configured to emit it.
        #
        x_forwarded_for: false

    ## HTTP Server (Matrix Push Gateway API) #
    #
    http:
      # Specify a list of interface addresses to bind to.
      #
      # This example listens on the IPv4 loopback device:
      #bind_addresses: ['127.0.0.1']
      # This example listens on all IPv4 interfaces:
      bind_addresses: ['0.0.0.0']
      # This example listens on all IPv4 and IPv6 interfaces:
      #bind_addresses: ['0.0.0.0', '::']

      # Specify the port number to listen on.
      #
      port: 80

    ## Proxying for outgoing connections #
    #
    # Specify the URL of a proxy to use for outgoing traffic
    # (e.g. to Apple & Google) if desired.
    # Currently only HTTP proxies with CONNECT capability are supported.
    #
    # If you do not specify a value, the `HTTPS_PROXY` environment variable will
    # be used if present. Otherwise, no proxy will be used.
    #
    # Default is unspecified.
    #
    ##proxy:
    ## Metrics #
    #
    metrics:
      ## Prometheus #
      #
      prometheus:
        # Specify whether or not to enable Prometheus.
        #
        enabled: true

        # Specify an address for the Prometheus HTTP Server to listen on.
        #
        address: '127.0.0.1'

        # Specify a port for the Prometheus HTTP Server to listen on.
        #
        port: 9090

      ## OpenTracing #
      #
      opentracing:
        # Specify whether or not to enable OpenTracing.
        #
        enabled: false

        # Specify an implementation of OpenTracing to use. Currently only 'jaeger'
        # is supported.
        #
        implementation: jaeger

        # Specify the service name to be reported to the tracer.
        #
        service_name: sygnal

        # Specify configuration values to pass to jaeger_client.
        #
        jaeger:
          sampler:
            type: 'const'
            param: 1
          #        local_agent:
          #          reporting_host: '127.0.0.1'
          #          reporting_port:
          logging: true

      ## Sentry #
      #
      sentry:
        # Specify whether or not to enable Sentry.
        #
        enabled: false


    #######################################################################
    ############################# Apps - Config ###########################
    #######################################################################
    apps:
    {{- with .Values.sygnal.apns }}
    ## APNs aus value ##
      {{ . | toYaml | nindent 6 }}
    {{- end }}
---
