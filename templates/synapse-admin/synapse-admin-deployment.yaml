{{- if .Values.synapse_admin.enabled }}
{{- $adminName := include "matrix-synapse.externalname" (dict "global" . "external" "synapse-admin") -}}
{{- $component := "synapse-admin" -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $adminName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "matrix-synapse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        {{- include "matrix-synapse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
    spec:
      serviceAccountName: {{ include "matrix-synapse.serviceAccountName" . }}
      securityContext:
        {{- $.Values.synapse_admin.podSecurityContext | toYaml | nindent 8 }}
      {{- include "matrix-synapse.imagePullSecrets" $ | nindent 6 }}
      containers:
        - name: {{ $adminName }}
          image: "{{ printf "%s/%s:%s" .Values.synapse_admin.image.registry .Values.synapse_admin.image.repository .Values.synapse_admin.image.tag }}"
          imagePullPolicy: {{ .Values.synapse_admin.image.pullPolicy }}
          securityContext:
            {{- .Values.synapse_admin.securityContext | toYaml | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml .Values.synapse_admin.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            periodSeconds: 3
            tcpSocket:
              port: http
          volumeMounts:
          - name: tmp
            mountPath: /tmp
          - name: site
            mountPath: /etc/nginx/sites-enabled/default.conf
            subPath: default.conf
          - name: nginx-conf
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true            
          - name: nginx-conf-d
            mountPath: /etc/nginx/conf.d
            readOnly: true
          {{- with .Values.synapse_admin.extraVolumeMounts }}
          {{- . | toYaml | nindent 12 }}
          {{- end }}
      restartPolicy: Always
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 60Mi
          medium: Memory
      - name: nginx-conf
        configMap:
          name: nginx-conf-default
      - name: nginx-conf-d
        configMap:
          name: nginx-conf-d
      - name: site
        configMap:
          name: {{ $adminName }}
          items:
            - key: sadm.conf
              path: default.conf
      {{- with .Values.synapse_admin.extraVolumes }}
      {{- . | toYaml | nindent 8 }}
      {{- end }}
{{- end }}
