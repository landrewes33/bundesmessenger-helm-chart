{{- if .Values.mas.enabled }}
{{- $name := include "matrix-synapse.externalname" (dict "global" . "external" "matrix-authentication-service") -}}
{{- $component := "matrix-authentication-service" -}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "matrix-synapse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  serviceName: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "matrix-synapse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/matrix-authentication-service/matrix-authentication-service-configuration.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      {{- include "matrix-synapse.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.mas.podSecurityContext | nindent 8 }}
      serviceAccountName: {{ include "matrix-synapse.serviceAccountName" . }}
      automountServiceAccountToken: false
      initContainers:
        # Workaround for listing signingkeys until the `keys_dir` setting lands:
        # https://github.com/element-hq/matrix-authentication-service/pull/4877
        - name: generate-signingkeys-config
          image: {{ quote (printf "%s/%s:%s"
            .Values.mas.image.registry .Values.mas.image.repository .Values.mas.image.tag
          )}}
          imagePullPolicy: {{ .Values.mas.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.mas.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.mas.resources | nindent 12 }}
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              INDIR=/mas/secret/signingkey
              OUTFILE=/mas/config/signingkeys/signingkeys.yaml
              {
                echo "secrets:"
                echo "  keys:"
                find -L "$INDIR" -maxdepth 1 -type f -print0 | xargs -0 \
                  printf "    - key_file: \"%s\"\n"
              } | tee "$OUTFILE"
          volumeMounts:
            - name: secret-signingkeys
              mountPath: /mas/secret/signingkey
            - name: config-signingkeys
              mountPath: /mas/config/signingkeys
      containers:
        - name: {{ $component }}
          command:
            - mas-cli
            - server
            - --config=/mas/config/config.yaml
            - --config=/mas/config/mas-secret.yaml
            - --config=/mas/config/signingkeys/signingkeys.yaml
          image: "{{ printf "%s/%s:%s" .Values.mas.image.registry .Values.mas.image.repository .Values.mas.image.tag }}"
          imagePullPolicy: {{ .Values.mas.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.mas.securityContext | nindent 12 }}
          ports:
            - name: web
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: health
              containerPort: 9099
              protocol: TCP
            - name: adminapi
              containerPort: 8081
              protocol: TCP
          {{- with .Values.mas.livenessProbe }}
          livenessProbe:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.mas.readinessProbe }}
          readinessProbe:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.mas.startupProbe }}
          startupProbe:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /mas/config
            - name: config-signingkeys
              mountPath: /mas/config/signingkeys
            - name: secrets
              mountPath: /mas/secret
            - name: secret-signingkeys
              mountPath: /mas/secret/signingkey
          {{- with .Values.mas.extraVolumeMounts }}
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.mas.resources | nindent 12 }}
      volumes:
        - name: config
          projected:
            sources:
            - configMap:
                name: {{ $name }}
                items:
                  - key: config.yaml
                    path: config.yaml
            - secret:
                name: {{ $name }}
                items:
                  - key: mas-secret.yaml
                    path: mas-secret.yaml
        - name: config-signingkeys
          emptyDir:
            sizeLimit: 10Mi
            medium: Memory
        - name: secrets
          projected:
            sources:
              - secret:
                  name: {{ .Values.mas.encryption.existingSecret | quote }}
                  items:
                    - key: {{ .Values.mas.encryption.existingSecretKey | quote }}
                      path: encryption
              {{- if and
                  ($secretName := include "matrix-synapse.mas.matrixSharedSecret.secretName" .)
                  ($secretKey := include "matrix-synapse.mas.matrixSharedSecret.secretKey" .)
              }}
              - secret:
                  name: {{ quote $secretName }}
                  items:
                    - key: {{ quote $secretKey }}
                      path: matrix-shared-secret
              {{- end }}
        - name: secret-signingkeys
          secret:
            secretName: {{ .Values.mas.signingkeys.existingSecret | quote }}
      {{- with .Values.mas.extraVolumes }}
        {{- . | toYaml | nindent 8 }}
      {{- end }}
{{- end }}
