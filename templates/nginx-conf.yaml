---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-default-conf
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    user www-data;
    error_log  /dev/stderr;
    pid /tmp/nginx.pid;
    events {}
    http {
      access_log  /dev/stdout;
      server_tokens off;
      include /etc/nginx/sites-enabled/default.conf;
      include mime.types;
    }
