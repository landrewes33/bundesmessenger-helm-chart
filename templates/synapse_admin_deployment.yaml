apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse-admin
  labels:
    app: synapse-admin
spec:
  replicas: 1
  strategy: 
    type: RollingUpdate
  selector:
    matchLabels:
      app: synapse-admin
  template:
    metadata:
      labels:
        app: synapse-admin
    spec:
      containers:
        - name: synapse-admin
          image: awesometechnologies/synapse-admin:latest
          ports:
            - containerPort: 80
      restartPolicy: Always
