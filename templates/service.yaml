---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "matrix-synapse.fullname" . }}
  annotations:
    {{- include "matrix-synapse.annotations" . | nindent 4 }} 
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort | default "http" }}
      protocol: TCP
      name: http
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/component: synapse
    {{- include "matrix-synapse.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "matrix-synapse.replicationname" . }}
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 9093
      targetPort: replication
      protocol: TCP
      name: replication
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "matrix-synapse.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: synapse
{{- $default := .Values.workers.default }}
{{- range $worker, $config := .Values.workers }}
{{- if and $config.enabled $config.listeners }}
{{- $name := $worker | replace "_" "-" }}
{{- $release := $.Release.Name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "matrix-synapse.workername" (dict "global" $ "worker" $name) }}
  annotations:
    {{- include "matrix-synapse.annotations" . | nindent 4 }} 
  labels:
    {{- include "matrix-synapse.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 8083
      targetPort: listener
      protocol: TCP
      name: listener
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "matrix-synapse.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
{{- end }}
{{- end }}

{{- if $.Values.sygnal.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: "push-local"
  labels:
    app: matrix-synapse-sygnal
spec:
  selector:
    app: matrix-synapse-sygnal
  type: ClusterIP
  ports:
    - name: sygnal-port
      port: 80
      targetPort: 5000
{{- end }}
