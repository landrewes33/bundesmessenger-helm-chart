{{- if .Values.networkpolicies.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-to-kubeapi
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      to-apiserver: allowed
  policyTypes:
    - Egress
  egress:
    - {}
{{- end }}
