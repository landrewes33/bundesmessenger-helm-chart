{{- if .Values.signingkey.job.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "matrix-synapse.fullname" . }}-scripts
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-delete-policy: hook-succeeded
data:
{{ (.Files.Glob "scripts/*.sh").AsConfig | indent 2 }}
{{- end }}

{{- if and ( .Files.Get "scripts/users.csv") ( .Values.demomode.enabled | default false ) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "matrix-synapse.fullname" . }}-users
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
data: 
{{ (.Files.Glob "scripts/users.csv").AsConfig | indent 2 }}
{{- end }}

{{- if and ( .Files.Get "scripts/admins.csv") ( .Values.demomode.enabled | default false ) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "matrix-synapse.fullname" . }}-admins
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
data:
{{ (.Files.Glob "scripts/admins.csv").AsConfig | indent 2 }}
{{- end}}
