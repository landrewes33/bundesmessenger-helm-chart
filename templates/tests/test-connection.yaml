{{- define "test-connection-annotations" -}}
"helm.sh/hook": test
"helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
{{- end -}}

{{- define "test-connection-image" -}}
- name: curl
  image: curlimages/curl:7.87.0
  command: ['curl']
  args: ['-v', '-f', '--connect-timeout', '5', '{{ . }}']
  securityContext:
    readOnlyRootFilesystem: true
    runAsUser: 5210
  resources:
    limits:
      cpu: "250m"
      memory: "32Mi"
    requests:
      cpu: "150m"
      memory: "16Mi"
  livenessProbe:
    periodSeconds: 10
    exec:
      command:
      - cat
      - /tmp/healthy
  readinessProbe:
    periodSeconds: 3
    exec:
      command:
      - cat
      - /tmp/healthy
{{- end -}}
---
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "matrix-synapse.fullname" . }}-test-connection"
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
  annotations:
    {{- include "test-connection-annotations" . | nindent 4 }}
spec:
  serviceAccountName: {{ .Release.Name }}
  securityContext:
    runAsNonRoot: true
  containers:
    {{- $url := printf "%s:%s%s" (include "matrix-synapse.fullname" .) ($.Values.service.port | toString) ("/_matrix/client/versions") -}}
    {{- include "test-connection-image" $url | nindent 4 }}
  restartPolicy: Never

{{- if .Values.wellknown.enabled }}
---
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "matrix-synapse.externalname" (dict "global" . "external" "wellknown-nginx") }}-server-test-connection"
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
  annotations:
    {{- include "test-connection-annotations" . | nindent 4 }}
spec:
  serviceAccountName: {{ .Release.Name }}
  securityContext:
    runAsNonRoot: true
  containers:
    {{- $url := printf "%s:%s%s" (include "matrix-synapse.externalname" (dict "global" . "external" "wellknown-nginx")) (80 | toString) ("/.well-known/matrix/server") -}}
    {{- include "test-connection-image" $url | nindent 4 }}
  restartPolicy: Never
---
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "matrix-synapse.externalname" (dict "global" . "external" "wellknown-nginx") }}-client-test-connection"
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  serviceAccountName: {{ .Release.Name }}
  securityContext:
    runAsNonRoot: true
  containers:
    {{- $url := printf "%s:%s%s" (include "matrix-synapse.externalname" (dict "global" . "external" "wellknown-nginx")) (80 | toString) ("/.well-known/matrix/client") -}}
    {{- include "test-connection-image" $url | nindent 4 }}
  restartPolicy: Never
{{- end }}

