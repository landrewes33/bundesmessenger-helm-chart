{{- define "test-connection-image" -}}
- name: test-connection
  image: "{{ printf "%s/%s:%s" .global.Values.tests.image.registry .global.Values.tests.image.repository .global.Values.tests.image.tag }}"
  imagePullPolicy: {{ .global.Values.tests.image.pullPolicy }}
  command: ['wget']
  args: ['--timeout=5', '-O-', '{{ .url }}']
  securityContext:
    {{- toYaml .global.Values.tests.securityContext | nindent 4 }}
  resources:
    {{- toYaml .global.Values.tests.resources | nindent 4 }}
  livenessProbe:
    periodSeconds: 10
    exec:
      command:
      - cat
      - /tmp/healthy
  readinessProbe:
    periodSeconds: 3
    exec:
      command:
      - cat
      - /tmp/healthy
{{- end -}}

---
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "matrix-synapse.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    {{- with .Values.tests.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  serviceAccountName: {{ include "matrix-synapse.serviceAccountName" . }}
  {{- include "matrix-synapse.imagePullSecrets" . | nindent 2 }}
  securityContext:
    {{- toYaml .Values.tests.podSecurityContext | nindent 4 }}
  containers:
    {{- $url := printf "%s:%s%s" (include "matrix-synapse.fullname" .) ($.Values.service.port | toString) ("/_matrix/client/versions") -}}
    {{- include "test-connection-image" (dict "global" . "url" $url) | nindent 2 }}
  restartPolicy: Never

