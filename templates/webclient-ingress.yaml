{{- if .Values.webclient.enabled }}
{{- $wkName := include "matrix-synapse.externalname" (dict "global" . "external" "webclient") -}}

---
{{- $v1Ingress := .Capabilities.APIVersions.Has "networking.k8s.io/v1" -}}
{{- if $v1Ingress -}}
apiVersion: networking.k8s.io/v1
{{- else -}}
apiVersion: networking.k8s.io/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ $wkName }}
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
  annotations:
  {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.webclient.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
{{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
{{- end }}
  rules:
    - host: {{ .Values.webclient.uri | required "webclient.uri is required." }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
            {{- if $v1Ingress }}
              service:
                name: {{ $wkName }}
                port:
                  number: 80
            pathType: Prefix
            {{- else }}
              serviceName: {{ $wkName }}
              servicePort: 80
            {{- end }}
{{- end }}
