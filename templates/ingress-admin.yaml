{{- if .Values.ingress.enabled -}}
{{- $fullName := include "matrix-synapse.fullname" . -}}
{{- $masName := include "matrix-synapse.externalname" (dict "global" . "external" "matrix-authentication-service") -}}
{{- $adminUri := .Values.adminAPIServerName | required "A valid URI for the synapse Admin API (adminAPIServerName) is required." -}}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotationsAdminAPI }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
      {{- if has $adminUri .hosts }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
        {{- if .secretName }}
      secretName: {{ .secretName }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ $adminUri | quote }}
      http:
        paths:
  {{- $default := $.Values.workers.default }}
  {{- range $worker, $config := $.Values.workers }}
    {{- $name := $worker | replace "_" "-" }}
    {{- if and $config.enabled $config.listeners (or $config.paths $config.csPaths) }}
      {{- $service := include "matrix-synapse.workername" (dict "global" $ "worker" $name) }}
      {{- $csPaths := $config.csPaths }}
      {{- if $.Values.mas.enabled }}
        {{- range $csPath := $csPaths }}
          {{- range $path := $.Values.mas.paths }}
            {{- /* csPath starts with path, path from MAS has more priority */}}
            {{- if hasPrefix $path $csPath }}
              {{- $csPaths = without $csPaths $csPath }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- range $csPaths }}
        {{- if $.Values.ingress.traefikPaths }}
          - path: {{ printf "/{path:%s}" (trimPrefix "/" .) | quote }}
            backend:
              service:
                name: {{ $service }}
                port:
                  number: 8083
            pathType: ImplementationSpecific
        {{- else }}
          - path: {{ . | quote }}
            backend:
              service:
                name: {{ $service }}
                port:
                  number: 8083
            pathType: ImplementationSpecific
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}

  {{- if and $.Values.mas.enabled }}
    {{- range $.Values.mas.paths }}
      {{- if $.Values.ingress.traefikPaths }}
          - path: {{ printf "/{path:%s}" (trimPrefix "/" .) | quote }}
            backend:
              service:
                name: {{ $masName }}
                port:
                  number: 8080
            pathType: ImplementationSpecific
            {{- else }}
          - path: {{ . | quote }}
            backend:
              service:
                name: {{ $masName }}
                port:
                  number: 8080
            pathType: ImplementationSpecific
      {{- end }}
    {{- end }}
  {{- end }}

          - path: /_synapse
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $.Values.service.port }}
            pathType: Prefix

          - path: /_matrix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $.Values.service.port }}
            pathType: Prefix
{{- end }}
