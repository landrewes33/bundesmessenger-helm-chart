{{- if .Values.networkpolicies.enabled }}
{{- if .Values.schadcodescanner.enabled }}
{{- $component := "schadcodescanner" -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-{{ $component }}-allow-egress-clamavmirrors
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: {{ $component }}
  policyTypes:
    - Egress
  egress:
    - to:
      ports:
{{- if .Values.schadcodescanner.freshclam.mirrors }}
  {{- range .Values.schadcodescanner.freshclam.mirrors }}
      - protocol: TCP
        port: {{ (splitList ":" .) | last }}
  {{- end }}
{{- else }}
      - protocol: TCP
        port: 443
{{- end }}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-{{ $component }}-allow-ingress-content-scanner
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: {{ $component }}
  policyTypes:
    - Ingress
  ingress:
    - from:
      - podSelector:
          matchLabels:
            app.kubernetes.io/component: matrix-content-scanner
      ports:
      - protocol: TCP
        port: 1344
{{- end }}
{{- end }}