{{- if .Values.networkpolicies.enabled }}
{{- if and .Values.adminPortal.enabled .Values.mas.enabled }}
{{- $componentBase := "adminportal" -}}
{{- $coreName := "synapse-core" -}}
{{- $uiName := "synapse-ui" -}}
{{- $nodejsApps := list (printf "%s-%s" $componentBase $uiName) -}}

{{- range $component := $nodejsApps -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name }}-{{ $component }}-allow-ingress-controller
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: {{ $component }}
  policyTypes:
    - Ingress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: {{ $.Values.networkpolicies.ingressNamespace }}
      ports:
      - protocol: TCP
        port: 8080
{{ end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-{{ $componentBase }}-allow-ingress-controller
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: {{ $componentBase }}-{{ $coreName }}
  policyTypes:
    - Ingress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: {{ .Values.networkpolicies.ingressNamespace }}
      ports:
      - protocol: TCP
        port: 8000

---
{{/* Allow Synapse Core/Service Pod to ingress / adminAPIServerName */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-{{ $componentBase }}-allow-egress-to-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: {{ $componentBase }}-{{ $coreName }}
  policyTypes:
    - Egress
  egress:
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: {{ .Values.networkpolicies.ingressNamespace }}
      ports:
      - protocol: TCP
        port: 443
{{- end }}
{{- end }}
