{{- if .Values.networkpolicies.enabled }}
{{- if .Values.maspostgresql.enabled -}}
{{- $component := "maspostgresql" -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-{{ $component }}-allow-ingress-mas
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $component }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
      - podSelector:
          matchLabels:
            app.kubernetes.io/component: matrix-authentication-service
      ports:
      - protocol: TCP
        port: 5432
{{- end -}}
{{- end }}
