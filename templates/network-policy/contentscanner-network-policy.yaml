{{- if .Values.networkpolicies.enabled }}
{{- if .Values.contentscanner.enabled }}
{{- $component := "matrix-content-scanner" -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-{{ $component }}-allow-ingress-controller
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: {{ $component }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
      - protocol: TCP
        port: 8080

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-{{ $component }}-allow-synapse-media-repository-schadcodescanner
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: {{ $component }}
  policyTypes:
    - Egress
  egress:
    {{- if .Values.workers.media_repository.enabled }}
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/component: media-repository
      ports:
      - protocol: TCP
        port: 8083
    {{- else }}
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/component: synapse
      ports:
      - protocol: TCP
        port: 8008
    {{- end }}
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/component: schadcodescanner
      ports:
      - protocol: TCP
        port: 1344
{{- end }}
{{- end }}
