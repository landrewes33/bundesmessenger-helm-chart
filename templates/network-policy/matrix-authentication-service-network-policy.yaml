{{- if .Values.networkpolicies.enabled }}
{{- if .Values.mas.enabled }}
{{- $component := "matrix-authentication-service" -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-{{ $component }}-allow-egress-postgres
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: {{ $component }}
  policyTypes:
    - Egress
  egress:
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/component: synapse
      ports:
      - protocol: TCP
        port: 8008
    {{- if .Values.postgresql.enabled }}
    {{- /* internal postgresql from this chart */}}
    - to:
      - podSelector:
          matchLabels:
            {{- .Values.networkpolicies.postgres.selectorLabels | default (dict "app.kubernetes.io/name" "postgresql") | toYaml | nindent 12 }}
      ports:
      - protocol: TCP
        port: {{ .Values.postgresql.containerPorts.postgresql | default 5432 }}
    {{- else if .Values.networkpolicies.postgres.externalPostgresIP }}
    {{- /* external postgresql outside cluster selected by IP
          set an IP has higher priority than a label */}}
    - to:
      - ipBlock:
          cidr: "{{ .Values.networkpolicies.postgres.externalPostgresIP }}/32"
      ports:
      - protocol: TCP
        port: {{ .Values.externalPostgresql.port | default 5432 }}
    {{- else }}
    {{- /* external postgresql inside cluster selected by label */}}
    - to:
      - podSelector:
          matchLabels:
           {{- .Values.networkpolicies.postgres.selectorLabels | toYaml | nindent 12 }}
      ports:
      - protocol: TCP
        port: {{ .Values.externalPostgresql.port | default 5432 }}
    {{- end }}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-{{ $component }}-allow-ingress-monitoring
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: {{ $component }}
  policyTypes:
    - Ingress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: {{ .Values.networkpolicies.ingressNamespace }}
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
      - protocol: TCP
        port: 8080
    - ports:
      - protocol: TCP
        port: 9090
    - from:
      - podSelector:
          matchLabels:
            app.kubernetes.io/component: synapse
      ports:
      - protocol: TCP
        port: 8080
    - from:
    {{- range $worker, $config := .Values.workers }}
      {{- if $config.enabled }}
      {{- $name := $worker | replace "_" "-" }}
      - podSelector:
          matchLabels:
            app.kubernetes.io/component: {{ $name }}
      {{- end }}
    {{- end }}
      ports:
      - protocol: TCP
        port: 8080

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-{{ $component }}-adminapi-allow-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: {{ $component }}
  policyTypes:
    - Ingress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: {{ .Values.networkpolicies.ingressNamespace }}
      ports:
      - protocol: TCP
        port: 8081
{{- end }}
{{- end }}
