{{- if .Values.networkpolicies.enabled }}
{{- $component := "acme-http01-solver" -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "matrix-synapse.externalname"
    (dict "global" . "external" (print $component "-allow-ingress-controller"))
  }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml .Values.networkpolicies.acme.selectorLabels | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkpolicies.ingressNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkpolicies.acme.port }}
{{- end }}
