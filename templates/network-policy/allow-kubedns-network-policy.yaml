{{- if .Values.networkpolicies.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-to-dns
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
    {{- if .Values.networkpolicies.egressIpBlock }}
      {{- with .Values.networkpolicies.egressIpBlock }}
      - ipBlock:
        {{ if contains ":" . }}
        cidr: {{ (split ":" .) | first }}
      ports:
      - protocol: TCP
        port: {{ (split ":" .) | last }}
        {{- else }}
        cidr: .
        {{- end }}
      {{- end }}
    {{- else }}
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchExpressions:
            - key: k8s-app
              operator: In
              values:
                - {{ .Values.networkpolicies.dnsLabel }}
      {{- end }}
{{- end }}
