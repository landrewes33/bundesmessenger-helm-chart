{{- if .Values.wellknown.enabled }}
{{- $wkName := include "matrix-synapse.externalname" (dict "global" . "external" "wellknown-nginx") -}}
{{- $component := "wellknown-nginx" -}}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $wkName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "matrix-synapse.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $wkName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ .Values.wellknown.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "matrix-synapse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/well-known/well-known-config.yaml") . | sha256sum }}
      labels:
        {{- include "matrix-synapse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
    spec:
      serviceAccountName: {{ include "matrix-synapse.serviceAccountName" . }}
      {{- include "matrix-synapse.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.wellknown.podSecurityContext | nindent 8 }}
      containers:
        - name: nginx
          image: "{{ printf "%s/%s:%s" .Values.wellknown.image.registry .Values.wellknown.image.repository .Values.wellknown.image.tag }}"
          imagePullPolicy: {{ .Values.wellknown.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.wellknown.securityContext | nindent 12 }}
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - mountPath: /etc/nginx/sites-enabled/default.conf
              name: site
              readOnly: true
              subPath: default.conf
{{- $keys := concat (list "client" "server") (keys .Values.wellknown.extraData) }}
{{- range $key := $keys }}
            - mountPath: {{ $.Values.wellknown.htdocsPath }}/{{ $key }}.json
              name: files
              subPath: {{ $key }}.json
{{- end }}
            - mountPath: /tmp
              name: tmp
          resources:
            {{- toYaml .Values.wellknown.resources | nindent 12 }}
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-conf-default
        - name: files
          configMap:
            name: {{ $wkName }}
        - name: site
          configMap:
            name: {{ $wkName }}
            items:
            - key: bundesmessenger.conf
              path: default.conf
        - name: tmp
          emptyDir:
            sizeLimit: 10Mi
            medium: Memory
    {{- with .Values.wellknown.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.wellknown.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.wellknown.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
