    email: christian.steinke@bwi.de

dependencies:
  - name: redis
    version: ^16.1.0
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: postgresql
    version: ^10.9.4
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
