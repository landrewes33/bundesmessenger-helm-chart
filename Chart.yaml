version: 1.1.0

type: application
appVersion: 1.64.0
maintainers:
  - name: Christian Steinke
    email: christian.steinke@bwi.de

dependencies:
  - name: redis
    version: ^17.3.17
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: postgresql
    version: ^12.1.6
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
