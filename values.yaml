    tag: 0.11.1-jammy-production
    pullSecrets: []
    pullPolicy: IfNotPresent

  ## Resource configuration for Synapse-Admin Server.
  resources:
    limits:
      # (string) Compute resource limits to apply to the Synapse-Admin Server container.
      cpu: 50m
      # (string) RAM resource limits to apply to the Synapse-Admin Server container.
      memory: 50Mi
    requests:
      # (string) Compute resource requests to apply to the Synapse-Admin Server container.
      cpu: 5m
      # (string) RAM resource requests to apply to the Synapse-Admin Server container.
      memory: 15Mi

  # (map) Security context information that the pod should adopt.
  # Note: here the syscall for unprivileged user on privileged port must be set
  podSecurityContext:
    <<: *defaultPodSecurityContext
    runAsGroup: 1001
    runAsUser: 1001

  # (map) Configuration for container security policy of the container
  securityContext:
