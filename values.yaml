---
######################################################################################
##          Konfiguration für Synapse
######################################################################################
image:
  # -- (string) Repository/Image Konfiguration, für Synapse und Workernodes.
  #ursprünglich: "repository: matrixdotorg/synapse"
  repository: registry.opencode.de/bwi/bundesmessenger/backend/container-images/jammy-synapse

  # -- (string) kann die gesetzte Defaultversion überschreiben, wenn gesetzt.
  # @default -- wird im Charts.yaml gesetzt
  tag: '1.64.0'
  # -- (map) Optional kann ein Array von imagePullSecrets angegeben werden. 
  # Secrets müssen manuell im Namensraum angelegt werden.
  # ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  # Beispiel:
  # pullSecrets: 
  #   - name: myRegistryKeySecretName
  # @default -- nicht gesetzt
  pullSecrets: []

  # -- (string) Pullpolicy für das konfigurierte Image
  # imagePullPolicy „Always“, wenn tag ist „latest“ (imagepullpolicy-always.yaml)
  pullPolicy: IfNotPresent

  # -- (string) Überschreibt einen Teil des installierten Namens, behält aber den Releasenamen bei.
  nameOverride: ""

  # -- (string) Überschreiben Sie den vollständigen Namen des installierten Charts.
  fullnameOverride: ""


# -- (string) Der Matrix-Domänenname, der für den Domänenteil in Ihren MXIDs verwendet wird.
# @default -- Nicht gesetzt, aber Voraussetzung!
serverName: ''

# -- (string) Der öffentliche Matrix-Servername, der für alle öffentlichen URLs 
# in der Konfiguration sowie für Client-API-Links im Ingress verwendet wird.
# @default  -- Nicht gesetzt
publicServerName: ''

## Die Quelle des von Synapse im Verbund verwendeten Signierschlüssels.
##
signingkey:
  ## Aktivieren Sie einen Kubernetes-Job, um einen Signierschlüssel zu erzeugen und zu speichern, 
  ## wenn noch keiner vorhanden ist.
  ## Wenn Sie bereits einen Matrix-Server in Ihrer Domäne betrieben haben, dann
  ## wollen Sie den alten Signierschlüssel beibehalten, entweder durch Verwendung der `existingSecret`
  ## Konfiguration, oder indem Sie den alten Schlüssel unter `extraConfig.old_signing_keys` einbinden.
  ##
  ## Wenn Sie Ihren Signierschlüssel verlieren, kann es sein, dass der Föderationsverkehr von Ihrer Instanz
  ## möglicherweise nicht mehr vom weiteren Netzwerk als vertrauenswürdig eingestuft wird.

  job:
    # -- (bool) es wird ein Job zu Beginn des Deployments gestartet, der einen Signierschlüssel erzeugt.
    # Wenn abgeschaltet, muss ein vorhandener Schlüssel eingebunden werden, ansonsten ist eine Förderation
    # als nicht vertrauenswürdig eingestuft
    enabled: true

    generateImage:
      # -- (string) Repository/Image Konfiguration für Synapse-signing-key-job. Es wird dringend 
      # empfohlen, dass die gleiche Konfiguration wie vom Synapse bzw. den Workernodes genutzt wird.
      # ursprüngölich: "repository: matrixdotorg/synapse"
      repository: registry.opencode.de/bwi/bundesmessenger/backend/container-images/jammy-synapse-1.64.0
      pullSecrets: 
        - name: bum-gittoken
      #tag: latest
      # -- (string) PullPolicy für das Image vom Signing-Key-Job
      pullPolicy: IfNotPresent
    # -- (map) Repository/Image Konfiguration für den Upload des generierten Signing-Schlüssels. 
    # aktuelle Version am 13.06.2022 vom kubectl im bitnami-Repo
    publishImage:
      repository: bitnami/kubectl
      tag: 1.21.13-debian-11-r4
      pullPolicy: IfNotPresent

  ## Geben Sie ein bestehendes Signierschlüssel-Secret an, das im Voraus erstellt werden muss. 
  # existingSecret: secret-name
  # existingSecretKey: signing.key

  ## Ressourcen für das Image der Erzeugung vom Signierschlüssel
  resources: {}
  #  limits:
  #    cpu: 100m
  #    memory: 250Mi
  #  requests:
  #    cpu: 100m
  #    memory: 250Mi

## Matrix-Konfigurationswerte, die sich auf andere Teile des Charts auswirken, für jeden
## Wert, der nicht von diesem Block behandelt wird, sollten Sie ihn stattdessen in
## extraConfig unten einstellen.
## Ref: https://github.com/matrix-org/synapse/blob/develop/docs/sample_config.yaml
##
config:
  # -- (string) Die öffentlich zugängliche URL für die Synapse-Instanz 
  # lautet standardmäßig `https://<publicServerName>`
  # Beispiel: 
  # publicBaseurl: 'https://matrix.example.com'
  publicBaseurl: ''

  # -- (string) Das Loglevel  für Synapse und alle Module.
  logLevel: INFO

  # -- (bool) Nutzungsstatistiken (siehe extraConfig.reportStats) 
  reportStats: false

  ## Schützen Sie die Registrierung mit recaptcha. (optional)
  ##
  # recaptcha:
  #   publicKey: ''
  #   privateKey: ''

  # -- (list) URIs die zum Aufbau von 1:1 WebRTC Anrufe aufzubauen.
  # Beispiel:
  # turnUris: ["turn:turn.example.com:3478?transport=udp"]
  turnUris: []
  # -- (string) geheime Schlüssel für TURN-Server
  # turnSecret: ''

  # -- (bool) Registrierungskonfiguration, beachten Sie, dass die Registrierung mit dem
  # containerinternen Werkzeug register_new_matrix_user immer möglich ist. Synapse-Admin kann dafür genutzt werden.
  # @default -- false
  enableRegistration: false

  # -- (string) Hinweis: Dieser Wert wird standardmäßig auf eine zufällige Zeichenfolge gesetzt, wenn er nicht angegeben wird.
  registrationSharedSecret: ''

  # -- (string) Hinweis: Es wird dringend empfohlen, diesen Wert auf einen secure value (secret) zu setzen.
  macaroonSecretKey: ''

  # -- (map) Eine Gruppe von vertrauenswürdigen Servern, die zu kontaktieren sind, wenn ein anderer Server nicht auf eine
  # Signierschlüssel-Anfrage antwortet.
  trustedKeyServers:
    - server_name: matrix.org
  #   verify_keys:
  #     "ed25519:auto": "Noi6WqcDj0QmPxCNQqgezwTlBKrfqehY1u2FyWP9uYw"

  # -- (list) Extra listener 
  extraListeners: []
  #  - port: 9000
  #    bind_addresses: ['::']
  #    type: manhole

# -- (object) Best Practise BWI GmbH:
# Ref: https://github.com/matrix-org/synapse/blob/develop/docs/sample_config.yaml
# @default -- wird nachfolgend aufgeschlüsselt
extraConfig: 
#  old_signing_keys:
#    "ed25519:id": { key: "base64string", expired_ts: 123456789123 } 
  # -- (bool) Authentifizierung notwendig für User-Suche
  require_auth_for_profile_requests: true
  # -- (bool) Limitiere Requests für Nutzer mit shared rooms, abgeschaltet
  limit_profile_requests_to_users_who_share_rooms: false
  # -- (bool) Übersenden von Profildaten, wenn Chat gestartet wird
  include_profile_data_on_invite: true
  # -- (bool) Öffentliche Räume ohne Login/Authentifizierung, abgeschaltet!
  allow_public_rooms_without_auth: false
  # -- (bool) öffentliche Räume über Förderation erlauben, abgeschaltet 
  allow_public_rooms_over_federation: false
  # -- (bool) Einladung die von unpriviligierten Nutzern stammen blocken, abgeschaltet
  block_non_admin_invites: false
  # -- (list) IP-Whitelist für Förderation zwingend benötigt
  ip_range_whitelist: []
  presence: 
  # -- (bool) Anwesenheitstatus anzeigen, abgeschaltet (Load)
      enabled: false
  # -- (bool) Nutzersuche zulassen, eingeschaltet
  enable_search: true
  user_directory:
  # -- (bool) Nutzerverzeichnis erstellen, eingeschaltet (Vraussetzung für Nutzersuche)
      enabled: true
  # -- (bool) Suche alle Nutzer, eingeschaltet
      search_all_users: true
  # -- (bool) Alias nur für registrierte Nutzer (sowieso, nicht authentifizierte Nutzer sind abgeschaltet)
  require_membership_for_aliases: true
  # -- (string) Maximale Speicherzeit für IPs von Nutzern (Whitelist mapping)
  user_ips_max_age: 28d
  retention:
  # -- (bool) Nachrichtenaufbewahrungsrichtlinien einschalten (auf Raumebene)
      enabled: false
  # -- (bool) URL-Vorschau, abgeschaltet
  url_preview_enabled: false
  oembed:
  # -- (bool) eingebettete URL-Darstellung von Drittanbietern
      disable_default_providers: true
  # -- (bool) thirdParty Identifier lookup (3pid), abgeschaltet
  enable_3pid_lookup: false
  # -- (bool) Gastzugang, abgeschaltet
  allow_guest_access: false
  # -- (bool) Metriken erfassen, eingeschaltet
  enable_metrics: true
  # -- (bool) Erfassung Nutzungsstatistiken (Hostname, Synapse-Version und -Uptime, total_users usw.) an die Entwickler melden
  report_stats: false
  # -- (object) Passwortkonfiguration
  # @default -- folgende Aufschlüsselung
  password_config:
  # -- (bool) Passwortkonfiguration selbst definieren, eingeschaltet
      enabled: true
  # -- (bool) lokale Nutzerdatenbank, eingeschaltet
      localdb_enabled: true
      policy:
  # -- (bool) Passwortpolicy nutzen, eingeschaltet
          enabled: true
  # -- (int) Passwortmindestlänge in Zeichen
          minimum_length: 8
  # -- (bool) Zahl muss mit genutzt werden
          require_digit: true
  # -- (bool) Sonderzeichen muss genutzt werden
          require_symbol: true
  # -- (bool) Kleinbuchstaben muss genutzt werden
          require_lowercase: true
  # -- (bool) Großbuchstaben muss genutz werden
          require_uppercase: true
  ui_auth:
  # -- (string) User-Interactive Authentication API timeout 
      session_timeout: "15s"    
  push:
  # -- (bool) Push Modul verschickt Inhalt der Nachricht über Google-/Apple-Push-Services, abgeschaltet
      include_content: false
  # -- (string) Verschlüsselung der Räume (default Einstellung, eingeschaltet
  encryption_enabled_by_default_for_room_type: all
  stats:
  # -- (bool) Schalte Nutzerstatistiken ein, eingeschaltet
      enabled: true
  # -- (bool) Raumsuche, eingeschaltet
  enable_room_list_search: true 
  opentracing:
  # -- (bool) OpenTracing ist ein Werkzeug, das einen Einblick 
  # in den kausalen Zusammenhang der Arbeit in und zwischen Servern gibt. 
  # Die einzelnen Server verfolgen Ereignisse und melden 
  # sie an einen zentralen Server - im Fall von Synapse: Jaeger.
      enabled: false
  # -- (list) Whitelist (Domainbased) für Föderation
  federation_domain_whitelist: []
#    - poc1.dvs.example.com
#    - poc2.dvs.example.com
#    - poc3.dvs.example.com
  # -- (bool) dynamisches Vorschaubild, eingeschaltet
  dynamic_thumbnails: true

# -- (map) Geben Sie hier eine beliebige - geheime - Synapse-Konfiguration an;
# Diese Werte werden in Secrets anstelle von Configmaps gespeichert
# Ref: https://github.com/matrix-org/synapse/blob/develop/docs/sample_config.yaml
# Beispiel:
#  password_config:
#    pepper: ''
extraSecrets: {}

# -- (object) Konfiguration, die auf den Haupt-Synapse-Container anzuwenden ist.
# @default -- wird nachfolgend einzeln aufgeschlüsselt
synapse:
  strategy:
  # -- (string) Nur wirklich anwendbar, wenn das Deployment ein RWO PV angehängt hat (z.B. wenn Media Repository
  # für den Haupt-Synapse-Container aktiviert ist)
  # Da Replikate = 1 sind, kann eine Aktualisierung "hängen bleiben", da der vorherige Container mit dem
  # PV verbunden bleibt und der "neu-aufgebaute" Container nie starten kann. Das Ändern der Strategie auf "Recreate" wird
  # den einzelnen vorherigen Container beenden, so dass der neue, ankommende Container sich mit dem PV verbinden kann
    type: RollingUpdate

  # -- (map) Annotations, die auf den Haupt-Synapse-Container anzuwenden sind.
  # Beispiel: (Bundesmessenger lässt alle Services automatisch an Prometheus anbinden)
  #  prometheus.io/scrape: "true"
  #  prometheus.io/path: "/_synapse/metrics"
  #  prometheus.io/port: "9090"
  annotations: {} 

  # -- (map) Labels, die auf den Haupt-Synapse-Container anzuwenden sind.
  labels: {}

  # -- (map) Zusätzliche Umgebungsvariablen, die auf den Haupt-Synapse-pod anzuwenden sind
  # Beispiel:
  #  - name: LD_PRELOAD
  #    value: /usr/lib/x86_64-linux-gnu/libjemalloc.so.2
  #  - name: SYNAPSE_CACHE_FACTOR
  #    value: "2"
  extraEnv: []

  # -- (object) Zusätzliche in Synapse zu mountende Datenträger (Volumes)
  # Beispiel:
  #  - name: spamcheck
  #    flexVolume:
  #      driver: dvs/git-live
  #      options:
  #        repo: https://gitlab.opencode.de/bwi/bundesmessenger/synapse-module
  #        interval: 1d
  #      readOnly: true
  extraVolumes: []

  # -- (object) Zusätzliche in Synapse zu mountende Datenträgerpfade (Volumes)
  # Beispiel:
  #  - name: spamcheck
  #    mountPath: /usr/local/lib/python3.7/site-packages/company
  extraVolumeMounts: []

  # -- (list) Zusätzliche Befehle, die beim Starten von Synapse ausgeführt werden
  # Beispiele:
  # - 'apt-get update -yqq && apt-get install patch -yqq'
  # - 'patch -d/usr/local/lib/python3.7/site-packages/synapse -p2 < /synapse/patches/something.patch'
  extraCommands: []

  # -- (object) Konfiguration für die Container-Sicherheitsrichtlinie, Synapse wird immer als
  # sein eigener Benutzer ausgeführt, auch wenn dies nicht eingestellt ist. 
  # Beachten Sie, dass eine Änderung dieser Einstellung auch die Verwendung der volumePermission
  # Hilfsprogramm verwenden müssen, abhängig von Ihrem Speicher.
  podSecurityContext:
    runAsNonRoot: true
  #  fsGroup: 2666
  #  runAsGroup: 2666
  #  runAsUser: 2666

  # -- (map) Konfiguration für die Container-Sicherheitsrichtlinie, siehe oben
  # podSecurityContext für weitere relevante Informationen.
  securityContext: 
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 2666
  #  capabilities:
  #    drop:
  #    - ALL

  #Begrenzungen und Anforderungen für CPU-Ressourcen werden in CPU-Einheiten gemessen. 
  #In Kubernetes entspricht eine CPU-Einheit einem physischen CPU-Kern oder einem virtuellen Kern, 
  #je nachdem, ob es sich bei dem Knoten um einen physischen Host oder eine virtuelle Maschine handelt, 
  #die innerhalb einer physischen Maschine ausgeführt wird.
  #
  #Anteilige Anforderungen sind zulässig. 
  #Wenn Sie einen Container definieren und spec.containers[].resources.requests.cpu auf 0,5 setzen, 
  #fordern Sie nur halb so viel CPU-Zeit an, als wenn Sie 1,0 CPU anfordern würden. 
  #Für CPU-Ressourceneinheiten entspricht der Mengenausdruck 0,1 dem Ausdruck 100m, 
  #was als "einhundert Millicpu" gelesen werden kann. 
  #Manche Leute sagen "einhundert Millicores", und das bedeutet dasselbe.
  resources: 
    limits:
      # -- (string) Rechenressourcengrenzen, die auf den Haupt-Synapse-Container anzuwenden sind. 
      cpu: 1000m
      # -- (object) RAM Ressourcengrenzen, die auf den Haupt-Synapse-Container anzuwenden sind.
      memory: 2500Mi
    requests:
      # -- (string) Anforderungen an Rechenressourcen, die auf den Haupt-Synapse-Container anzuwenden sind. 
      cpu: 1000m
      # -- (string) Anforderungen an RAM Ressourcen, die auf den Haupt-Synapse-Container anzuwenden sind. 
      memory: 2500Mi

  #Healthcheck
  livenessProbe:
    httpGet:
      # -- (string) Zu verwendende Konfiguration für den Pfad des Healthchecks 
      path: /health
      # -- (string) Zu verwendende Konfiguration für den Port des Healthchecks 
      port: metrics

  #Bereitschaftscheck
  readinessProbe:
    httpGet:
      # -- (string) Konfiguration des Pfads vom Bereitschaftscheck
      path: /health
      # -- (string) Konfiguration des Ports vom Bereitschaftscheck
      port: metrics

  #Startup-Check
  startupProbe:
    # -- (int) Anzahl der Fehlversuche, damit Startzeit für Worker bei 60 Sekunden landet; Timeout default bei 10 Sekunden
    failureThreshold: 6
    httpGet:
      # -- (string) Konfiguration des Pfads vom Startup-Check
      # DEFAULT gilt für alle Synapse-Worker-Container. 
      path: /health
      # -- (string) Konfiguration des Ports vom Startup-Check
      # DEFAULT gilt für alle Synapse-Worker-Container. 
      port: metrics


  # -- (list) Node Selektoren, die für den Haupt-Synapse-Container festgelegt werden.
  nodeSelector: {}

#Die folgenden Taints sind eingebaut:
#    node.kubernetes.io/not-ready
#       Der Knoten ist nicht bereit. Dies entspricht dem Attribut NodeCondition Ready auf "False" gesetzt.
#    node.kubernetes.io/unreachable
#       Der Knoten ist vom Node Controller nicht erreichbar. 
#       Dies entspricht dem Attribut NodeCondition Ready auf "Unknown" gesetzt.
#    node.kubernetes.io/memory-pressure
#       Der Knoten hat Speicherbesonderheiten mit hohen Lasten auf den RAM
#    node.kubernetes.io/disk-pressure
#       Der Knoten hat IO-Last auf die Festplatte. 
#       Im Falle einer hohen Festplattenauslastung auf den Knoten kann dies zu einer 
#       Verlangsamung der Anwendung führen, so dass es besser ist, die Container zu verlagern.
#    node.kubernetes.io/pid-pressure
#       Ein Knoten hat Prozess-Last(PID-Druck). 
#       Die Prozess-ID ist eine begrenzte Ressource und ihre Sättigung 
#       kann zu einer Verlangsamung der Anwendungen führen, so dass es besser ist, 
#       Container an einen anderen Ort zu verlagern.
#    node.kubernetes.io/network-unavailable
#       Das Netzwerk des Knotens ist nicht verfügbar. Wie oben erklärt.
#    node.kubernetes.io/unschedulable
#       Der Knoten ist nicht planbar. 
#       Jeder andere Grund, der dazu führt, dass der Knoten für das Hosting von Container ungeeignet ist, 
#       z. B. wenn der Cluster verkleinert und der Knoten entfernt wird.

  # -- (list) Tolerations bzw. Taints die für den Haupt-Synapse-Container genutzt werden sollen.
  tolerations: []

  # -- Affinität zur Wahl von Nodes für die für den Haupt-Synapse-Container genutzt werden sollen.
  affinity: {}

## Konfiguration für die Handhabung von Synapse-Arbeitern(im Folgenden weiter Worker), 
## die nützlich sind für die Handhabung von Hochlast-Einsätzen bzw. Hochverfügbarkeitseinsätzen.
##
## Weitere Informationen finden Sie unter
## https://github.com/matrix-org/synapse/blob/master/docs/workers.md
##
workers:
  # -- (map) Annotations, die auf die Synapse-Worker-Container anzuwenden sind.
  # Standardkonfiguration, diese wird an alle Worker vererbt und kann auch
  # für jeden Workertyp überschrieben werden.
  # Beispiel: (Bundesmessenger lässt alle Services automatisch an Prometheus anbinden)
  #  prometheus.io/scrape: "true"
  #  prometheus.io/path: "/_synapse/metrics"
  #  prometheus.io/port: "9090"
  annotations: {}
  
  default:
    # -- (int) DEFAULT Die Anzahl der Worker-Replikate. 
    # Beachten Sie, dass einige Worker eine besondere Behandlung erfordern. 
    # Siehe dazu die Informations-URL https://github.com/matrix-org/synapse/blob/master/docs/workers.md
    replicaCount: 1

    strategy:
      # -- (string) DEFAULT gilt für alle Synapse-Worker-Container
      # Nur wirklich anwendbar, wenn das Deployment ein RWO PV angehängt hat (z.B. Media Repository)
      # Da Replikate = 1 sind, kann eine Aktualisierung "hängen bleiben", da der vorherige Container mit dem
      # PV verbunden bleibt und der "neu-aufgebaute" Container nie starten kann. Das Ändern der Strategie auf "Recreate" wird
      # den einzelnen vorherigen Container beenden, so dass der neue, ankommende Container sich mit dem PV verbinden kann
      type: RollingUpdate

    # -- (string)  Ein spezifischer Name für diesen Worker, kann nicht global gesetzt werden.
    # Beachten Sie, dass dies nur gesetzt werden kann, wenn replicaCount 1 ist. 
    # (wird in den Worker überschrieben, ist hier nur aus historischen Gründen noch enthalten)
    #name:

    ## Zusätzliche Konfiguration für die Worker, kann nicht global gesetzt werden.
    #extraConfig: {}

    # -- (map) DEFAULT Annotations, die auf alle Synapse-Worker-Container anzuwenden sind.
    # Beispiel: (Bundesmessenger lässt alle Services automatisch an Prometheus anbinden)
    #  prometheus.io/scrape: "true"
    #  prometheus.io/path: "/_synapse/metrics"
    #  prometheus.io/port: "9090"
    annotations: {}

    # -- (object) DEFAULT Zusätzliche Umgebungsvariablen, die auf alle Synapse-Worker-Container anzuwenden sind
    # Beispiel:
    #  - name: LD_PRELOAD
    #    value: /usr/lib/x86_64-linux-gnu/libjemalloc.so.2
    #  - name: SYNAPSE_CACHE_FACTOR
    #    value: "1.0"
    extraEnv: []

    # -- (map) Zusätzliche Volumes, die dem Worker hinzugefügt werden sollen.
    # DEFAULT gilt für alle Synapse-Worker-Container.
    # Nützlich für das Medien-Repo oder zum Hinzufügen von Python-Modulen.
    # Daher besser im entsprechenden Konfigurationsteil der spez. Worker
    volumes: []

    # -- (map) Zusätzliche zu mountende Datenträgerpfade (siehe volumes)
    # DEFAULT gilt für alle Synapse-Worker-Container.
    volumeMounts: []

    # -- (list) Zusätzliche Befehle, die beim Starten von Synapse ausgeführt werden
    # DEFAULT gilt für alle Synapse-Worker-Container.
    # Beispiele:
    # - 'apt-get update -yqq && apt-get install patch -yqq'
    # - 'patch -d/usr/local/lib/python3.7/site-packages/synapse -p2 < /synapse/patches/something.patch'
    extraCommands: []

    # -- (map) Informationen zum Sicherheitskontext, die dem Arbeiter mitgeteilt werden sollen.
    # DEFAULT gilt für alle Synapse-Worker-Container.
    # Beispiele:
    #   fsGroup: 2003
    #   runAsGroup: 2003
    #   runAsUser: 2003
    podSecurityContext: {} 

    # -- (map) Konfiguration für die Container-Sicherheitsrichtlinie
    # DEFAULT gilt für alle Synapse-Worker-Container.
    # Beispiele:
    #   readOnlyRootFilesystem: true
    #   runAsNonRoot: true
    #   runAsUser: 2003
    #   capabilities:
    #     drop:
    #       - ALL
    securityContext: {}

    resources: 
       limits:
         # -- (string) Rechenressourcengrenzen, die auf alle Synapse-Worker-Container anzuwenden sind. 
         # DEFAULT gilt für alle Synapse-Worker-Container. 
         # Epmfohlen gesondert zu verwalten
         cpu: 100m
         # -- (object) RAM Ressourcengrenzen, die auf alle Synapse-Worker-Container anzuwenden sind.
         # DEFAULT gilt für alle Synapse-Worker-Container. 
         # Epmfohlen gesondert zu verwalten
         memory: 128Mi
       requests:
         # -- (string) Anforderungen an Rechenressourcen, die auf alle Synapse-Worker-Container anzuwenden sind. 
         # DEFAULT gilt für alle Synapse-Worker-Container. 
         # Epmfohlen gesondert zu verwalten
         cpu: 100m
         # -- (string) Anforderungen an RAM Ressourcen, die auf alle Synapse-Worker-Container anzuwenden sind. 
         # DEFAULT gilt für alle Synapse-Worker-Container. 
         # Epmfohlen gesondert zu verwalten
         memory: 128Mi
  
    #Healthcheck
    livenessProbe:
      httpGet:
        # -- (string) Zu verwendende Konfiguration für den Pfad des Healthchecks 
        # DEFAULT gilt für alle Synapse-Worker-Container. 
        path: /health
        # -- (string) Zu verwendende Konfiguration für den Port des Healthchecks 
        # DEFAULT gilt für alle Synapse-Worker-Container. 
        port: metrics

    #Bereitschaftscheck
    readinessProbe:
      httpGet:
        # -- (string) Konfiguration des Pfads vom Bereitschaftscheck
        # DEFAULT gilt für alle Synapse-Worker-Container. 
        path: /health
        # -- (string) Konfiguration des Ports vom Bereitschaftscheck
        # DEFAULT gilt für alle Synapse-Worker-Container. 
        port: metrics

    #Startup-Check
    startupProbe:
      # -- (int) Anzahl der Fehlversuche, damit Startzeit für Worker bei 60 Sekunden landet; Timeout default bei 10 Sekunden
      failureThreshold: 6
      httpGet:
        # -- (string) Konfiguration des Pfads vom Startup-Check
        # DEFAULT gilt für alle Synapse-Worker-Container.
        path: /health
        # -- (string) Konfiguration des Ports vom Startup-Check
        # DEFAULT gilt für alle Synapse-Worker-Container.
        port: metrics

    # -- (list) Node Selektor Konfiguration, die auf alle Synapse-Worker-Container anzuwenden sind.
    # DEFAULT gilt für alle Synapse-Worker-Container. 
    nodeSelector: {}

    # -- (list) Tolerations/Tains Konfiguration, die auf alle Synapse-Worker-Container anzuwenden sind.
    # DEFAULT gilt für alle Synapse-Worker-Container. 
    tolerations: []

    # -- (list) Affinitäts-Konfiguration, die auf alle Synapse-Worker-Container anzuwenden sind.
    # DEFAULT gilt für alle Synapse-Worker-Container. 
    affinity: {}

  ## Der generische Worker kann für die meisten Endpunkte verwendet werden.
  ## Seien Sie vorsichtig, wenn Sie die Sync-Endpunkte aktivieren, da sie große Mengen an 
  ## Ressourcen verbrauchen können. Weitere Informationen finden Sie unter der obigen Informations-URL.
  ## Ein angemessener Lastausgleich mit der K8s-Ingress-Ressource ist möglicherweise nicht möglich.
  ##
  generic_worker:
    # -- (bool) Aktivieren von Workern
    enabled: true
    # -- (bool) Aktivieren des generischen Workers (kann alle Aufgaben übernehmen)
    # spezifische Aufgaben können spezifischen Workern übergeben werden
    # z.B. Media Repo
    generic: true
    # -- (map) Konfiguration für die Container-Sicherheitsrichtlinie des generischen Workers
    securityContext: 
       readOnlyRootFilesystem: true
       runAsNonRoot: true
       runAsUser: 2003
    # -- (list) entsprechende Endpunkte für den generischen Worker
    listeners: [client, federation]
    # -- (path) Client-Side(cs) Pfad für die Ingress-Konfiguration des Workers
    # @default -- werden in der values.yaml gesetzt und können dort eingesehen werden 
    csPaths:
      ## Sync requests
      # - "/_matrix/client/(r0|v3)/sync$"
      - "/_matrix/client/(api/v1|r0|v3)/events$"
      # - "/_matrix/client/(api/v1|r0|v3)/initialSync$"
      # - "/_matrix/client/(api/v1|r0|v3)/rooms/[^/]+/initialSync$"

      ## Client API requests
      - "/_matrix/client/(api/v1|r0|v3|unstable)/createRoom$"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/publicRooms$"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/rooms/.*/joined_members$"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/rooms/.*/context/"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/rooms/.*/members$"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/rooms/.*/state$"
      - "/_matrix/client/v1/rooms/.*/hierarchy$"
      - "/_matrix/client/unstable/org.matrix.msc2716/rooms/.*/batch_send$"
      - "/_matrix/client/unstable/im.nheko.summary/rooms/.*/summary$"
      - "/_matrix/client/(r0|v3|unstable)/account/3pid$"
      - "/_matrix/client/(r0|v3|unstable)/account/whoami$"
      - "/_matrix/client/(r0|v3|unstable)/devices$"
      - "/_matrix/client/versions$"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/voip/turnServer$"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/rooms/.*/event/"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/joined_rooms$"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/search$"
      
      ## Encryption requests
      - "/_matrix/client/(r0|v3|unstable)/keys/query$"
      - "/_matrix/client/(r0|v3|unstable)/keys/changes$"
      - "/_matrix/client/(r0|v3|unstable)/keys/claim$"
      - "/_matrix/client/(r0|v3|unstable)/room_keys/"
      
      ## Registration/login requests
      - "/_matrix/client/(api/v1|r0|v3|unstable)/login$"
      - "/_matrix/client/(r0|v3|unstable)/register$"
      - "/_matrix/client/v1/register/m.login.registration_token/validity$"
      
      ## Event sending requests
      - "/_matrix/client/(api/v1|r0|v3|unstable)/rooms/.*/redact"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/rooms/.*/send"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/rooms/.*/(join|invite|leave|ban|unban|kick)$"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/join/"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/profile/"
             
      ## User directory search requests
      - "/_matrix/client/(r0|v3|unstable)/user_directory/search"

      ## Worker event streams, deaktiviert!
      ## See https://matrix-org.github.io/synapse/latest/workers.html#stream-writers
      ## auskommentiert, da nicht auf generic worker sondern zum master

      ## The typing event stream
      # - "/_matrix/client/(api/v1|r0|v3|unstable)/rooms/.*/typing"
      
      ## The to_device event stream
      # - "/_matrix/client/(r0|v3|unstable)/sendToDevice/"

      ## The account_data event stream
      # - "/_matrix/client/(r0|v3|unstable)/.*/tags"
      # - "/_matrix/client/(r0|v3|unstable)/.*/account_data"
      
      ## The receipts event stream
      # - "/_matrix/client/(r0|v3|unstable)/rooms/.*/receipt"
      # - "/_matrix/client/(r0|v3|unstable)/rooms/.*/read_markers"
      
      ## The presence event stream
      # - "/_matrix/client/(api/v1|r0|v3|unstable)/presence/"

    # -- (path) Server-Side (externer Zugriff) Pfade für die Ingress-Konfiguration des Workers
    # @default -- werden in der values.yaml gesetzt und können dort eingesehen werden 
    paths:
          ## Federation requests
      - "/_matrix/federation/v1/event/"
      - "/_matrix/federation/v1/state/"
      - "/_matrix/federation/v1/state_ids/"
      - "/_matrix/federation/v1/backfill/"
      - "/_matrix/federation/v1/get_missing_events/"
      - "/_matrix/federation/v1/publicRooms"
      - "/_matrix/federation/v1/query/"
      - "/_matrix/federation/v1/make_join/"
      - "/_matrix/federation/v1/make_leave/"
      - "/_matrix/federation/(v1|v2)/send_join/"
      - "/_matrix/federation/(v1|v2)/send_leave/"
      - "/_matrix/federation/(v1|v2)/invite/"
      - "/_matrix/federation/v1/event_auth/"
      - "/_matrix/federation/v1/exchange_third_party_invite/"
      - "/_matrix/federation/v1/user/devices/"
      - "/_matrix/key/v2/query"
      - "/_matrix/federation/v1/hierarchy/"

      ## Inbound federation transaction request
      - "/_matrix/federation/v1/send/"

    # -- (int) Anzahl der Worker-Container
    # Hinweis: Wenn autoscaling.enabled=true und replicaCount geringer als autoscaling.minReplicas 
    # oder wenn nicht gesetzt, dann wird autoscaling.minReplicas übernommen
    replicaCount: 2

    ## Konfiguration für das auto-scaling der Applikation.
    autoscaling:
      # -- (bool) schalte das HPA für die Container ein
      # Hinweis: Kann für alle spezifischen Worker benutzt werden
      # Dazu muss entsprechende Konfiguration in die separaten Sektionen eingefügt werden
      enabled: true
      # -- (int) minimale Anzahl der Worker-Container
      minReplicas: 2
      # -- (int) maximale Anzahl der Worker-Container
      maxReplicas: 10
      # -- (int) Prozentsatz für CPU-Auslastung um Scaling zu triggern
      targetCPUUtilizationPercentage: 80
      # -- (int) Prozentsatz für RAM-Auslastung um Scaling zu triggern
      targetMemoryUtilizationPercentage: 80

  ## Um den allgemeinen Worker in spezifische Belange aufzuteilen - zum Beispiel den Empfang von Föderationstransaktionen;
  ## Hinweis: Diese Worker sollten eingehenden Datenverkehr basierend auf der Quell-IP routen lassen, was
  ## noch als TODO offen ist.
  ## https://github.com/matrix-org/synapse/blob/develop/docs/workers.md#load-balancing

  federation_reader:
    # -- (bool) Aktiviere spez. Worker für Förderationsanfragen
    enabled: false
    # -- (bool) Wird aus dem generischen Worker abgeleitet
    generic: true
    # -- (list) Zusätzliche Listener für Förderationsworker
    listeners: [federation]
    # -- (path) Server-Side Pfade für die Ingress-Konfiguration des Förderations-Workers
    # @default -- werden in der values.yaml gesetzt und können dort eingesehen werden 
    paths:
       - "/_matrix/federation/v1/send/"

  ## Oder /sync handling.
  ## Hinweis: Dieser Worker sollte eingehenden Datenverkehr basierend auf der Quell-IP routen lassen, was
  ## noch als TODO offen ist.
  ## https://github.com/matrix-org/synapse/blob/develop/docs/workers.md#load-balancing
  synchrotron:
    # -- (bool) Aktivierung des Synch-Workers
    enabled: false
    # -- (bool) Wird aus dem generischen Worker abgeleitet
    generic: true
    # -- (list) Zusätzliche Listener für Synchworker
    listeners: [client]
    # -- (path) Client-Side(cs) Pfade für die Ingress-Konfiguration des Synchworkers
    # @default -- werden in der values.yaml gesetzt und können dort eingesehen werden 
    csPaths:
      - "/_matrix/client/(v2_alpha|r0|v3)/sync$"
      - "/_matrix/client/(api/v1|v2_alpha|r0|v3)/events$"
      - "/_matrix/client/(api/v1|r0|v3)/initialSync$"
      - "/_matrix/client/(api/v1|r0|v3)/rooms/[^/]+/initialSync$"

  pusher:
  # -- (bool) Dieser Worker kümmert sich um die Übermittlung von Benachrichtigungen.
  # Hinweis: Es kann jeweils nur eine Instanz dieses Workers ausgeführt werden
  # WICHTIGER HINWEIS: Dafür gibt es den Sygnal-Service und Container!!!
    enabled: false

  appservice:
    # -- (bool) Dieser Worker sorgt für das Senden von Daten an registrierte Anwendungsdienste.
    # Hinweis: Es kann jeweils nur eine Instanz dieses Workers ausgeführt werden.
    enabled: false

  ## This worker handles sending federation traffic to other Synapse servers.
  ##
  federation_sender:
    # -- (bool) Dieser Worker kümmert sich um den Versand des 
    # Verbundverkehrs(Förderation Traffik) an andere Synapse-Server.
    enabled: false

  media_repository:
    # -- (bool) Aktivieren des Media-Worker
    # Dieser Worker kümmert sich um die Bereitstellung und Speicherung von Medien.
    # Hinweis: Die Ausführung mehrerer Instanzen führt zu Konflikten mit Hintergrundaufgaben.
    enabled: true
    # -- (map) Konfiguration für die Container-Sicherheitsrichtlinie des generischen Workers
    # Überschreibt die Konfiguration von Default und generischen Worker
    securityContext: 
       readOnlyRootFilesystem: true
       runAsNonRoot: true
       runAsUser: 2666
    # -- (list) Zusätzliche Listener für Media-Worker
    listeners: [media]
    # -- (path) Client-Side(cs) Pfade für die Ingress-Konfiguration des Media-Workers
    # @default -- werden in der values.yaml gesetzt und können dort eingesehen werden 
    csPaths:
      - "/_synapse/admin/v1/purge_media_cache$"
      - "/_synapse/admin/v1/room/.*/media"
      - "/_synapse/admin/v1/user/.*/media"
      - "/_synapse/admin/v1/media/"
      - "/_synapse/admin/v1/quarantine_media/"
      - "/_synapse/admin/v1/users/.*/media$"
    # -- (path) Server-Side(externe) Pfade für die Ingress-Konfiguration des Media-Workers
    # @default -- werden in der values.yaml gesetzt und können dort eingesehen werden 
    paths:
      - "/_matrix/media/"

  ## This worker deals with user directory searches.
  user_dir:
    # -- (bool) Aktivieren des Nutzersuch-Workers
    # Hinweis: Damit kann die Last vom generischen bzw. Haupt-Worker genommen werden
    enabled: true
    # -- (list) Zusätzliche Listener für NutzerSuch-Worker
    listeners: [client]
    # -- (path) Client-Side(cs) Pfade für die Ingress-Konfiguration des Nutzersuch-Workers
    # @default -- werden in der values.yaml gesetzt und können dort eingesehen werden 
    csPaths:
      - "/_matrix/client/(api/v1|r0|v3|unstable)/user_directory/search$"

  ## This worker handles key uploads, and may also stub out presence if that is
  ## disabled. If you set extraConfig.use_presence=false then you may want to
  ## uncomment the second path.
  ##
  frontend_proxy:
    # -- (bool) Aktivierung des FrontendProxy-Worker
    # Dieser Worker kümmert sich um das Hochladen von Schlüsseln, 
    # und kann auch die Anwesenheit ausblenden, wenn diese deaktiviert ist
    enabled: false
    # -- (list) Zusätzliche Listener für frontendproxy-Worker
    listeners: [client]
    # -- (path) Client-Side(cs) Pfade für die Ingress-Konfiguration des FrontendProxy-Workers
    # Hinweis: (default Bundesmessenger)
    # Wenn Sie extraConfig.use_presence=false setzen, sollten Sie den folgenden Pfad eintragen:
    # - "/_matrix/client/(api/v1|r0|v3|unstable)/presence/[^/]+/status"
    # @default -- werden in der values.yaml gesetzt und können dort eingesehen werden 
    csPaths:
      - "/_matrix/client/(api/v1|r0|v3|unstable)/keys/upload"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/presence/[^/]+/status"

persistence:
  # -- (bool) Aktivieren der Persistenz-Konfiguration für die Medien-Repository-Funktion.
  # Diese PVC wird entweder in Synapse oder einem media_repo-Worker eingehängt.
  # Hinweis: Wenn Sie in der Lage sein wollen, dies zu skalieren, müssen Sie den
  # accessMode auf RWX/ReadWriteMany setzen.
  enabled: true
  # -- (string) Name des VolumeClaims
  existingClaim: matrix-synapse
  # -- (string) Name der entsprechenden Storage-Klasse
  storageClass: nfs-client
  # -- (string) Zugriffsmodus
  accessMode: ReadWriteOnce
  # -- (string) Größe des zu nutzenden Volumes
  size: 10Gi

volumePermissions:
  # -- (bool) Aktivieren des Init-Containers zur Rechtekorrektur,
  # um die Rechte auf dem Volume für Media anzupassen
  # Notwendig für policy 'require-uid-greater-2000'
  enabled: true
  # -- (int) Nutzer-ID 
  # Notwendig für policy 'require-uid-greater-2000'
  uid: 2666
  # -- (int) Nutzer-ID 
  # Notwendig für policy 'require-uid-greater-2000'
  gid: 2666

  image:
    # -- (string) das Repository für das zu nutzende Image zur Rechtebereinigung
    repository: alpine
    # -- (string) das Tag für das zu nutzende Image zur Rechtebereinigung
    # Hinweis: alles außer latest ist hier sinnfrei
    tag: latest
    # -- (string) da latest-Tag, PullPolicy immer für das zu nutzende Image zur Rechtebereinigung
    pullPolicy: Always

  # -- (map) Ressourcen des Init-Containers zur Rechtekorrektur
  # Hier keine gesetzt, da kurzlebig und von Hause aus klein
  # Beispiel:
  # resources:
  #   requests:
  #     memory: 128Mi
  #     cpu: 100m
  resources: {}

## Konfiguration für den Hauptdienst von Synapse.
## Um TLS in Synapse selbst zu verwenden, fügen Sie einen TLS-Listener hinzu und ändern Sie die Ports
## die hier konfiguriert sind.
##
service:
  # -- (string) Typ des Auszuliefernden Endpunktes für den Hauptdienst von Synapse
  type: ClusterIP
  # -- (int) interner Port des Auszuliefernden Endpunktes für den Hauptdienst von Synapse
  port: 8008
  # -- (int) externer Port des Auszuliefernden Endpunktes für den Hauptdienst von Synapse
  targetPort: http


######################################################################################
##          Konfiguration für Sygnal
######################################################################################
#Reference: https://github.com/matrix-org/sygnal
sygnal:
  # -- (bool) Aktivieren des Sygnal-Container
  enabled: true
  # -- (map) Image/Repo-Konfiguration von Sygnal
  image:
    repository: matrixdotorg/sygnal
    tag: v0.11.0 
    pullPolicy: IfNotPresent

  # -- (map) Informationen zum Sicherheitskontext, die dem Sygnal mitgeteilt werden sollen.
  # Hinweis: hier muss der Sycall für unpriviligierter User auf priviligierter Port gesetzt sein
  # weitere Beispiele:
  #  runAsNonRoot: true
  #  fsGroup: 27
  #  runAsGroup: 2000
  #  runAsUser: 2000
  podSecurityContext:  
    runAsNonRoot: true
    runAsGroup: 2000
    runAsUser: 2000
    #    sysctls:
    #      - name: net.ipv4.ip_unprivileged_port_start
    #        value: "80"

  # -- (map) Konfiguration für die Container-Sicherheitsrichtlinie des generischen Workers
  # weitere Beispiele:
  #  capabilities:
  #    drop:
  #    - ALL
  securityContext: 
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 2111

  ## Ressource konfiguration für Sygnal server.
  ##
  resources: 
    limits:
      # -- (string) Rechenressourcengrenzen, die auf den Sygnal-Container anzuwenden sind. 
      cpu: 150m
      # -- (object) RAM Ressourcengrenzen, die auf den Sygnal-Container anzuwenden sind.
      memory: 45Mi
    requests:
      # -- (string) Anforderungen an Rechenressourcen, die auf den Sygnal-Container anzuwenden sind. 
      cpu: 150m
      # -- (string) Anforderungen an RAM Ressourcen, die auf den Sygnal-Container anzuwenden sind. 
      memory: 45Mi

  #Healthcheck
  livenessProbe:
    httpGet:
      # -- (string) Zu verwendende Konfiguration für den Pfad des Healthchecks 
      path: /health
      # -- (string) Zu verwendende Konfiguration für den Port des Healthchecks 
      port: http

  #Bereitschaftscheck
  readinessProbe:
    httpGet:
      # -- (string) Konfiguration des Pfads vom Bereitschaftscheck
      path: /health
      # -- (string) Konfiguration des Ports vom Bereitschaftscheck
      port: http

  # -- (list) Node Selektor Konfiguration für Sygnal-Container.
  nodeSelector: {}

  # -- (list) Tolerations/Tains Konfiguration für Sygnal-Container.
  tolerations: []

  # -- (list) Affinitäts-Konfiguration für Sygnal-Container.
  affinity: {}

  # -- (map) APN-Konfigurationsteil
  # Beispiel:
  # apns:
  #    de.opencode.dvs.ios:
  #      type: apns
  #      keyfile: /etc/matrix/sygnal/
  apns: {}
  
  ios_push:
  # -- (bool) IOS-Push Schalter
  # Wenn iOS Push mit genutzt wird, muss hier der Schalter dafür auf true gesetzt werden, sonst schlägt das Modul fehl
    enabled: true

  # -- (map) iOS-Key Konfiguration
  # bei Nutzung von iOS-Pushservice, muss Key mit angebeben werden. Weitereres siehe README.md
  # Beispiel: 
  #    ioskey_filename: de.opencode.dvs.ios.p8 <<-- muss zwingend mit dem Keyfile-Dateinamen aus dem APN-File übereinstimmen!
  #    ioskey_keyvalue: 'HIER KÖNNTE IHR KEY IN STEHEN'
    ioskey_filename: {}
    ioskey_keyvalue: {}


######################################################################################
##          Konfiguration für Well-Known-Server
######################################################################################
## Dies wird einen Lighttpd-Server einrichten, der auf alle
## /.well-known/matrix/server Anfragen antwortet, um den Verbund zu ermöglichen, ohne
## Hinzufügen von SRV-Einträgen zu DNS.

wellknown:
  # -- (bool) Aktivierung des Wellknown-Container
  enabled: true

  # -- (bool) Lighttpd bindet standardmäßig nicht an IPv6, obwohl dies in
  # IPv6-only-Clustern erforderlich ist.
  useIpv6: false

  server: 
    # -- (map) Die Host- und Port-Kombination, die auf .well-known/matrix/server zu bedienen ist.
   m.server: matrix.example.com:443
     
  # -- (map) Zusätzliche Daten, die unter .well-known/matrix/<data> bereitgestellt werden
  # Dictionaries werden in JSON umgewandelt, einfache Strings werden direkt ausgeliefert
  # MSC1929 Beispiel:
  # support:
  #   admins:
  #     - matrix_id: '@admin:example.com'
  #       email_address: 'admin@example.com'
  #       role: 'admin'
  #   support_page: 'https://example.com/support'
  extraData: {}

  # -- (map) Daten, die auf .well-known/matrix/client bereitgestellt werden sollen
  client:
    io.element.e2ee:
      secure_backup_required: true
      secure_backup_setup_methods: ["passphrase"]
      outbound_keys_pre_sharing_mode: "on_room_opening" 
    m.homeserver:
      base_url: https://matrix.example.com

  # -- (path) Ein benutzerdefinierter htdocs-Pfad, der nützlich ist, wenn ein anderes Image ausgeführt wird.
  htdocsPath: /var/www/localhost/htdocs

  # -- (map) Das lighttpd image
  # optional:
  # pullSecrets:
  #   - myRegistryKeySecretName
  image:
    repository: sebp/lighttpd
    tag: 1.4.61-r1
    pullPolicy: IfNotPresent


  # -- (map) Informationen zum Sicherheitskontext, die dem Arbeiter mitgeteilt werden sollen.
  # weitere Möglichkeiten:
  #  fsGroup: 2001
  #  runAsGroup: 2001
  #  runAsUser: 2001
  podSecurityContext: 
    runAsNonRoot: true

  # -- (map) Konfiguration für die Container-Sicherheitsrichtlinie
  # weitere Möglichkeiten:
  #  capabilities:
  #    drop:
  #    - ALL
  securityContext: 
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 2022

  ## Ressource Konfiguration für well-known server.
  resources: 
    limits:
      # -- (string) Rechenressourcengrenzen, die auf den well-known server anzuwenden sind. 
      cpu: 5m
      # -- (object) RAM Ressourcengrenzen, die auf den well-known server anzuwenden sind.
      memory: 15Mi
    requests:
      # -- (string) Anforderungen an Rechenressourcen, die auf den well-known server anzuwenden sind. 
      cpu: 5m
      # -- (string) Anforderungen an RAM Ressourcen, die auf den well-known server anzuwenden sind. 
      memory: 15Mi

  # -- (list) Node Selektor Konfiguration für well-known server.
  nodeSelector: {}

  # -- (list) Tolerations/Tains Konfiguration für well-known server.
  tolerations: []

  # -- (list) Affinitäts-Konfiguration für well-known server.
  affinity: {}

######################################################################################
##          Konfiguration für Postgres Server
######################################################################################
## Diese Konfiguration ist für die Einrichtung des intern bereitgestellten Postgres-Servers gedacht,
## Wenn Sie stattdessen einen vorhandenen Server verwenden wollen, sollten Sie
## enabled auf false setzen und den externalPostgresql-Block konfigurieren.
##
postgresql:
  # -- (bool) Diese Konfiguration ist für die Einrichtung des intern bereitgestellten Postgres-Servers gedacht,
  # Wenn Sie stattdessen einen vorhandenen Server verwenden wollen, sollten Sie
  # enabled auf false setzen und den externalPostgresql-Block konfigurieren.
  enabled: false

  # -- (string) Name für PostgreSQL-DB
  postgresqlDatabase: synapse_db

  # -- (string) Passwort für PostgreSQL Nutzer
  # TODO: Muss in ein Vault!
  # Oder verwenden Sie ein bestehendes Secret mit dem Schlüssel "postgresql-password"
  # anstelle eines statischen Passworts
  #  existingSecret: postgres-secrets
  #  existingSecretPasswordKey: POSTGRES_PASSWORD
  postgresqlPassword: synapse

  # -- (string) Name für PostgreSQL Nutzer
  postgresqlUsername: synapse

  # -- (string) Extra Argumente zur Initialisierung der Datenbank 
  postgresqlInitdbArgs: "--lc-collate=C --lc-ctype=C"
  
  # -- (map) Persistenzkonfiguration für Storage für PostgreSQL
  persistence:
    storageClass: nfs-client
    size: 16Gi

  # -- (list) Zusätzliche Argumente für die Datenbankverbindung
  # ref: https://github.com/matrix-org/synapse/blob/develop/docs/postgres.md#synapse-config
  extraArgs: {}

# -- (map) Ein extern konfigurierter Postgres-Server, der für die Datenbank von Synapse verwendet wird, 
# muss die Datenbank sowohl COLLATE als auch CTYPE auf "C" eingestellt haben.
# Beispiel für K8s internen Postgres im Namespace "postgres":
externalPostgresql:
  host: postgres-4-matrix-postgresql.postgres.svc.cluster.local
  port: 5432
  username: synapse
  password: synapse

  # -- (string) Der Name eines bestehenden Secrets mit Postgresql-Anmeldedaten
  existingSecret: postgres-secrets

  # -- (string) Passwortschlüssel, der aus dem bestehenden Secret abgerufen wird
  existingSecretPasswordKey: POSTGRES_PASSWORD

  # -- (string) Name der Datenbank auf die sich verbunden wird
  database: synapse_db
  
    #sslmode: prefer

  # -- (list) Zusätzliche Argumente für die Datenbankverbindung
  # ref: https://github.com/matrix-org/synapse/blob/develop/docs/postgres.md#synapse-config
  extraArgs: {}


######################################################################################
##          Konfiguration für Redis Server
######################################################################################
## Diese Konfiguration ist für den internen Redis, der für die Verwendung mit
## Worker/Sharding eingesetzt wird. Für einen externen Redis-Server setzen Sie enabled auf
## false setzen und den externalRedis-Block konfigurieren.
##
redis:
  # -- (bool) Diese Konfiguration ist für den internen Redis, der für die Verwendung mit
  # Worker/Sharding eingesetzt wird. Für einen externen Redis-Server setzen Sie enabled auf
  # false setzen und den externalRedis-Block konfigurieren.
  enabled: true
  # -- (map) Konfiguration für Authentifikation gegen Redis
  # Oder verwenden Sie ein bestehendes Geheimnis mit "redis-password"-Schlüssel
  # anstelle eines statischen Passworts.
  # Der Platzhalter wird später hart ignoriert, muss aber gesetzt und nicht leer sein dafür. 
  # Nur für mehr als 1 Instanz je K8s interessant
  # existingSecret: synapse-redis <- Was hab ich damit gemeint und was geändert
  auth:
    enabled: true
    password: synapse

  # -- (string) Form der Architektur des Deployments
  architecture: standalone
  master:
    persistence:
    # -- (bool) Persistenzkonfiration des Redis
    # Beachten Sie, dass Synapse redis nur als Synchronisierungsdienstprogramm verwendet, so dass keine
    # Daten jemals persistiert werden müssen.
      enabled: false
    service:
      # -- (int) Serviceport
      port: 6379
    statefulset:
      # -- (string) Wie soll bei Update mit dem Container verfahren werden
      # https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#update-strategies
      updateStrategy: RollingUpdate

# -- (map) Ein extern konfigurierter Redis-Server, der für Worker/Sharding verwendet wird
# Wird erst ausgewertet, wenn `redis.enabled=false` ist.
# Alternativ zum statischen Passwort:
# Der Name eines bestehenden Secret mit Redis-Anmeldeinformationen
# existingSecret: redis-secrets
# Passwortschlüssel, der aus dem bestehenden Secret abgerufen wirdq
# existingSecretPasswordKey: redis-password
externalRedis:
  host: redis
  port: 6379
  password: synapse



######################################################################################
##          Konfiguration für Ingress
######################################################################################
## Die K8s Ingress-Konfiguration wird sehr häufig verwendet, um
## das gesamte Routing einzurichten, das für die Verwendung mit einer gesplitteten Synapse-Instanz erforderlich ist.
## Wenn Sie keinen Ingress-kompatiblen K8s-Ingress verwenden, müssen Sie 
## stattdessen Ihr eigenes Routing einrichten.
##
ingress:
  # -- (bool) Aktiviert Ingress-Konfiguration
  enabled: true

  # -- (bool) Generierung von Traefik-kompatiblen Regex-Pfaden anstelle von Nginx-kompatiblen Pfaden. 
  # UNGETESTET!
  traefikPaths: false

  ## Annotations to apply to the created ingress resource.
  ##
  annotations: 
    # -- (bool) Annotiation um Regex-Regeln nutzen zu können
    nginx.ingress.kubernetes.io/use-regex: "true"
    # -- (string) Annotiation, um Body-size zu vergößern (Default Limit 1 oder 10MB)
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
  #  kubernetes.io/ingress.class: nginx
  #  kubernetes.io/tls-acme: "true"

  # -- (list) Hosts, die der Ingress-Konfiguration für die Verarbeitung von 
  # Client-to-Server-API-Anfragepfade hinzugefügt werden sollen.
  # Hinweis: config.serverName wird einbezogen, wenn includeServerName gesetzt ist. (default)
  # Beispiel:
  #  - matrix.example.com
  csHosts: []

  # -- (list) Zusätzliche Hosts, die der Ingress-Konfiguration für die Bearbeitung von
  # Server-zu-Server-API-Anfragen hinzugefügt werden sollen.
  # Hinweis: config.serverName wird einbezogen, wenn includeServerName gesetzt ist. (default)
  # Beispiel:
  #  - example.com
  hosts: []

  # -- (list) Zusätzliche Hosts, die der Ingress-Konfiguration für die Bearbeitung von
  # wellknown-Anfragen hinzugefügt werden sollen.
  # Hinweis: config.serverName wird einbezogen, wenn includeServerName gesetzt ist. (default)
  # Beispiel:
  #  - example.com
  wkHosts: []

  # -- (path) Zusätzliche Pfade, die zu den Server-zu-Server-Eingangsblöcken hinzugefügt werden sollen
  # Werden vor dem `/_matrix` Catch-all-Pfad eingefügt.
  # Beispiele:
  #  # K8s 1.19+
  #  - path: /_matrix/media
  #    pathType: Prefix
  #    backend:
  #      service:
  #        name: matrix-media-repo
  #        port: 8000
  #  # K8s <1.19
  #  - path: /_matrix/media
  #    backend:
  #      serviceName: matrix-media-repo
  #      servicePort: 8000
  paths:  []

  # -- (path) Zusätzliche Pfade, die zu den Client-zu-Server Blöcken hinzugefügt werden sollen
  # Werden vor dem `/_matrix` und `/_synapse` Catch-all-Pfade eingefügt.
  # Beispiele:
  #  # K8s 1.19+
  #  - path: /_matrix/media
  #    pathType: Prefix
  #    backend:
  #      service:
  #        name: matrix-media-repo
  #        port: 8000
  #  # K8s <1.19
  #  - path: /_matrix/media
  #    backend:
  #      serviceName: matrix-media-repo
  #      servicePort: 8000
  csPaths: [] 

  # -- (bool) Soll der `/_synapse/client`-Pfad im Ingress enthalten sein, werden die Client-APIs unter diesem Pfad bereitgestellt.
  includeUnderscoreSynapse: true

  # -- (bool) Soll der `/_synapse/admin`-Pfad im Ingress enthalten sein 
  # Hinweis: Ist `synapse_admin.enabled = true` und `adminUri` gesetzt wird über diesen Host die Admin-APIs unter diesem Pfad bereitgestellt.
  # Hinweis: Ist der Synapse-Admin deaktiviert, wird der Pfad in serverDomain/publicServerName mit in den Ingress geschrieben
  includeSynapseAdmin: true

  # -- (bool) Sollte `config.serverName` in die Liste der Eingangspfade aufgenommen werden, 
  # kann auf `false` gesetzt werden, wenn die Hauptdomäne auf irgendeine externe Weise verwaltet wird 
  includeServerName: true

  # -- (map) TLS-Konfiguration für Ingress Konfiguration
  # Beispiel:
  #  - secretName: chart-example-tls
  #    hosts:
  #      - example.com
  #      - matrix.example.com
  tls: []

  # -- (string) Legen Sie den Namen der IngressClass-Cluster-Ressource fest (optional)
  # https://kubernetes.io/docs/reference/kubernetes-api/service-resources/ingress-v1/#IngressSpec
  # HINWEIS: Wir setzen dem Nginx voraus, da wir auch die entsprechenden Annotiations setzen
  className: nginx

######################################################################################
##          Konfiguration für Content-Scanner
######################################################################################
contentscanner:
  # -- (bool) Aktivieren des Matrix-Content-Scanner
  # Mittelsmann zwischen AV und Matrix-Synapse
  enabled: true

  replicaCount: 1
  resources: 
    limits:
      # -- (string) Rechenressourcengrenzen, die auf den Contentscanner-Container anzuwenden sind. 
      cpu: 500m
      # -- (object) RAM Ressourcengrenzen, die auf den Contentscanner-Container anzuwenden sind.
      memory: 1Gi
    requests:
      # -- (string) Anforderungen an Rechenressourcen, die auf den Contentscanner-Container anzuwenden sind. 
      cpu: 300m
      # -- (string) Anforderungen an RAM Ressourcen, die auf den Contentscanner-Container anzuwenden sind. 
      memory: 500Mi


######################################################################################
##          Konfiguration für CLAMAV
######################################################################################
schadcodescanner:
  # -- (bool) Aktivieren des ClamAV-Container 
  enabled: true
  # -- (map) Konfiguration des Image/Repository
  image:
    repository: clamav/clamav
    tag: 0.104.1
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    claimName: signatures-matrix-synapse-clamav-0
  service:
  # service.port -- The port to be used by the clamav service
    port: 3310
  freshclam:
    # clamav.freshclam.mirrors -- A list of clamav mirrors to be used by the clamav service
    mirrors: database.clamav.net

  # -- (int) Anzahl der Worker-Container
  # Hinweis: Wenn autoscaling.enabled=true und replicaCount geringer als autoscaling.minReplicas
  # oder wenn nicht gesetzt, dann wird autoscaling.minReplicas übernommen
  replicaCount: 1

  ## Konfiguration für das auto-scaling der Applikation.
  autoscaling:
    # -- (bool) schalte das HPA für die Container ein
    # Hinweis: Kann für alle spezifischen Worker benutzt werden
    # Dazu muss entsprechende Konfiguration in die separaten Sektionen eingefügt werden
    enabled: true
    # -- (int) minimale Anzahl der Worker-Container
    minReplicas: 1
    # -- (int) maximale Anzahl der Worker-Container
    maxReplicas: 4
    # -- (int) Prozentsatz für CPU-Auslastung um Scaling zu triggern
    targetCPUUtilizationPercentage: 90
    # -- (int) Prozentsatz für RAM-Auslastung um Scaling zu triggern
    targetMemoryUtilizationPercentage: 80

  limits:
    # clamav.limits.fileSize -- The largest file size scanable by clamav, in MB
    fileSize: 20
    # clamav.limits.scanSize -- The largest scan size permitted in clamav, in MB
    scanSize: 100
    # clamav.limits.connectionQueueLength -- Maximum length the queue of pending connections may grow to
    connectionQueueLength: 100
    # clamav.limits.maxThreads --Maximum number of threads running at the same time.
    maxThreads: 4
    # clamav.sendBufTimeout -- This option specifies how long to wait (in milliseconds) if the send buffer is full, keep low to avoid clamd hanging
    sendBufTimeout: 500

  resources: 
    limits:
      # -- (string) Rechenressourcengrenzen, die auf den ClamAV-Container anzuwenden sind. 
      cpu: 1500m
      # -- (object) RAM Ressourcengrenzen, die auf den ClamAV-Container anzuwenden sind.
      memory: 3Gi
    requests:
      # -- (string) Anforderungen an Rechenressourcen, die auf den ClamAV-Container anzuwenden sind. 
      cpu: 300m
      # -- (string) Anforderungen an RAM Ressourcen, die auf den ClamAV-Container anzuwenden sind. 
      memory: 2Gi

######################################################################################
##          Konfiguration für CoTurn
######################################################################################
# Standard: wenn aktiviert, wird CoTurn unter dem Standard-Namensraum bereitgestellt,
# um von mehr als einer Instanz als CoTurn/STUN Server verwendet zu werden
# Wenn `coturn.enabled=true` und `coturn.existingcoturn=true` ebenfalls, 
# wird das Deployment so konfiguriert, dass er als Dienst unter dem Namespace 'coturn.default_ns'
# deployed wird 

coturn:
  # -- (bool) CoTurn als Deployment aktivieren
  # Hinweis: Nicht empfohlen!
  enabled: false
  # -- (map) TurnUris zusammenbauen lassen, aktuell deaktiviert,
  # Als Liste unter `config.turnUris` konfigurieren 
  turnUris:
    udp: 3478
    tcp: 3478
    realm: "turn.example.com"
  existingcoturn: 
    # -- (bool) Schalter um bereits existenten CoTurn im K8s-Cluster zu nutzen
    enabled: false
  # -- (string) Namespace für den CoTurn-Dienst
  default_ns: default
  # -- (map) Konfiguration für das Image vom CoTurn
  image:
    repository: coturn/coturn
    tag: docker/4.5.2-r12
    pullPolicy: IfNotPresent
  # -- (map) SecurityContext für den Container
  securityContext:
    runAsUser: 2011
    runAsGroup: 2011
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false


######################################################################################
##          Konfiguration für Synapse Admin
######################################################################################

synapse_admin:
  # -- (bool) Aktivieren des Synapse-Admin-Moduls
  enabled: true
  # -- (string) URI für die Admin GUI, zwingend notwendig
  adminUri: 
  # -- (map) Konfiguration des Image vom Modul
  image:
    repository: awesometechnologies/synapse-admin
    tag: 0.8.5
    pullPolicy: IfNotPresent

  ## Ressourcen Konfiguration für Synapse-Admin Server.
  resources: 
    limits:
      # -- (string) Rechenressourcengrenzen, die auf den Synapse-Admin Server anzuwenden sind. 
      cpu: 5m
      # -- (object) RAM Ressourcengrenzen, die auf den Synapse-Admin Server anzuwenden sind.
      memory: 15Mi
    requests:
      # -- (string) Anforderungen an Rechenressourcen, die auf den Synapse-Admin Server anzuwenden sind. 
      cpu: 5m
      # -- (string) Anforderungen an RAM Ressourcen, die auf den Synapse-Admin Server anzuwenden sind. 
      memory: 15Mi

  podSecurityContext: 
  # -- (map) Informationen zum Sicherheitskontext, die dem Sygnal mitgeteilt werden sollen.
  # Hinweis: hier muss der Sycall für unpriviligierter User auf priviligierter Port gesetzt sein
  # weitere Beispiele:
  #    runAsNonRoot: true
    sysctls:
      - name: net.ipv4.ip_unprivileged_port_start
        value: "80"
  # -- (map) Konfiguration für die Container-Sicherheitsrichtlinie des generischen Workers
  # weitere Beispiele:
  #    runAsNonRoot: true
  #    readOnlyRootFilesystem: true
  #    runAsUser: 2010
  securityContext: {}


  ## Configuration for mounting additional volumes into the application container.
  ##AKTUELL in Prüfung:
  #  extraVolumes:
  #    - name: confnginx
  #      emptyDir: {}
  #    - name: lognginx
  #      emptyDir: {}
  #    - name: runnginx
  #      emptyDir: {}
  #    - name: tmpnginx
  #      emptyDir: {}
  #  # - name: backgrounds
  #  #   persistentVolumeClaim:
  #  #     claimName: element-backgrounds
  #  extraVolumeMounts:
  #    - name: confnginx
  #      mountPath: /etc/nginx/conf.d/
  #    - name: lognginx
  #      mountPath: /var/log/nginx/
  #    - name: runnginx
  #      mountPath: /var/run/
  #    - name: tmpnginx
  #      mountPath: /var/cache/nginx/

  #Healthcheck
  livenessProbe:
    httpGet:
      # -- (string) Zu verwendende Konfiguration für den Pfad des Healthchecks 
      path: /
      # -- (string) Zu verwendende Konfiguration für den Port des Healthchecks 
      port: http

  #Bereitschaftscheck
  readinessProbe:
    httpGet:
      # -- (string) Konfiguration des Pfads vom Bereitschaftscheck
      path: /
      # -- (string) Konfiguration des Ports vom Bereitschaftscheck
      port: http


######################################################################################
##          Konfiguration für Element-WebClient
######################################################################################

webclient:
  # -- (bool) Element-Webclient im Deployment aktivieren
  enabled: false
  # -- (string) URL für den Webclient
  uri: app.example.com
  # -- (map) Konfiguration für das Image vom CoTurn
  image:
    repository: registry.opencode.de/bwi/bundesmessenger/backend/container-images/bundesmessenger-web
    tag: latest
    pullPolicy: IfNotPresent
  annotations:
       nginx.ingress.kubernetes.io/configuration-snippet: |
          add_header X-Frame-Options SAMEORIGIN;
          add_header X-Content-Type-Options nosniff;
          add_header X-XSS-Protection "1; mode=block";
          add_header Content-Security-Policy "frame-ancestors 'none'";
  # -- (map) SecurityContext für den Container
  securityContext:
    runAsUser: 2011
    runAsGroup: 2011
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false


