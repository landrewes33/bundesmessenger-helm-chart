  #   - name: tmpnginx
  #     mountPath: /var/cache/nginx/
  extraVolumeMounts: []


######################################################################################
##          Configuration for Admin-Portal
######################################################################################

adminPortal:
  # (bool) Enable the Admin-Portal module
  # For this, MAS is also required (`mas.enabled: true`).
  # Ref: ./docs/matrix-authentication-service.md
  enabled: false
  # (string) URI for the Admin-Portal, mandatory
  uri: ""
  # (string) Client ID in ulid format
  # The Client ID is used by the Admin-Portal for authentication with MAS.
  # Ref: https://github.com/ulid/spec
  clientID: "01KBJDJMZJ3K1XCHQ81T4Q17QD"
  # (bool) Enable TLS certificate verification
  TLSverify: true
  # (string) LogLevel Core component
  logLevel: "INFO"
  # (map) Configuration of the image of the Core or Backend module
  coreImage:
    registry: registry.opencode.de
    repository: bwi/bundesmessenger/backend/container-images/bumap-core
    tag: 2.3.0-jammy-production
    pullSecrets: []
    pullPolicy: IfNotPresent
  # (map) Configuration of the image of the UI module
  uiImage:
    registry: registry.opencode.de
    repository: bwi/bundesmessenger/backend/container-images/bumap-ui
    tag: 2.3.1-jammy-production
    pullSecrets: []
    pullPolicy: IfNotPresent

  auditLog:
    # (string) Log-Level of the Audit component of the Admin-Portal.
    # Possible values are "OFF" and "INFO".
    logLevel: "OFF"
    # (string) Database for the Audit component.
    database: sqlite
    sqlite:
      persistence:
        enabled: false
        # (string|null) Name of the PersistentVolumeClaim.
        # If not set, a new PVC will be created dynamically.
        # existingClaim: admin-portal
        # (string) Name of the PVC Storage-Class.
        # If "-", the default Storage-Class of the cluster will be used.
        storageClass: ""
        # (string) PVC Zugriffsmodus.
        accessMode: ReadWriteOnce
        # (string) Size of the volume to use.
        size: 1Gi

  ## Resource configuration for all Admin-Portal modules.
  resources:
    limits:
      # (string) Compute resource limits to apply to the Admin-Portal Pods container.
      cpu: 500m
      # (string) RAM resource limits to apply to the Admin-Portal Pods container.
      memory: 200Mi
    requests:
      # (string) Compute resource requests to apply to the Admin-Portal Pods container.
      cpu: 5m
      # (string) RAM resource requests to apply to the Admin-Portal Pods container.
      memory: 15Mi

  # (map) Security context information that the pod should adopt.
  podSecurityContext:
    <<: *defaultPodSecurityContext
    runAsGroup: 1001
    runAsUser: 1001

  # (map) Configuration for container security policy of the container
  securityContext:
    <<: *defaultSecurityContext

  # (list) Additional environment variables to apply to the pod
  extraEnv: []

  # (list) Additional storage areas for the admin portal deployment.
  extraVolumes: []
  # (list) Additional storage mount points for the admin portal deployment.
  extraVolumeMounts: []


