---
##
image:
  # -- (string) Repository/Image Konfiguration, für Synapse und Workernodes.
  repository: matrixdotorg/synapse

  # image.tag -- (string) kann die gesetzte Defaultversion überschreiben, wenn gesetzt.
  # @default -- wird im Charts.yaml gesetzt
  tag: ''
  # image.pullSecrets -- (map) Optional kann ein Array von imagePullSecrets angegeben werden. 
  # Secrets müssen manuell im Namensraum angelegt werden.
  # ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  # Beispiel:
  # pullSecrets: 
  #   - myRegistryKeySecretName
  # @default -- nicht gesetzt
  pullSecrets: []

  # -- (string) Pullpolicy für das konfigurierte Image
  # imagePullPolicy „Always“, wenn tag ist „latest“ (imagepullpolicy-always.yaml)
  pullPolicy: IfNotPresent

  # image.nameOverride -- (string) Überschreibt einen Teil des installierten Namens, behält aber den Releasenamen bei.
  nameOverride: ""

  # image.fullnameOverride -- (string) Überschreiben Sie den vollständigen Namen des installierten Charts.
  fullnameOverride: ""


# serverName -- (string) Der Matrix-Domänenname, der für den Domänenteil in Ihren MXIDs verwendet wird.
# @default -- Nicht gesetzt, aber Voraussetzung!
serverName: ''

# publicServerName -- (string) Der öffentliche Matrix-Servername, der für alle öffentlichen URLs 
# in der Konfiguration sowie für Client-API-Links im Ingress verwendet wird.
# @default  -- Nicht gesetzt
publicServerName: ''

## Die Quelle des von Synapse im Verbund verwendeten Signierschlüssels.
##
signingkey:
  ## Aktivieren Sie einen Kubernetes-Job, um einen Signierschlüssel zu erzeugen und zu speichern, 
  ## wenn noch keiner vorhanden ist.
  ## Wenn Sie bereits einen Matrix-Server in Ihrer Domäne betrieben haben, dann
  ## wollen Sie den alten Signierschlüssel beibehalten, entweder durch Verwendung der `existingSecret`
  ## Konfiguration, oder indem Sie den alten Schlüssel unter `extraConfig.old_signing_keys` einbinden.
  ##
  ## Wenn Sie Ihren Signierschlüssel verlieren, kann es sein, dass der Föderationsverkehr von Ihrer Instanz
  ## möglicherweise nicht mehr vom weiteren Netzwerk als vertrauenswürdig eingestuft werden.

  job:
    # -- (bool) es wird ein Job zu Beginn des Deployments gestartet, der einen Signierschlüssel erzeugt.
    # Wenn abgeschaltet, muss ein vorhandener Schlüssel eingebunden werden, ansonsten ist eine Förderation
    # als nicht vertrauenswürdig eingestuft
    enabled: true

    generateImage:
      # -- (string) Repository/Image Konfiguration für Synapse-signing-key-job. Es wird dringend 
      # empfohlen, dass die gleiche Konfiguration wie vom Synapse bzw. den Workernodes genutzt wird.
      repository: matrixdotorg/synapse
      #tag: latest
      # -- (string) PullPolicy für das Image vom Signing-Key-Job
      pullPolicy: IfNotPresent
    # -- (map) Repository/Image Konfiguration für den Upload des generierten Signing-Schlüssels. 
    # aktuelle Version am 13.06.2022 vom kubectl im bitnami-Repo
    publishImage:
      repository: bitnami/kubectl
      tag: 1.21.13-debian-11-r4
      pullPolicy: IfNotPresent

  ## Geben Sie ein bestehendes Signierschlüsselgeheimnis an, das im Voraus erstellt werden muss. 
  ##
  # existingSecret: secret-name
  # existingSecretKey: signing.key

  ## Ressourcen für das Image der Erzeugung vom Signierschlüssel
  ##
  resources: {}
  #  limits:
  #    cpu: 100m
  #    memory: 250Mi
  #  requests:
  #    cpu: 100m
  #    memory: 250Mi

## Matrix-Konfigurationswerte, die sich auf andere Teile des Charts auswirken, für jeden
## Wert, der nicht von diesem Block behandelt wird, sollten Sie ihn stattdessen in
## extraConfig unten einstellen.
## Ref: https://github.com/matrix-org/synapse/blob/develop/docs/sample_config.yaml
##
config:
  # -- (string) Die öffentlich zugängliche URL für die Synapse-Instanz 
  # lautet standardmäßig https://<publicServerName>
  # Beispiel: 
  # publicBaseurl: 'https://matrix.beispiel.org'
  publicBaseurl: ''

  # -- (string) Das Loglevel  für Synapse und alle Module.
  logLevel: INFO

  # -- (bool) Sollen Nutzungsstatistiken gemeldet werden
  reportStats: true

  ## Schützen Sie die Registrierung mit recaptcha. (optional)
  ##
  # recaptcha:
  #   publicKey: ''
  #   privateKey: ''

  # -- (list) URIs die zum Aufbau von 1:1 WebRTC Anrufe aufzubauen.
  # Beispiel:
  # turnUris: ["turn:turn.beispiel.org:3478?transport=udp"]
  turnUris: []
  # -- (string) geheime Schlüssel für TURN-Server
  # turnSecret: ''

  # -- (bool) Registrierungskonfiguration, beachten Sie, dass die Registrierung mit dem
  # containerinternen Werkzeug register_new_matrix_user immer möglich ist.
  # @default -- true
  enableRegistration: true

  # -- (string) Hinweis: Dieser Wert wird standardmäßig auf eine zufällige Zeichenfolge gesetzt, wenn er nicht angegeben wird.
  registrationSharedSecret: ''

  # -- (string) Hinweis: Es wird dringend empfohlen, diesen Wert auf einen secure value (secret) zu setzen.
  macaroonSecretKey: ''

  # -- (map) Eine Gruppe von vertrauenswürdigen Servern, die zu kontaktieren sind, wenn ein anderer Server nicht auf eine
  # Signierschlüssel-Anfrage antwortet.
  trustedKeyServers:
    - server_name: matrix.org
  #   verify_keys:
  #     "ed25519:auto": "Noi6WqcDj0QmPxCNQqgezwTlBKrfqehY1u2FyWP9uYw"

  # -- (list) Extra listener 
  extraListeners: []
  #  - port: 9000
  #    bind_addresses: ['::']
  #    type: manhole

# -- (object) Best Practise BWI GmbH:
# Ref: https://github.com/matrix-org/synapse/blob/develop/docs/sample_config.yaml
# @default -- wird nachfolgend aufgeschlüsselt
extraConfig: 
#  old_signing_keys:
#    "ed25519:id": { key: "base64string", expired_ts: 123456789123 } 
  # -- (bool) Authentifizierung notwendig für User-Suche
  require_auth_for_profile_requests: true
  # -- (bool) Limitiere Requests für Nutzer mit shared rooms, abgeschaltet
  limit_profile_requests_to_users_who_share_rooms: false
  # -- (bool) Übersenden von Profildaten, wenn Chat gestartet wird
  include_profile_data_on_invite: true
  # -- (bool) Öffentliche Räume ohne Login/Authentifizierung, abgeschaltet!
  allow_public_rooms_without_auth: false
  # -- (bool) öffentliche Räume über Förderation erlauben, abgeschaltet 
  allow_public_rooms_over_federation: false
  # -- (bool) Einladung die von unpriviligierten Nutzern stammen blocken, abgeschaltet
  block_non_admin_invites: false
  # -- (list) IP-Whitelist für Förderation zwingend benötigt
  ip_range_whitelist: []
  presence: 
  # -- (bool) Anwesenheitstatus anzeigen, abgeschaltet (Load)
      enabled: false
  # -- (bool) Nutzersuche zulassen, eingeschaltet
  enable_search: true
  user_directory:
  # -- (bool) Nutzerverzeichnis erstellen, eingeschaltet (Vraussetzung für Nutzersuche)
      enabled: true
  # -- (bool) Suche alle Nutzer, eingeschaltet
      search_all_users: true
  # -- (bool) Alias nur für registrierte Nutzer (sowieso, nicht authentifizierte Nutzer sind abgeschaltet)
  require_membership_for_aliases: true
  # -- (string) Maximale Speicherzeit für IPs von Nutzern (Whitelist mapping)
  user_ips_max_age: 28d
  retention:
  # -- (bool) Nachrichtenaufbewahrungsrichtlinien einschalten (auf Raumebene)
      enabled: false
  # -- (bool) URL-Vorschau, abgeschaltet
  url_preview_enabled: false
  oembed:
  # -- (bool) eingebettete URL-Darstellung von Drittanbietern
      disable_default_providers: true
  # -- (bool) thirdParty Identifier lookup (3pid), abgeschaltet
  enable_3pid_lookup: false
  # -- (bool) Gastzugang, abgeschaltet
  allow_guest_access: false
  # -- (bool) Nutzungsstatistiken, eingeschaltet
  enable_metrics: true
  # -- (bool) Übermitteln von Nutzungsstatistiken (werden abgeholt nicht übermittelt)
  report_stats: false
  # -- (object) Passwortkonfiguration
  # @default -- folgende Aufschlüsselung
  password_config:
  # -- (bool) Passwortkonfiguration selbst definieren, eingeschaltet
      enabled: true
  # -- (bool) lokale Nutzerdatenbank, eingeschaltet
      localdb_enabled: true
      policy:
  # -- (bool) Passwortpolicy nutzen, eingeschaltet
          enabled: true
  # -- (int) Passwortmindestlänge in Zeichen
          minimum_length: 8
  # -- (bool) Zahl muss mit genutzt werden
          require_digit: true
  # -- (bool) Sonderzeichen muss genutzt werden
          require_symbol: true
  # -- (bool) Kleinbuchstaben muss genutzt werden
          require_lowercase: true
  # -- (bool) Großbuchstaben muss genutz werden
          require_uppercase: true
  ui_auth:
  # -- (string) User-Interactive Authentication API timeout 
      session_timeout: "15s"    
  push:
  # -- (bool) Push Modul verschickt Inhalt der Nachricht über Google-/Apple-Push-Services, abgeschaltet
      include_content: false
  # -- (string) Verschlüsselung der Räume (default Einstellung, eingeschaltet
  encryption_enabled_by_default_for_room_type: all
  stats:
  # -- (bool) Schalte Nutzerstatistiken ein, eingeschaltet
      enabled: true
  # -- (bool) Raumsuche, eingeschaltet
  enable_room_list_search: true 
  opentracing:
  # -- (bool) OpenTracing ist ein Werkzeug, das einen Einblick 
  # in den kausalen Zusammenhang der Arbeit in und zwischen Servern gibt. 
  # Die einzelnen Server verfolgen Ereignisse und melden 
  # sie an einen zentralen Server - im Fall von Synapse: Jaeger.
      enabled: false
  # -- (list) TODO
#  federation_domain_whitelist:
#    - poc1.dvs.beispiel.org
#    - poc2.dvs.beispiel.org
#    - poc3.dvs.beispiel.org
#  dynamic_thumbnails: true

# -- (object) Geben Sie hier eine beliebige - geheime - Synapse-Konfiguration an;
# Diese Werte werden in Secrets anstelle von Configmaps gespeichert
# Ref: https://github.com/matrix-org/synapse/blob/develop/docs/sample_config.yaml
extraSecrets: {}
#  password_config:
#    pepper: ''

# -- (object) Konfiguration, die auf den Haupt-Synapse-Pod anzuwenden ist.
# @default -- wird nachfolgend einzeln aufgeschlüsselt
synapse:
  strategy:
  # -- (string) Nur wirklich anwendbar, wenn das Deployment ein RWO PV angehängt hat (z.B. wenn Media Repository
  # für den Haupt-Synapse-Pod aktiviert ist)
  # Da Replikate = 1 sind, kann eine Aktualisierung "hängen bleiben", da der vorherige Pod mit dem
  # PV verbunden bleibt und der "neu-aufgebaute" Pod nie starten kann. Das Ändern der Strategie auf "Recreate" wird
  # den einzelnen vorherigen Pod beenden, so dass der neue, ankommende Pod sich mit dem PV verbinden kann
    type: RollingUpdate

  # -- (map) Annotations, die auf den Haupt-Synapse-Pod anzuwenden sind.
  # Beispiel: (Bundesmessenger lässt alle Services automatisch an Prometheus anbinden)
  #  prometheus.io/scrape: "true"
  #  prometheus.io/path: "/_synapse/metrics"
  #  prometheus.io/port: "9090"
  annotations: {} 

  # -- (map) Labels, die auf den Haupt-Synapse-Pod anzuwenden sind.
  labels: {}

  # -- (map) Zusätzliche Umgebungsvariablen, die auf den Haupt-Synapse-pod anzuwenden sind
  # Beispiel:
  #  - name: LD_PRELOAD
  #    value: /usr/lib/x86_64-linux-gnu/libjemalloc.so.2
  #  - name: SYNAPSE_CACHE_FACTOR
  #    value: "2"
  extraEnv: []

  # -- (object) Zusätzliche in Synapse zu mountende Datenträger (Volumes)
  # Beispiel:
  #  - name: spamcheck
  #    flexVolume:
  #      driver: dvs/git-live
  #      options:
  #        repo: https://gitlab.opencode.de/bwi/bundesmessenger/synapse-module
  #        interval: 1d
  #      readOnly: true
  extraVolumes: []

  # -- (object) Zusätzliche in Synapse zu mountende Datenträgerpfade (Volumes)
  # Beispiel:
  #  - name: spamcheck
  #    mountPath: /usr/local/lib/python3.7/site-packages/company
  extraVolumeMounts: []

  # -- (list) Zusätzliche Befehle, die beim Starten von Synapse ausgeführt werden
  # Beispiele:
  # - 'apt-get update -yqq && apt-get install patch -yqq'
  # - 'patch -d/usr/local/lib/python3.7/site-packages/synapse -p2 < /synapse/patches/something.patch'
  extraCommands: []

  # -- (object) Konfiguration für die Pod-Sicherheitsrichtlinie, Synapse wird immer als
  # sein eigener Benutzer ausgeführt, auch wenn dies nicht eingestellt ist. 
  # Beachten Sie, dass eine Änderung dieser Einstellung auch die Verwendung der volumePermission
  # Hilfsprogramm verwenden müssen, abhängig von Ihrem Speicher.
  podSecurityContext:
    runAsNonRoot: true
  #  fsGroup: 2666
  #  runAsGroup: 2666
  #  runAsUser: 2666

  # -- (map) Konfiguration für die Container-Sicherheitsrichtlinie, siehe oben
  # podSecurityContext für weitere relevante Informationen.
  securityContext: 
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 2666
  #  capabilities:
  #    drop:
  #    - ALL

  #Begrenzungen und Anforderungen für CPU-Ressourcen werden in CPU-Einheiten gemessen. 
  #In Kubernetes entspricht eine CPU-Einheit einem physischen CPU-Kern oder einem virtuellen Kern, 
  #je nachdem, ob es sich bei dem Knoten um einen physischen Host oder eine virtuelle Maschine handelt, 
  #die innerhalb einer physischen Maschine ausgeführt wird.
  #
  #Bruchteilige Anforderungen sind zulässig. 
  #Wenn Sie einen Container definieren und spec.containers[].resources.requests.cpu auf 0,5 setzen, 
  #fordern Sie nur halb so viel CPU-Zeit an, als wenn Sie 1,0 CPU anfordern würden. 
  #Für CPU-Ressourceneinheiten entspricht der Mengenausdruck 0,1 dem Ausdruck 100m, 
  #was als "einhundert Millicpu" gelesen werden kann. 
  #Manche Leute sagen "einhundert Millicores", und das bedeutet dasselbe.
  resources: 
    limits:
      # -- (string) Rechenressourcengrenzen, die auf den Haupt-Synapse-Pod anzuwenden sind. 
      cpu: 1000m
      # -- (object) RAM Ressourcengrenzen, die auf den Haupt-Synapse-Pod anzuwenden sind.
      memory: 2500Mi
    requests:
      # -- (string) Anforderungen an Rechenressourcen, die auf den Haupt-Synapse-Pod anzuwenden sind. 
      cpu: 1000m
      # -- (string) Anforderungen an RAM Ressourcen, die auf den Haupt-Synapse-Pod anzuwenden sind. 
      memory: 2500Mi

  #Healthcheck
  livenessProbe:
    httpGet:
      # -- (string) Zu verwendende Konfiguration für den Pfad des Healthchecks 
      path: /health
      # -- (string) Zu verwendende Konfiguration für den Port des Healthchecks 
      port: http

  #Bereitschaftscheck
  readinessProbe:
    httpGet:
      # -- (string) Konfiguration des Pfads vom Bereitschaftscheck
      path: /health
      # -- (string) Konfiguration des Ports vom Bereitschaftscheck
      port: http

  # -- (list) Node Selektoren, die für den Haupt-Synapse-Pod festgelegt werden.
  nodeSelector: {}

#Die folgenden Taints sind eingebaut:
#    node.kubernetes.io/not-ready
#       Der Knoten ist nicht bereit. Dies entspricht dem Attribut NodeCondition Ready auf "False" gesetzt.
#    node.kubernetes.io/unreachable
#       Der Knoten ist vom Node Controller nicht erreichbar. 
#       Dies entspricht dem Attribut NodeCondition Ready auf "Unknown" gesetzt.
#    node.kubernetes.io/memory-pressure
#       Der Knoten hat Speicherbesonderheiten mit hohen Lasten auf den RAM
#    node.kubernetes.io/disk-pressure
#       Der Knoten hat IO-Last auf die Festplatte. 
#       Im Falle einer hohen Festplattenauslastung auf den Knoten kann dies zu einer 
#       Verlangsamung der Anwendung führen, so dass es besser ist, die Pods zu verlagern.
#    node.kubernetes.io/pid-pressure
#       Ein Knoten hat Prozess-Last(PID-Druck). 
#       Die Prozess-ID ist eine begrenzte Ressource und ihre Sättigung 
#       kann zu einer Verlangsamung der Anwendungen führen, so dass es besser ist, 
#       Pods an einen anderen Ort zu verlagern.
#    node.kubernetes.io/network-unavailable
#       Das Netzwerk des Knotens ist nicht verfügbar. Wie oben erklärt.
#    node.kubernetes.io/unschedulable
#       Der Knoten ist nicht planbar. 
#       Jeder andere Grund, der dazu führt, dass der Knoten für das Hosting von Pods ungeeignet ist, 
#       z. B. wenn der Cluster verkleinert und der Knoten entfernt wird.

  # -- (list) Tolerations bzw. Taints die für den Haupt-Synapse-Pod genutzt werden sollen.
  tolerations: []

  # -- Affinität zur Wahl von Nodes für die für den Haupt-Synapse-Pod genutzt werden sollen.
  affinity: {}

## Konfiguration für die Handhabung von Synapse-Arbeitern(im Folgenden weiter Worker), 
## die nützlich sind für die Handhabung von Hochlast-Einsätzen bzw. Hochverfügbarkeitseinsätzen.
##
## Weitere Informationen finden Sie unter
## https://github.com/matrix-org/synapse/blob/master/docs/workers.md
##
workers:
  # -- (map) Annotations, die auf die Synapse-Worker-Pods anzuwenden sind.
  # Standardkonfiguration, diese wird an alle Worker vererbt und kann auch
  # für jeden Workertyp überschrieben werden.
  # Beispiel: (Bundesmessenger lässt alle Services automatisch an Prometheus anbinden)
  #  prometheus.io/scrape: "true"
  #  prometheus.io/path: "/_synapse/metrics"
  #  prometheus.io/port: "9090"
  annotations: {}
  
  default:
    # -- (int) DEFAULT Die Anzahl der Worker-Replikate. 
    # Beachten Sie, dass einige Worker eine besondere Behandlung erfordern. 
    # Siehe dazu die Informations-URL https://github.com/matrix-org/synapse/blob/master/docs/workers.md
    replicaCount: 1

    ## Update strategy - only really applicable for deployments with RWO PVs attached (e.g. media repository)
    ## If replicas = 1, an update can get "stuck", as the previous pod remains attached to the
    ## PV, and the "incoming" pod can never start. Changing the strategy to "Recreate" will
    ## terminate the single previous pod, so that the new, incoming pod can attach to the PV
    ##
    strategy:
      # -- (string) DEFAULT gilt für alle Synapse-Worker-Pods
      # Nur wirklich anwendbar, wenn das Deployment ein RWO PV angehängt hat (z.B. Media Repository)
      # Da Replikate = 1 sind, kann eine Aktualisierung "hängen bleiben", da der vorherige Pod mit dem
      # PV verbunden bleibt und der "neu-aufgebaute" Pod nie starten kann. Das Ändern der Strategie auf "Recreate" wird
      # den einzelnen vorherigen Pod beenden, so dass der neue, ankommende Pod sich mit dem PV verbinden kann
      type: RollingUpdate

    # -- (string)  Ein spezifischer Name für diesen Worker, kann nicht global gesetzt werden.
    # Beachten Sie, dass dies nur gesetzt werden kann, wenn replicaCount 1 ist. 
    # (wird in den Worker überschrieben, ist hier nur aus historischen Gründen noch enthalten)
    #name:

    ## Zusätzliche Konfiguration für die Worker, kann nicht global gesetzt werden.
    #extraConfig: {}

    # -- (map) DEFAULT Annotations, die auf alle Synapse-Worker-Pods anzuwenden sind.
    # Beispiel: (Bundesmessenger lässt alle Services automatisch an Prometheus anbinden)
    #  prometheus.io/scrape: "true"
    #  prometheus.io/path: "/_synapse/metrics"
    #  prometheus.io/port: "9090"
    annotations: {}

    # -- (object) DEFAULT Zusätzliche Umgebungsvariablen, die auf alle Synapse-Worker-Pods anzuwenden sind
    # Beispiel:
    #  - name: LD_PRELOAD
    #    value: /usr/lib/x86_64-linux-gnu/libjemalloc.so.2
    #  - name: SYNAPSE_CACHE_FACTOR
    #    value: "1.0"
    extraEnv: []

    # -- (map) Zusätzliche Volumes, die dem Worker hinzugefügt werden sollen.
    # DEFAULT gilt für alle Synapse-Worker-Pods.
    # Nützlich für das Medien-Repo oder zum Hinzufügen von Python-Modulen.
    # Daher besser im entsprechenden Konfigurationsteil der spez. Worker
    volumes: []

    # -- (map) Zusätzliche zu mountende Datenträgerpfade (siehe volumes)
    # DEFAULT gilt für alle Synapse-Worker-Pods.
    volumeMounts: []

    # -- (list) Zusätzliche Befehle, die beim Starten von Synapse ausgeführt werden
    # DEFAULT gilt für alle Synapse-Worker-Pods.
    # Beispiele:
    # - 'apt-get update -yqq && apt-get install patch -yqq'
    # - 'patch -d/usr/local/lib/python3.7/site-packages/synapse -p2 < /synapse/patches/something.patch'
    extraCommands: []

    # -- (map) Informationen zum Sicherheitskontext, die dem Arbeiter mitgeteilt werden sollen.
    # DEFAULT gilt für alle Synapse-Worker-Pods.
    # Beispiele:
    #   fsGroup: 2003
    #   runAsGroup: 2003
    #   runAsUser: 2003
    podSecurityContext: {} 

    # -- (map) Konfiguration für die Container-Sicherheitsrichtlinie
    # DEFAULT gilt für alle Synapse-Worker-Pods.
    # Beispiele:
    #   readOnlyRootFilesystem: true
    #   runAsNonRoot: true
    #   runAsUser: 2003
    #   capabilities:
    #     drop:
    #       - ALL
    securityContext: {}

    resources: 
       limits:
         # -- (string) Rechenressourcengrenzen, die auf alle Synapse-Worker-Pod anzuwenden sind. 
         # DEFAULT gilt für alle Synapse-Worker-Pods. 
         # Epmfohlen gesondert zu verwalten
         cpu: 100m
         # -- (object) RAM Ressourcengrenzen, die auf alle Synapse-Worker-Pod anzuwenden sind.
         # DEFAULT gilt für alle Synapse-Worker-Pods. 
         # Epmfohlen gesondert zu verwalten
         memory: 128Mi
       requests:
         # -- (string) Anforderungen an Rechenressourcen, die auf alle Synapse-Worker-Pod anzuwenden sind. 
         # DEFAULT gilt für alle Synapse-Worker-Pods. 
         # Epmfohlen gesondert zu verwalten
         cpu: 100m
         # -- (string) Anforderungen an RAM Ressourcen, die auf alle Synapse-Worker-Pod anzuwenden sind. 
         # DEFAULT gilt für alle Synapse-Worker-Pods. 
         # Epmfohlen gesondert zu verwalten
         memory: 128Mi
  
    #Healthcheck
    livenessProbe:
      httpGet:
        # -- (string) Zu verwendende Konfiguration für den Pfad des Healthchecks 
        # DEFAULT gilt für alle Synapse-Worker-Pods. 
        path: /health
        # -- (string) Zu verwendende Konfiguration für den Port des Healthchecks 
        # DEFAULT gilt für alle Synapse-Worker-Pods. 
        port: listener

    #Bereitschaftscheck
    readinessProbe:
      httpGet:
        # -- (string) Konfiguration des Pfads vom Bereitschaftscheck
        # DEFAULT gilt für alle Synapse-Worker-Pods. 
        path: /health
        # -- (string) Konfiguration des Ports vom Bereitschaftscheck
        # DEFAULT gilt für alle Synapse-Worker-Pods. 
        port: listener

    # -- (list) Node Selektor Konfiguration, die auf alle Synapse-Worker-Pod anzuwenden sind.
    # DEFAULT gilt für alle Synapse-Worker-Pods. 
    nodeSelector: {}

    # -- (list) Tolerations/Tains Konfiguration, die auf alle Synapse-Worker-Pod anzuwenden sind.
    # DEFAULT gilt für alle Synapse-Worker-Pods. 
    tolerations: []

    # -- (list) Affinitäts-Konfiguration, die auf alle Synapse-Worker-Pod anzuwenden sind.
    # DEFAULT gilt für alle Synapse-Worker-Pods. 
    affinity: {}

  ## Der generische Worker kann für die meisten Endpunkte verwendet werden.
  ## Seien Sie vorsichtig, wenn Sie die Sync-Endpunkte aktivieren, da sie große Mengen an 
  ## Ressourcen verbrauchen können. Weitere Informationen finden Sie unter der obigen Informations-URL.
  ## Ein angemessener Lastausgleich mit der K8s-Ingress-Ressource ist möglicherweise nicht möglich.
  ##
  generic_worker:
    # -- (bool) Aktivieren von Workern
    enabled: true
    # -- (bool) Aktivieren des generischen Workers (kann alle Aufgaben übernehmen)
    # spezifische Aufgaben können spezifischen Workern übergeben werden
    # z.B. Media Repo
    generic: true
    # -- (map) Konfiguration für die Container-Sicherheitsrichtlinie des generischen Workers
    securityContext: 
       readOnlyRootFilesystem: true
       runAsNonRoot: true
       runAsUser: 2003
    # -- (list) entsprechende Endpunkte für den generischen Worker
    listeners: [client, federation]
    # -- (path) Client-Side(cs) Pfad für die Ingress-Konfiguration des Workers
    # auskommentiert:
    # - "/_matrix/client/(v2_alpha|r0|v3)/sync"
    # - "/_matrix/client/(api/v1|r0|v3)/initialSync"
    # - "/_matrix/client/(api/v1|r0|v3)/rooms/[^/]+/initialSync"
    # @default -- werden in der value.yaml gesetzt und können dort eingesehen werden 
    csPaths:
      - "/_matrix/client/(api/v1|v2_alpha|r0|v3)/events"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/publicRooms"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/rooms/.*/joined_members"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/rooms/.*/context/.*"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/rooms/.*/members"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/rooms/.*/state"
      - "/_matrix/client/unstable/org.matrix.msc2946/rooms/.*/spaces"
      - "/_matrix/client/unstable/org.matrix.msc2946/rooms/.*/hierarchy"
      - "/_matrix/client/unstable/im.nheko.summary/rooms/.*/summary"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/account/3pid"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/keys/query"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/keys/changes"
      - "/_matrix/client/versions"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/voip/turnServer"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/joined_groups"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/publicised_groups"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/login"
      - "/_matrix/client/(r0|v3|unstable)/register"
      - "/_matrix/client/(r0|v3|unstable)/auth/.*/fallback/web"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/rooms/.*/send"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/rooms/.*/(join|invite|leave|ban|unban|kick)"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/join/"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/profile/"
    # -- (path) Server-Side (externer Zugriff) Pfade für die Ingress-Konfiguration des Workers
    # @default -- werden in der value.yaml gesetzt und können dort eingesehen werden 
    paths:
      - "/_matrix/federation/v1/event/"
      - "/_matrix/federation/v1/state/"
      - "/_matrix/federation/v1/state_ids/"
      - "/_matrix/federation/v1/backfill/"
      - "/_matrix/federation/v1/get_missing_events/"
      - "/_matrix/federation/v1/publicRooms"
      - "/_matrix/federation/v1/query/"
      - "/_matrix/federation/v1/make_join/"
      - "/_matrix/federation/v1/make_leave/"
      - "/_matrix/federation/v1/send_join/"
      - "/_matrix/federation/v2/send_join/"
      - "/_matrix/federation/v1/send_leave/"
      - "/_matrix/federation/v2/send_leave/"
      - "/_matrix/federation/v1/invite/"
      - "/_matrix/federation/v2/invite/"
      - "/_matrix/federation/v1/query_auth/"
      - "/_matrix/federation/v1/event_auth/"
      - "/_matrix/federation/v1/exchange_third_party_invite/"
      - "/_matrix/federation/v1/user/devices/"
      - "/_matrix/federation/v1/send/"
      - "/_matrix/federation/v1/get_groups_publicised"
      - "/_matrix/key/v2/query"

    # -- (int) Anzahl der Worker-Pods
    replicaCount: 2
    
    ## Konfiguration für das auto-scaling der Applikation.
    autoscaling:
      # -- (bool) schalte das HPA für die Pods ein
      enabled: true
      # -- (int) minimale Anzahl der Worker-Pods
      minReplicas: 2
      # -- (int) maximale Anzahl der Worker-Pods
      maxReplicas: 10
      # -- (int) Prozentsatz für CPU-Auslastung um Scaling zu triggern
      targetCPUUtilizationPercentage: 80
      # -- (int) Prozentsatz für RAM-Auslastung um Scaling zu triggern
      targetMemoryUtilizationPercentage: 80

  ## Um den allgemeinen Worker in spezifische Belange aufzuteilen - zum Beispiel den Empfang von Föderationstransaktionen;
  ## Hinweis: Dieser Worker sollte eingehenden Datenverkehr basierend auf der Quell-IP routen lassen, was
  ## noch als TODO offen ist.
  ## https://github.com/matrix-org/synapse/blob/develop/docs/workers.md#load-balancing

    federation_reader:
    # -- (bool) Aktiviere spez. Worker für Förderationsanfragen
    enabled: false
    # -- (bool) Wird aus dem generischen Worker abgeleitet
    generic: true
    # -- (list) Zusätzliche Listener für Förderationsworker
    listeners: [federation]
    # -- (path) Server-Side Pfade für die Ingress-Konfiguration des Förderations-Workers
    # @default -- werden in der value.yaml gesetzt und können dort eingesehen werden 
    paths:
       - "/_matrix/federation/v1/send/"

  ## Oder /sync handling.
  ## Hinweis: Dieser Worker sollte eingehenden Datenverkehr basierend auf der Quell-IP routen lassen, was
  ## noch als TODO offen ist.
  ## https://github.com/matrix-org/synapse/blob/develop/docs/workers.md#load-balancing
  synchrotron:
    # -- (bool) Aktivierung des Synch-Workers
    enabled: false
    # -- (bool) Wird aus dem generischen Worker abgeleitet
    generic: true
    # -- (list) Zusätzliche Listener für Synchworker
    listeners: [client]
    # -- (path) Client-Side(cs) Pfade für die Ingress-Konfiguration des Synchworkers
    # @default -- werden in der value.yaml gesetzt und können dort eingesehen werden 
    csPaths:
      - "/_matrix/client/(v2_alpha|r0|v3)/sync"
      - "/_matrix/client/(api/v1|v2_alpha|r0|v3)/events"
      - "/_matrix/client/(api/v1|r0|v3)/initialSync"
      - "/_matrix/client/(api/v1|r0|v3)/rooms/[^/]+/initialSync"

  pusher:
  # -- (bool) Dieser Worker kümmert sich um die Übermittlung von Benachrichtigungen.
  # Hinweis: Es kann jeweils nur eine Instanz dieses Workers ausgeführt werden
  # WICHTIGER HINWEIS: Dafür gibt es den Sygnal-Service und Pod!!!
    enabled: false

  appservice:
    # -- (bool) Dieser Worker sorgt für das Senden von Daten an registrierte Anwendungsdienste.
    # Hinweis: Es kann jeweils nur eine Instanz dieses Workers ausgeführt werden.
    enabled: false

  ## This worker handles sending federation traffic to other Synapse servers.
  ##
  federation_sender:
    # -- (bool) Dieser Worker kümmert sich um den Versand des 
    # Verbundverkehrs(Förderation Traffik) an andere Synapse-Server.
    enabled: false

  media_repository:
    # -- (bool) Aktivieren des Media-Worker
    # Dieser Worker kümmert sich um die Bereitstellung und Speicherung von Medien.
    # Hinweis: Die Ausführung mehrerer Instanzen führt zu Konflikten mit Hintergrundaufgaben.
    enabled: true
    # -- (map) Konfiguration für die Container-Sicherheitsrichtlinie des generischen Workers
    # Überschreibt die Konfiguration von Default und generischen Worker
    securityContext: 
       readOnlyRootFilesystem: true
       runAsNonRoot: true
       runAsUser: 2666
    # -- (list) Zusätzliche Listener für Media-Worker
    listeners: [media]
    # -- (path) Client-Side(cs) Pfade für die Ingress-Konfiguration des Media-Workers
    # @default -- werden in der value.yaml gesetzt und können dort eingesehen werden 
    csPaths:
      - "/_matrix/media/"
      - "/_synapse/admin/v1/purge_media_cache"
      - "/_synapse/admin/v1/room/.*/media.*"
      - "/_synapse/admin/v1/user/.*/media.*"
      - "/_synapse/admin/v1/media/.*"
      - "/_synapse/admin/v1/quarantine_media/.*"
      - "/_synapse/admin/v1/users/.*/media"
    # -- (path) Server-Side(externe) Pfade für die Ingress-Konfiguration des Media-Workers
    # @default -- werden in der value.yaml gesetzt und können dort eingesehen werden 
    paths:
      - "/_matrix/media/"

  ## This worker deals with user directory searches.
  user_dir:
    # -- (bool) Aktivieren des Nutzersuch-Workers
    # Hinweis: Damit kann die Last vom generischen bzw. Haupt-Worker genommen werden
    enabled: true
    # -- (list) Zusätzliche Listener für NutzerSuch-Worker
    listeners: [client]
    # -- (path) Client-Side(cs) Pfade für die Ingress-Konfiguration des Nutzersuch-Workers
    # @default -- werden in der value.yaml gesetzt und können dort eingesehen werden 
    csPaths:
      - "/_matrix/client/(api/v1|r0|v3|unstable)/user_directory/search"

  ## This worker handles key uploads, and may also stub out presence if that is
  ## disabled. If you set extraConfig.use_presence=false then you may want to
  ## uncomment the second path.
  ##
  frontend_proxy:
    # -- (bool) Aktivierung des FrontendProxy-Worker
    # Dieser Worker kümmert sich um das Hochladen von Schlüsseln, 
    # und kann auch die Anwesenheit ausblenden, wenn diese deaktiviert ist
    enabled: false
    # -- (list) Zusätzliche Listener für frontendproxy-Worker
    listeners: [client]
    # -- (path) Client-Side(cs) Pfade für die Ingress-Konfiguration des FrontendProxy-Workers
    # Hinweis: (default Bundesmessenger)
    # Wenn Sie extraConfig.use_presence=false setzen, sollten Sie den folgenden Pfad eintragen:
    # - "/_matrix/client/(api/v1|r0|v3|unstable)/presence/[^/]+/status"
    # @default -- werden in der value.yaml gesetzt und können dort eingesehen werden 
    csPaths:
      - "/_matrix/client/(api/v1|r0|v3|unstable)/keys/upload"
      - "/_matrix/client/(api/v1|r0|v3|unstable)/presence/[^/]+/status"

persistence:
  # -- (bool) Aktivieren der Persistenz-Konfiguration für die Medien-Repository-Funktion.
  # Diese PVC wird entweder in Synapse oder einem media_repo-Worker eingehängt.
  # Hinweis: Wenn Sie in der Lage sein wollen, dies zu skalieren, müssen Sie den
  # accessMode auf RWX/ReadWriteMany setzen.
  enabled: true
  # -- (string) Name des VolumeClaims
  existingClaim: matrix-synapse
  # -- (string) Name der entsprechenden Storage-Klasse
  storageClass: nfs-client
  # -- (string) Zugriffsmodus
  accessMode: ReadWriteOnce
  # -- (string) Größe des zu nutzenden Volumes
  size: 10Gi

## Set up an init container to chown the mounted media if necessary.
##
volumePermissions:
  # -- (bool) Aktivieren des Init-Containers zur Rechtekorrektur,
  # um die Rechte auf dem Volume für Media anzupassen
  # Notwendig für policy 'require-uid-greater-2000'
  enabled: true
  # -- (int) Nutzer-ID 
  # Notwendig für policy 'require-uid-greater-2000'
  uid: 2666
  # -- (int) Nutzer-ID 
  # Notwendig für policy 'require-uid-greater-2000'
  gid: 2666

  image:
    # -- (string) das Repository für das zu nutzende Image zur Rechtebereinigung
    repository: alpine
    # -- (string) das Tag für das zu nutzende Image zur Rechtebereinigung
    # Hinweis: alles außer latest ist hier sinnfrei
    tag: latest
    # -- (string) da latest-Tag, PullPolicy immer für das zu nutzende Image zur Rechtebereinigung
    pullPolicy: Always

  # -- (map) Ressourcen des Init-Containers zur Rechtekorrektur
  # Hier keine gesetzt, da kurzlebig und von Hause aus klein
  # Beispiel:
  # resources:
  #   requests:
  #     memory: 128Mi
  #     cpu: 100m
  resources: {}

## Konfiguration für den Hauptdienst von Synapse.
## Um TLS in Synapse selbst zu verwenden, fügen Sie einen TLS-Listener hinzu und ändern Sie die Ports
## die hier konfiguriert sind.
##
service:
  # -- (string) Typ des Auszuliefernden Endpunktes für den Hauptdienst von Synapse
  type: ClusterIP
  # -- (int) interner Port des Auszuliefernden Endpunktes für den Hauptdienst von Synapse
  port: 8008
  # -- (int) externer Port des Auszuliefernden Endpunktes für den Hauptdienst von Synapse
  targetPort: http


######################################################################################
