######################################################################################
##          Konfiguration für Element-WebClient
######################################################################################

webclient:
  # -- (bool) Element-Webclient im Deployment aktivieren
  enabled: false
  # -- (string) URL für den Webclient, zwingend notwendig
  uri: ""
  # -- (map) Konfiguration für das Image vom Element-Webclient
  image:
    repository: registry.opencode.de/bwi/bundesmessenger/backend/container-images/bundesmessenger-web
    tag: 2.8.0-jammy-production
    pullPolicy: IfNotPresent
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options SAMEORIGIN;
      add_header X-Content-Type-Options nosniff;
      add_header X-XSS-Protection "1; mode=block";
      add_header Content-Security-Policy "frame-ancestors 'none'";

  # -- (map) Informationen zum Sicherheitskontext, die der Container übernehmen soll.
  # weitere Möglichkeiten:
  #  fsGroup: 1001
  podSecurityContext:
    runAsGroup: 1001
    runAsUser: 1001

  # -- (map) Konfiguration für die Container-Sicherheitsrichtlinie
  # weitere Möglichkeiten:
  #  capabilities:
  #    drop:
  #    - ALL
  securityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true

  ## Ressource Konfiguration für webclient-server.
  resources:
    limits:
      # -- (string) Rechenressourcengrenzen, die auf den webclient-server anzuwenden sind.
      cpu: 100m
      # -- (string) RAM Ressourcengrenzen, die auf den webclient-server anzuwenden sind.
      memory: 90Mi
    requests:
      # -- (string) Anforderungen an Rechenressourcen, die auf den webclient-server anzuwenden sind.
      cpu: 50m
      # -- (string) Anforderungen an RAM Ressourcen, die auf den webclient-server anzuwenden sind.
      memory: 45Mi


######################################################################################
##          zusätzliche Konfigurationen für den BundesMessenger
######################################################################################
## Konfigurationen, die übergreifend sind und nicht nur eine einzelne Komponenten betreffen.
## Die Abschnitte `config` und `extraConfig` betreffen Einstellungen, die direkt in die
## Konfiguration von Synapse eingehen. Die Abschnitte `wellknown` oder `webclient` betreffen
## bevorzugt diese Komponenten direkt. Die Einstellungen, die hier statt finden,
## greifen komponentenübergreifend, z.B. alle Clients (auch die mobilen Apps)
## und nicht nur den Webclient.

additionalConfig:

  locationSharing:
    # -- (bool) Aktivierung und Konfiguration von Standort teilen (location sharing) in den Clients
    # Führt zur Konfiguration der /.well-known/client und /_matrix/cconfig/style.json
    # Wenn wellknown.enable oder confighub.enable deaktiviert sind, ist die
    # notwendige Konfiguration selbst vorzunehmen.
    enabled: true

  # -- (map) Die Nutzer werden mit diesen Informationen auf die bevorstehende geplante Downtime,
  # bzw. auf die aktive Downtime, hingewiesen.
  # Weiterhin besteht die Möglichkeit, die Nutzer zum Update des Clients zu motivieren bzw. zu zwingen.
  # Die Konfiguration wird vom confighub ausgeliefert, daher ist es notwendig, dass
  # `confighub.enable: true` gesetzt ist.
  #
  # downtime[]
  #   warning_start_time: Startzeit der Warnmeldung (ISO 8601)
  #                       Beispiele: 2023-08-06T14:00:00Z (UTC)
  #                                  2009-01-01T12:00:00+01:00 (MEZ)
  #                                  2009-06-30T18:30:00+02:00 (MESZ - Sommerzeit)
  #   start_time:         Startzeit der Downtime (ISO 8601)
  #   end_time:           Ende der Downtime (ISO 8601)
  #   type:
  #     MAINTENANCE:  Default Text in Anwendung für Wartungsfenster.
  #                   Feld `description` wird zusätzlich darunter mit 1 Zeile Abstand angezeigt,
  #                   wenn vorhanden
  #     ADHOC_MESSAGE: Nur der Text aus dem Feld `description` wird angezeigt.
  #   description:  optionaler Text zusätzlich zum Standard-Wartungstext
  #   blocking:     Bei true werden Login und Requests vom Client blockiert (auch im eingeloggten Zustand)
  #                 Requests auf die Maintenance-Schnittstelle werden nicht blockiert.
  #
  # versions: ios oder android (web unterstützt die Funktion aktuell nicht)
  #   Für die Versionsangabe sind vollständige Versionsnummern (Major.Minor.Patch) anzugeben.
  # update_before: die letzte Version, die gedulded wird, ältere müssen updaten
  # warn_before: die letzte Version ohne Update-Hinweis, ältere sollten updaten
  #
  # maintenance:
  #   downtime:
  #     - warning_start_time: "2022-12-14T11:00:00Z"
  #       start_time: "2022-12-23T11:00:00Z"
  #       end_time: "2022-12-24T20:00:00Z"
  #       type: "MAINTENANCE"
  #       description: "Weihnachtswartung 2022"
  #       blocking: true
  #   versions:
  #     ios:
  #       update_before: "1.17.0"
  #       warn_before: "1.19.0"
  #     android:
  #       update_before: "1.17.0"
  #       warn_before: "1.19.0"
  maintenance: {}


######################################################################################
##          Konfiguration der Network Policies
######################################################################################

networkpolicies:
  enabled: false
  # -- (string) Hierbei handelt es sich um den Namespace indem ein Ingress Controller gehostet wird.
  # Aktuell wird nur eine Architektur mit einem L7 Ingress Controller unterstützt.
  # Absolut notwendig für die Network-Policies
  ingressNamespace: "default"
  # Wird gesetzt wenn sich die Postgres Instanz ausserhalb des Kubernetes Cluster befindet.
  # Da Network Policies keine Hostnames auflösen können, wird eine IP benötigt.
  postgres:
    # bei dem Einsatz einer Postgres Instanz welche sich außerhalb des Kubernetes Clusters
    # befindet muss hier eine einzelne IP Adresse angegeben werden.
    externalPostgresIP: ""
    # -- (string) Der labelselector wird dafür genutzt eine Postgres Instanz innerhalb des Clusters
    # zu adressieren. Sollte das Label bei einer eigens betriebenen Instanz abweichen,
    # kann dies hier angepasst werden.
    labelselector: "app.kubernetes.io/name: postgresql"


######################################################################################
##          Konfiguration für Helm-Tests
######################################################################################

tests:
  # -- (map) Konfiguration für das Image der Tests
  image:
    repository: registry.opencode.de/bwi/bundesmessenger/backend/container-images/wget
    tag: 1.21.2-jammy-production
    pullPolicy: IfNotPresent

  # -- (map) Annotations, die zusätzlich auf die Tests anzuwenden sind.
  annotations:
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

  # -- (map) Informationen zum Sicherheitskontext, die der Container übernehmen soll.
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001

  # -- (map) Konfiguration für die Container-Sicherheitsrichtlinie
  securityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001

  ## Ressource Konfiguration für Tests.
  resources:
    limits:
      # -- (string) Rechenressourcengrenzen, die für Tests anzuwenden sind.
      cpu: 100m
      # -- (string) RAM Ressourcengrenzen, die für Tests anzuwenden sind.
      memory: 32Mi
    requests:
      # -- (string) Anforderungen an Rechenressourcen, die für Tests anzuwenden sind.
      cpu: 50m
      # -- (string) Anforderungen an RAM Ressourcen, die für Tests anzuwenden sind.
      memory: 16Mi


######################################################################################
##          Konfiguration für Demo-Modes
######################################################################################

demomode:
  # -- (boolean) Aktivieren des Demoworkflows für Kubernetes ab v1.21.0
  # Achtung: Der Demomodus setzt per CronJob die Datenbank regelmäßig zurück.
  enabled: false

  # -- (string) Auswahl des Demomodus
  # Folgende Möglichkeiten:
  #   "complete": Es wird die gesamte Datenbank gelöscht und neu erstellt.
  #   "defined": Es wird ein Datenbank-Dump zurück gespielt.
  #              Dieser muss als DB-Dump bereit gestellt werden. (TBD)
  #   "federation": Wie "defined", jedoch mit der Option als Förderationspartner zu fungieren. (TBD)
  mode: complete

  # -- (string) Angabe der Laufzeit des Demomodus
  # Nutzung der Crontab-Zeitnotation
  # Die Crontab-Zeitnotation besteht aus fünf oder sechs Stichpunkten, die die Zeitintervalle angeben:
  # Minute (0-59): Die Minute, zu der die Aufgabe ausgeführt werden soll.
  # Stunde (0-23): Die Stunde, zu der die Aufgabe ausgeführt werden soll.
  # Tag des Monats (1-31): Der Tag des Monats, an dem die Aufgabe ausgeführt werden soll.
  # Monat (1-12): Der Monat, in dem die Aufgabe ausgeführt werden soll.
  # Tag der Woche (0-6): Der Tag der Woche, an dem die Aufgabe ausgeführt werden soll (0 steht für Sonntag).
  # (optional) Jahr (z. B. 2023): Das Jahr, in dem die Aufgabe ausgeführt werden soll.
  # Die Stichpunkte können folgende Werte enthalten:
  # Eine konkrete Zahl (z. B. 5): Die Aufgabe wird zu diesem spezifischen Wert ausgeführt.
  # Eine Liste von Zahlen (z. B. 1,3,5): Die Aufgabe wird zu jedem der angegebenen Werte ausgeführt.
  # Ein Bereich von Zahlen (z. B. 1-5): Die Aufgabe wird zu allen Werten im angegebenen Bereich ausgeführt.
  # Eine Schrittgröße (z. B. */10): Die Aufgabe wird in Intervallen entsprechend der angegebenen Schrittgröße ausgeführt.
  # Zusätzlich können spezielle Zeichen verwendet werden:
  # Asterisk (*): Steht für "jeder Wert" und wird verwendet, um anzuzeigen, dass die Aufgabe zu jeder möglichen Zeit ausgeführt werden soll.
  # Komma (,): Trennt mehrere Werte oder Wertebereiche voneinander.
  # Schrägstrich (/): Wird verwendet, um eine Schrittgröße anzugeben.
  # @default 0 0 * * 0, Dies bedeutet, dass die Aufgabe um 0:00 Uhr (Mitternacht) an jedem Sonntag (Tag der Woche = 0) ausgeführt wird
  interval: "0 0 * * 0"

  # -- (string) existingClaim für PostgreSQL-Dump
  existingClaim: sqldump

  # -- (string) Postgresql-Dump, welcher auf dem PVC vom PostgreSQL-Server liegt
  sqldump: dump.sql
