######################################################################################
##          Setting up Synapse Admin
######################################################################################
synapse_admin:
  enabled: true
  adminUri:  
  image:
    repository: awesometechnologies/synapse-admin
    tag: 0.8.5
    pullPolicy: IfNotPresent
  ## Resource configuration to apply to the synapse-admin server.
  ##
  resources: 
    limits:
      cpu: 5m
      memory: 15Mi
    requests:
      cpu: 5m
      memory: 15Mi

  podSecurityContext: 
    #    runAsNonRoot: true
    sysctls:
      - name: net.ipv4.ip_unprivileged_port_start
        value: "80"
