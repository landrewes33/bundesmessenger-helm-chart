  ## Configuration for the container security policy.
  ##
  securityContext: 
  #  capabilities:
  #    drop:
  #    - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 2111

  ## Resource configuration to apply to the sygnal server.
  ##
  resources: 
    limits:
      cpu: 150m
      memory: 45Mi
    requests:
      cpu: 150m
      memory: 45Mi

#  ## Liveness probe configuration to use
