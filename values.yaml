######################################################################################
##          Setting up CoTurn
######################################################################################
#Standard: if enabled, coturn will be deployed under default namespace, to be used from more than one instance
# if coturn is enabled and existingcoturn too, it will configure the service to be used
# with a coturn deployed under the namespace coturn.default_ns
# Empfohlen nicht zu nutzen, da coturn host-ports nutzen muss um stabil und performant zu arbeiten

coturn:
  enabled: false
  turnUris:
    udp: 3478
    tcp: 3478
    realm: "turn.beispiel.org"
  existingcoturn: 
    enabled: true
  default_ns: default
  image:
    repository: coturn/coturn
    tag: docker/4.5.2-r12
    pullPolicy: IfNotPresent
  securityContext:
    runAsUser: 2011
    runAsGroup: 2011
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false

# if shared secret:
