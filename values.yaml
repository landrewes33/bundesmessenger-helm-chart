######################################################################################
##          Configuration for BundesMessenger-Call
######################################################################################
## The BundesMessenger-Call Client is currently in Beta status. It enables video chats.
## The video chats work via WebRTC and LiveKit SFU.
## The SFU must be provided separately.
## The Client for Call is part of the Webclient. However, the
## JWT Service is required.

call:
  # (bool) Enable BundesMessenger-Call in deployment
  enabled: false

  # (map) Configuration with which the LiveKit server can be reached.
  # Key and Secret must match the specifications in the LiveKit server.
  livekit:
    # (string) URL des LiveKit Servers.
    url: "wss://livekit.example.com"
    # key: "devkey"
    # secret: "secret"

  # (string) Name of the Livekit secret.
  existingSecret: call
  # (map) References to Livekit key and secret.
  secretKeys:
    # (string) Reference in `existingSecret` to the Livekit key.
    livekitKey: livekit-key
    # (string) Reference in `existingSecret` to the Livekit secret.
    livekitSecret: livekit-secret

  # (map) Configuration for the image of the LiveKit JWT Service
  jwtService:
    image:
      registry: ghcr.io
      repository: element-hq/lk-jwt-service
      tag: 0.4.1
      pullSecrets: []
      pullPolicy: IfNotPresent

    # (integer) Replica-Count.
    replicaCount: 1

    # (list) Additional environment variables to apply to the pod
    # Example:
    # https://github.com/element-hq/lk-jwt-service/tree/main?tab=readme-ov-file#%EF%B8%8F-configuration
    # - name: LIVEKIT_FULL_ACCESS_HOMESERVERS
    #   value: *
    # https://github.com/element-hq/lk-jwt-service/tree/main?tab=readme-ov-file#-development--testing
    # - name: LIVEKIT_INSECURE_SKIP_VERIFY_TLS
    #   value: YES_I_KNOW_WHAT_I_AM_DOING
    # - name: NO_PROXY
    #   value: "127.0.0.1,localhost,*.mylocaldomain.local,10.0.0.0/8"
    # - name: HTTPS_PROXY
    #   value: "https://proxyuser@proxyserver:proxyport"
    # - name: HTTP_PROXY
    #   value: "http://proxyuser@proxyserver:proxyport"
    extraEnv: []

    # (list) Additional storage areas for the LiveKit JWT Service pod.
    extraVolumes: []
    # (list) Additional storage mount points for the LiveKit JWT Service container.
    extraVolumeMounts: []

    # (map) Security context information that the pod should adopt.
    podSecurityContext:
      <<: *defaultPodSecurityContext
      runAsGroup: 1021
      runAsUser: 1021

    # (map) Configuration for container security policy
    securityContext:
      <<: *defaultSecurityContext

    ## Resource configuration for LiveKit-JWT-Server.
    resources:
      limits:
        # (string) Compute resource limits to apply to the LiveKit-JWT-Server container.
        cpu: 100m
        # (string) RAM resource limits to apply to the LiveKit-JWT-Server container.
        memory: 50Mi
      requests:
        # (string) Compute resource requests to apply to the LiveKit-JWT-Server container.
        cpu: 50m
        # (string) RAM resource requests to apply to the LiveKit-JWT-Server container.
        memory: 25Mi

    # (map) Node selector configuration for the container.
    nodeSelector: {}

    # (list) Tolerations/Taints configuration for the container.
    tolerations: []

    # (map) Affinity configuration for the container.
    affinity: {}

  standalone:
    # (bool) Enable BundesMessenger-Call standalone in deployment
    # The operation of Standalone is experimental and serves
    # the use of guest access to Huddles
    # `call.enabled` must also be enabled
    enabled: false
    # (string) URL for the Call Client, mandatory
    uri: ""

    image:
      registry: ghcr.io
      repository: element-hq/element-call
      tag: v0.16.3
      pullSecrets: []
      pullPolicy: IfNotPresent

    # Additional configurations for the Callclient (config.json)
    # Ref: https://github.com/element-hq/element-call/blob/livekit/config/config.sample.json
    extraConfig: {}

    # (list) Additional environment variables for the Call container.
    extraEnv: []

    # (map) Security context information that the pod should adopt.
    podSecurityContext:
      <<: *defaultPodSecurityContext
      runAsUser: 1001
      runAsGroup: 1001

    # (map) Configuration for container security policy
    securityContext:
      <<: *defaultSecurityContext

    # (list) Additional storage areas for the Call pod.
    extraVolumes: []
    # (list) Additional storage mount points for the Call container.
    extraVolumeMounts:
    # []
      # workaround for Image: element-hq/element-call
      - name: tmp
        mountPath: /var/cache/nginx/

    ## Resource configuration for BundesMessenger-Call.
    resources:
      limits:
        # (string) Compute resource limits to apply to the BundesMessenger-Call container.
        cpu: 100m
        # (string) RAM resource limits to apply to the BundesMessenger-Call container.
        memory: 90Mi
      requests:
        # (string) Compute resource requests to apply to the BundesMessenger-Call container.
        cpu: 50m
        # (string) RAM resource requests to apply to the BundesMessenger-Call container.
        memory: 45Mi


######################################################################################
##          Additional configurations for the BundesMessenger
######################################################################################
## Configurations that are cross-cutting and do not affect just a single component.
## The sections `config` and `extraConfig` affect settings that go directly into the
## configuration of Synapse. The sections `wellknown` or `webclient` affect
## these components directly preferentially. The settings that take place here
## affect cross-component, e.g. all clients (including mobile apps)
## and not just the Webclient.

additionalConfig:

  # (list) List of JWTs provided to the client to verify the infrastructure
  # as legitimate. These are provided via `<public_baseurl>/_bum/client/v1/verify`
  verifyJWT: []

  federation:
    # (bool) To enable or disable the display of federation in the clients.
    enabled: true
    # (bool) To be able to display the introduction dialogs.
    showIntroduction: false
    # (bool) To be able to display the advance notice for the introduction of federation.
    # Note: The introduction dialog is only displayed once.
    showAnnouncement: false

  # (integer) Migration notice for BundesMessengerX.
  # Allows the user in the BuM Legacy apps to be notified of
  # the migration to BuMX at different levels.
  #  0: No information
  #  1: Friendly notice
  #  2: Request to switch
  #  3: Forced dialog, login to the BuM Legacy App no longer possible
  migrationBuMX: 0

  dsgvoExport:
    # (bool) Adds volume and suspended cronjob to export users.
    # For more information see ./docs/DSGVO-Exporter.md
    enabled: false

    serviceAccount:
      create: true
      # (string|null) Name of the ServiceAccount for the dsgvo-exporter-job.
      # name: non-default-dsgvo-exporter-name

  locationSharing:
    # (bool) Activation and configuration of location sharing in the clients
    # Leads to configuration of /.well-known/client and /_matrix/cconfig/style.json
    # If wellknown.enable or confighub.enable are disabled, the
    # necessary configuration must be done manually.
    enabled: true

    # (string) Link to the Style Map for the Tiles Server (https://docs.mapbox.com/style-spec/guides/)
    # This URL is passed to the clients via /.well-known/matrix/client to obtain the information
    # about the map server. If the value is not set, the client will be passed the
    # configuration from `map_style_config`.
    map_style_url: ""

    # (map) Configuration for the client with information about the Tiles Server.
    # If `map_style_url` is configured, this specification is ignored.
    # The configuration is rendered with the "toRawJson" function.
    # Quotation marks (") are automatically escaped by Helm (to \").
    map_style_config:
      version: 8
      name: wms
      sources:
        wms_topplus:
          type: raster
          tiles:
            - https://sgx.geodatenzentrum.de/wms_topplus_open?bbox={bbox-epsg-3857}&format=image/png&service=WMS&version=1.1.1&request=GetMap&srs=EPSG:3857&width=256&height=256&layers=web_scale&styles=
          tileSize: 256
          attribution: <a href="https://sgx.geodatenzentrum.de/web_public/gdz/datenquellen/Datenquellen_TopPlusOpen.html" target="_blank">&copy; Bundesamt f&uuml;r Kartographie und Geod&auml;sie (2023)</a>
      layers:
        - id: web_layer
          source: wms_topplus
          source-layer: web
          type: raster

  # (map) Users are notified with this information about the upcoming scheduled downtime,
  # or about the active downtime.
  # Furthermore, there is the option to motivate or force users to update the client.
  # The configuration is delivered by confighub, therefore it is necessary that
  # `confighub.enabled: true` is set.
  #
  # downtime[]
  #   warning_start_time: Startzeit der Warnmeldung (ISO 8601)
  #                       Beispiele: 2023-08-06T14:00:00Z (UTC)
  #                                  2009-01-01T12:00:00+01:00 (MEZ)
  #                                  2009-06-30T18:30:00+02:00 (MESZ - Sommerzeit)
  #   start_time:         Start time of the downtime (ISO 8601)
  #   end_time:           End time of the downtime (ISO 8601)
  #   type:
  #     MAINTENANCE:  Default text in application for maintenance window.
  #                   Field `description` is additionally displayed below with 1 line spacing,
  #                   if present
  #     ADHOC_MESSAGE: Only the text from the `description` field is displayed.
  #   description:  optional text in addition to the standard maintenance text
  #   blocking:     If true, login and requests from the client are blocked (even in logged-in state)
  #                 Requests to the Maintenance interface are not blocked.
  #
  # versions: ios or android (web currently does not support the function)
  #   For the version specification, complete version numbers (Major.Minor.Patch) must be specified.
  # update_before: the last version that is tolerated, older versions must update
  # warn_before: the last version without update notice, older versions should update
  #
  # maintenance:
  #   downtime:
  #     - warning_start_time: "2022-12-14T11:00:00Z"
  #       start_time: "2022-12-23T11:00:00Z"
  #       end_time: "2022-12-24T20:00:00Z"
  #       type: "MAINTENANCE"
  #       description: "Weihnachtswartung 2022"
  #       blocking: true
  #   versions:
  #     ios:
  #       update_before: "1.17.0"
  #       warn_before: "1.19.0"
  #     android:
  #       update_before: "1.17.0"
  #       warn_before: "1.19.0"
  maintenance: {}


######################################################################################
##          Configuration of Network Policies
######################################################################################

networkpolicies:
  enabled: false
  # (list) Transport addresses of the proxies for Synapse and its workers.
  # The specified proxies are allowed via egress rules. All entries
  # must be specified in CIDR notation: Start-IP/Netmask:Proxyport
  # Example:
  # - 192.168.10.0/24:8765
  # - 10.10.0.0/16:5000
  fwProxyList: []
  # (list) Transport addresses of the DNS resolvers and Admin API.
  # Specifications with port are taken as target port with protocol TCP. All
  # entries must be specified in CIDR notation:
  # Start-IP/Netmask:Proxyport
  # Example:
  # - 192.168.2.0/24
  # - 10.20.2.0/24:53
  egressIpBlock: []
  # (map) Settings for the DNS of the infrastructure.
  dns:
    # (list) Label selector for addressing the DNS pods
    labelSelector:
      - key: k8s-app
        operator: In
        values: ["kube-dns"]
  # (string) Namespace of the Ingress Controller.
  # Currently only an architecture with one L7 Ingress Controller
  # is supported. Absolutely necessary for the Network Policies.
  ingressNamespace: default

  # (map) Settings for the main PostgreSQL server.
  postgresql:
    # (string|null) IP of the external PostgreSQL instance.
    # When using a PostgreSQL instance outside the Kubernetes cluster
    # a single IP address must be specified here. If not set, it is
    # assumed that the external PostgreSQL instance is part of the Kubernetes
    # cluster.
    # externalPostgresIP: 10.30.3.0

    # (list) Label selector for addressing the PostgreSQL pod.
    # If the labels differ for a separately operated instance, this can
    # be adjusted here.
    labelSelector:
      - key: app.kubernetes.io/name
        operator: In
        values: ["postgresql"]

  # (map) Settings for the MAS-PostgreSQL server.
  maspostgresql:
    # (string|null) IP of the external MAS-PostgreSQL instance.
    # When using a PostgreSQL instance outside the Kubernetes cluster
    # a single IP address must be specified here. If not set, it is
    # assumed that the external PostgreSQL instance is part of the Kubernetes
    # cluster.
    # externalPostgresIP: 10.30.3.0

    # (list) Label selector for addressing the PostgreSQL pod.
    # If the labels differ for a separately operated instance, this can
    # be adjusted here.
    labelSelector:
      - key: app.kubernetes.io/name
        operator: In
        values: ["maspostgresql"]

  # (map) HTTP resolver for ACME/Let's Encrypt.
  # Allows communication from the Ingress to the endpoint specified here (Pod + Port).
  acme:
    labelSelector:
      - key: acme.cert-manager.io/http01-solver
        operator: In
        values: ["true"]
    port: 8089


######################################################################################
##          Configuration for Helm Tests
######################################################################################

tests:
  # (map) Configuration for the image of the tests
  image:
    registry: registry.opencode.de
    repository: bwi/bundesmessenger/backend/container-images/wget
    tag: 1.21.2-jammy-production
    pullSecrets: []
    pullPolicy: IfNotPresent

  # (map) Annotations to apply additionally to the tests container.
  annotations:
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

  # (map) Security context information that the pod should adopt.
  podSecurityContext:
    <<: *defaultPodSecurityContext
    runAsUser: 1001
    runAsGroup: 1001

  # (map) Configuration for container security policy
  securityContext:
    <<: *defaultSecurityContext
    runAsUser: 1001
    runAsGroup: 1001

  ## Resource configuration for Tests.
  resources:
    limits:
      # (string) Compute resource limits to apply to the tests container.
      cpu: 100m
      # (string) RAM resource limits to apply to the tests container.
      memory: 32Mi
    requests:
      # (string) Compute resource requests to apply to the tests container.
      cpu: 50m
      # (string) RAM resource requests to apply to the tests container.
      memory: 16Mi
