######################################################################################
##          Konfiguration für BundesMessenger-Call
######################################################################################
## Der BundesMessenger-Call Client ist derzeit im Beta-Status. Er ermöglicht Video-Chats.
## Die Video-Chats funktionieren via WebRTC und LiveKit SFU.
## Die SFU muss sperat bereit gestellt werden.
## Der Client wird nicht mit der konfigurierten URL direkt aufgerufen, sondern
## integriert sich in den WebClient. Die URL wird für die Integration
## jedoch benötigt.

call:
  # (bool) BundesMessenger-Call im Deployment aktivieren
  enabled: false
  # (string) URL für den Call, zwingend notwendig
  uri: ""

  # (map) Konfiguration mit denen der LiveKit Server erreicht werden kann.
  # Key und Secret müssen mit den Angabe im LiveKit Server überein stimmen.
  livekit:
    # (string) URL des LiveKit Servers.
    url: "wss://livekit.example.com"
    # key: "devkey"
    # secret: "secret"

  # (string) Name vom Livekit-Secret.
  existingSecret: call
  # (map) Verweise auf Livekit-Schlüssel und -Geheimnis.
  secretKeys:
    # (string) Verweis im `existingSecret` auf den Livekit-Schlüssel.
    livekitKey: livekit-key
    # (string) Verweis im `existingSecret` auf das Livekit-Geheimnis.
    livekitSecret: livekit-secret

  # (map) Konfiguration für Client vom BundesMessenger-Call
  client:
    image:
      registry: registry.opencode.de
      repository: bwi/bundesmessenger/backend/container-images/bundesmessenger-call
      tag: 0.4.0-jammy-production
      pullSecrets: []
      pullPolicy: IfNotPresent

    # (list) Weitere Umgebungsvariablen für den Call-Container.
    extraEnv: []

    # (map) Informationen zum Sicherheitskontext, die der Pod übernehmen soll.
    podSecurityContext:
      <<: *defaultPodSecurityContext
      runAsUser: 1001
      runAsGroup: 1001

    # (map) Konfiguration für die Container-Sicherheitsrichtlinie
    securityContext:
      <<: *defaultSecurityContext

    # (list) Weitere Speicherbereiche für den Call-Pod.
    extraVolumes: []
    # (list) Weitere Speicher-Einhängepunkte für den Call-Container.
    extraVolumeMounts: []

    ## Ressource Konfiguration für BundesMessenger-Call.
    resources:
      limits:
        # (string) Rechenressourcengrenzen, die auf den BundesMessenger-Call anzuwenden sind.
        cpu: 100m
        # (string) RAM Ressourcengrenzen, die auf den BundesMessenger-Call anzuwenden sind.
        memory: 90Mi
      requests:
        # (string) Anforderungen an Rechenressourcen, die auf den BundesMessenger-Call anzuwenden sind.
        cpu: 50m
        # (string) Anforderungen an RAM Ressourcen, die auf den BundesMessenger-Call anzuwenden sind.
        memory: 45Mi

  # (map) Konfiguration für das Image vom LiveKit JWT Service
  jwtService:
    image:
      registry: ghcr.io
      repository: element-hq/lk-jwt-service
      tag: 0.2.3
      pullSecrets: []
      pullPolicy: IfNotPresent

    # (integer) Replica-Count.
    replicaCount: 1

    # (list) Zusätzliche Umgebungsvariablen, die auf den Pod anzuwenden sind
    # Beispiel:
    # - name: NO_PROXY
    #   value: "127.0.0.1,localhost,*.mylocaldomain.local,10.0.0.0/8"
    # - name: HTTPS_PROXY
    #   value: "https://proxyuser@proxyserver:proxyport"
    # - name: HTTP_PROXY
    #   value: "http://proxyuser@proxyserver:proxyport"
    extraEnv: []

    # (map) Informationen zum Sicherheitskontext, die der Pod übernehmen soll.
    podSecurityContext:
      <<: *defaultPodSecurityContext
      runAsGroup: 1021
      runAsUser: 1021

    # (map) Konfiguration für die Container-Sicherheitsrichtlinie
    securityContext:
      <<: *defaultSecurityContext

    ## Ressource Konfiguration für LiveKit-JWT-Server.
    resources:
      limits:
        # (string) Rechenressourcengrenzen, die auf den LiveKit-JWT-Server anzuwenden sind.
        cpu: 100m
        # (string) RAM Ressourcengrenzen, die auf den LiveKit-JWT-Server anzuwenden sind.
        memory: 50Mi
      requests:
        # (string) Anforderungen an Rechenressourcen, die auf den LiveKit-JWT-Server anzuwenden sind.
        cpu: 50m
        # (string) Anforderungen an RAM Ressourcen, die auf den LiveKit-JWT-Server anzuwenden sind.
        memory: 25Mi

    # (map) Node Selektor Konfiguration für den Container.
    nodeSelector: {}

    # (list) Tolerations/Tains Konfiguration für den Container.
    tolerations: []

    # (map) Affinitäts-Konfiguration für den Container.
    affinity: {}


######################################################################################
##          zusätzliche Konfigurationen für den BundesMessenger
######################################################################################
## Konfigurationen, die übergreifend sind und nicht nur eine einzelne Komponenten betreffen.
## Die Abschnitte `config` und `extraConfig` betreffen Einstellungen, die direkt in die
## Konfiguration von Synapse eingehen. Die Abschnitte `wellknown` oder `webclient` betreffen
## bevorzugt diese Komponenten direkt. Die Einstellungen, die hier statt finden,
## greifen komponentenübergreifend, z.B. alle Clients (auch die mobilen Apps)
## und nicht nur den Webclient.

additionalConfig:

  # (list) Liste an JWT, die dem Client bereit gestellt werden, um die Infrastruktur
  # als legitim auszuweisen. Diese werden via `<public_baseurl>/_bum/client/v1/verify`
  verifyJWT: []

  dsgvoExport:
    # (bool) Fügt Volume und suspended Cronjob hinzu um Benutzer zu exportieren.
    # Weiteres siehe ./docs/DSGVO-Exporter.md
    enabled: false

    serviceAccount:
      create: true
      # (string|null) Name des ServiceAccounts für den dsgo-exporter-job.
      # name: non-default-dsgvo-exporter-name

  locationSharing:
    # (bool) Aktivierung und Konfiguration von Standort teilen (location sharing) in den Clients
    # Führt zur Konfiguration der /.well-known/client und /_matrix/cconfig/style.json
    # Wenn wellknown.enable oder confighub.enable deaktiviert sind, ist die
    # notwendige Konfiguration selbst vorzunehmen.
    enabled: true

    # (string) Link zur Style Map für den Tiles Server (https://docs.mapbox.com/style-spec/guides/)
    # Diese URL wird via /.well-known/matrix/client an die Clients übergeben um die Informationen
    # über den Karten-Server zu erhalten. Wenn der Wert nicht gesetzt ist, wird dem Client die
    # Konfiguration aus `map_style_config` übergeben.
    map_style_url: ""

    # (map) Konfiguration für den Client mit den Informationen über den Tiles Server.
    # Wenn `map_style_url` konfiguriert ist, wird diese Angabe ignoriert.
    # Die Konfiguration wird mit der Funktion "toRawJson" gerendert.
    # Anführungszeichen (") werden automatisch von Helm escaped (zu \").
    map_style_config:
      version: 8
      name: wms
      sources:
        wms_topplus:
          type: raster
          tiles:
            - https://sgx.geodatenzentrum.de/wms_topplus_open?bbox={bbox-epsg-3857}&format=image/png&service=WMS&version=1.1.1&request=GetMap&srs=EPSG:3857&width=256&height=256&layers=web_scale&styles=
          tileSize: 256
          attribution: <a href="https://sgx.geodatenzentrum.de/web_public/gdz/datenquellen/Datenquellen_TopPlusOpen.html" target="_blank">&copy; Bundesamt f&uuml;r Kartographie und Geod&auml;sie (2023)</a>
      layers:
        - id: web_layer
          source: wms_topplus
          source-layer: web
          type: raster

  # (map) Die Nutzer werden mit diesen Informationen auf die bevorstehende geplante Downtime,
  # bzw. auf die aktive Downtime, hingewiesen.
  # Weiterhin besteht die Möglichkeit, die Nutzer zum Update des Clients zu motivieren bzw. zu zwingen.
  # Die Konfiguration wird vom confighub ausgeliefert, daher ist es notwendig, dass
  # `confighub.enabled: true` gesetzt ist.
  #
  # downtime[]
  #   warning_start_time: Startzeit der Warnmeldung (ISO 8601)
  #                       Beispiele: 2023-08-06T14:00:00Z (UTC)
  #                                  2009-01-01T12:00:00+01:00 (MEZ)
  #                                  2009-06-30T18:30:00+02:00 (MESZ - Sommerzeit)
  #   start_time:         Startzeit der Downtime (ISO 8601)
  #   end_time:           Ende der Downtime (ISO 8601)
  #   type:
  #     MAINTENANCE:  Default Text in Anwendung für Wartungsfenster.
  #                   Feld `description` wird zusätzlich darunter mit 1 Zeile Abstand angezeigt,
  #                   wenn vorhanden
  #     ADHOC_MESSAGE: Nur der Text aus dem Feld `description` wird angezeigt.
  #   description:  optionaler Text zusätzlich zum Standard-Wartungstext
  #   blocking:     Bei true werden Login und Requests vom Client blockiert (auch im eingeloggten Zustand)
  #                 Requests auf die Maintenance-Schnittstelle werden nicht blockiert.
  #
  # versions: ios oder android (web unterstützt die Funktion aktuell nicht)
  #   Für die Versionsangabe sind vollständige Versionsnummern (Major.Minor.Patch) anzugeben.
  # update_before: die letzte Version, die gedulded wird, ältere müssen updaten
  # warn_before: die letzte Version ohne Update-Hinweis, ältere sollten updaten
  #
  # maintenance:
  #   downtime:
  #     - warning_start_time: "2022-12-14T11:00:00Z"
  #       start_time: "2022-12-23T11:00:00Z"
  #       end_time: "2022-12-24T20:00:00Z"
  #       type: "MAINTENANCE"
  #       description: "Weihnachtswartung 2022"
  #       blocking: true
  #   versions:
  #     ios:
  #       update_before: "1.17.0"
  #       warn_before: "1.19.0"
  #     android:
  #       update_before: "1.17.0"
  #       warn_before: "1.19.0"
  maintenance: {}


######################################################################################
##          Konfiguration der Network Policies
######################################################################################

networkpolicies:
  enabled: false
  # (list) IP(s) der Proxy(s), die für den Synapse und seine Worker via Env-Variablen
  # erreichbar sein sollen. Diese werden per Egress-Regeln erlaubt.
  # Die Einträge müssen in CIDR-Schreibweise vorgenommen werden: Start-IP/Netzmaske:Proxyport
  # Bsp:
  # - "192.168.10.0/24:8765"
  # - "10.10.0.0/16:5000"
  fwProxyList: []
  # (list) IP-Range(s) der DNS-Resolver bzw. Admin-API; CIDR-Schreibweise!
  # Angaben mit Port werden als Zielport mit Protokoll TCP übernommen.
  # Bsp:
  # - "192.168.2.0/24"
  # - "10.20.2.0/24:53"
  egressIpBlock: []
  # (string) Label zur Identifikation der DNS-Pods der Infrastruktur.
  dnsLabel: "kube-dns"
  # (string) Hierbei handelt es sich um den Namespace indem ein Ingress Controller gehostet wird.
  # Aktuell wird nur eine Architektur mit einem L7 Ingress Controller unterstützt.
  # Absolut notwendig für die Network-Policies
  ingressNamespace: "default"
  # Wird gesetzt wenn sich die Postgres Instanz ausserhalb des Kubernetes Cluster befindet.
  # Da Network Policies keine Hostnames auflösen können, wird eine IP benötigt.
  postgres:
    # bei dem Einsatz einer Postgres Instanz welche sich außerhalb des Kubernetes Clusters
    # befindet muss hier eine einzelne IP Adresse angegeben werden.
    externalPostgresIP: ""
    # (string) Der labelselector wird dafür genutzt eine Postgres Instanz innerhalb des Clusters
    # zu adressieren. Sollte das Label bei einer eigens betriebenen Instanz abweichen,
    # kann dies hier angepasst werden.
    labelselector: "app.kubernetes.io/name: postgresql"


######################################################################################
##          Konfiguration für Helm-Tests
######################################################################################

tests:
  # (map) Konfiguration für das Image der Tests
  image:
    registry: registry.opencode.de
    repository: bwi/bundesmessenger/backend/container-images/wget
    tag: 1.21.2-jammy-production
    pullSecrets: []
    pullPolicy: IfNotPresent

  # (map) Annotations, die zusätzlich auf die Tests anzuwenden sind.
  annotations:
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

  # (map) Informationen zum Sicherheitskontext, die der Pod übernehmen soll.
  podSecurityContext:
    <<: *defaultPodSecurityContext
    runAsUser: 1001
    runAsGroup: 1001

  # (map) Konfiguration für die Container-Sicherheitsrichtlinie
  securityContext:
    <<: *defaultSecurityContext
    runAsUser: 1001
    runAsGroup: 1001

  ## Ressource Konfiguration für Tests.
  resources:
    limits:
      # (string) Rechenressourcengrenzen, die für Tests anzuwenden sind.
      cpu: 100m
      # (string) RAM Ressourcengrenzen, die für Tests anzuwenden sind.
      memory: 32Mi
    requests:
      # (string) Anforderungen an Rechenressourcen, die für Tests anzuwenden sind.
      cpu: 50m
      # (string) Anforderungen an RAM Ressourcen, die für Tests anzuwenden sind.
      memory: 16Mi


######################################################################################
##          Konfiguration für Demo-Modes
######################################################################################

demomode:
  # (bool) Aktivieren des Demoworkflows für Kubernetes ab v1.21.0
  # Achtung: Der Demomodus setzt per CronJob die Datenbank regelmäßig zurück.
  enabled: false

  serviceAccount:
    create: true
    # (string|null) Name des ServiceAccounts für den demomode-job.
    # name: non-default-demomode-name

  # (string) Auswahl des Demomodus
  # Folgende Möglichkeiten:
  #   "complete": Es wird die gesamte Datenbank gelöscht und neu erstellt.
  #   "defined": Es wird ein Datenbank-Dump zurück gespielt.
  #              Dieser muss als DB-Dump bereitgestellt werden. (TBD)
  #   "federation": Wie "defined", jedoch mit der Option als Förderationspartner zu fungieren. (TBD)
  mode: complete

  # (string) Angabe der Laufzeit des Demomodus
  # Nutzung der Crontab-Zeitnotation
  # Die Crontab-Zeitnotation besteht aus fünf oder sechs Stichpunkten, die die Zeitintervalle angeben:
  # Minute (0-59): Die Minute, zu der die Aufgabe ausgeführt werden soll.
  # Stunde (0-23): Die Stunde, zu der die Aufgabe ausgeführt werden soll.
  # Tag des Monats (1-31): Der Tag des Monats, an dem die Aufgabe ausgeführt werden soll.
  # Monat (1-12): Der Monat, in dem die Aufgabe ausgeführt werden soll.
  # Tag der Woche (0-6): Der Tag der Woche, an dem die Aufgabe ausgeführt werden soll (0 steht für Sonntag).
  # (optional) Jahr (z. B. 2023): Das Jahr, in dem die Aufgabe ausgeführt werden soll.
  # Die Stichpunkte können folgende Werte enthalten:
  # Eine konkrete Zahl (z. B. 5): Die Aufgabe wird zu diesem spezifischen Wert ausgeführt.
  # Eine Liste von Zahlen (z. B. 1,3,5): Die Aufgabe wird zu jedem der angegebenen Werte ausgeführt.
  # Ein Bereich von Zahlen (z. B. 1-5): Die Aufgabe wird zu allen Werten im angegebenen Bereich ausgeführt.
  # Eine Schrittgröße (z. B. */10): Die Aufgabe wird in Intervallen entsprechend der angegebenen Schrittgröße ausgeführt.
  # Zusätzlich können spezielle Zeichen verwendet werden:
  # Asterisk (*): Steht für "jeder Wert" und wird verwendet, um anzuzeigen, dass die Aufgabe zu jeder möglichen Zeit ausgeführt werden soll.
  # Komma (,): Trennt mehrere Werte oder Wertebereiche voneinander.
  # Schrägstrich (/): Wird verwendet, um eine Schrittgröße anzugeben.
  # @default 0 0 * * 0, Dies bedeutet, dass die Aufgabe um 0:00 Uhr (Mitternacht) an jedem Sonntag (Tag der Woche = 0) ausgeführt wird
  interval: "0 0 * * 0"

  # (string) existingClaim für Volume/Storage PostgreSQL-Dump und Media-Files
  existingClaim: ""

  # (string) Image für den Dump-Container, muss mit dem genutzten PostgreSQL kompatibel sein.
  # anzugeben in der Form: Registry/Repository/Image:Tag
  # Beispiel: registry.opencode.de/ig-bvc/demo-apps/postgresql/postgres:14
  # Wenn nicht gesetzt, wird das Image vom weiter oben konfigurierten internen PostgreSQL-Server genutzt.
  postgresqldump: ""

  # (string) Postgresql-Dump, welcher auf dem PVC vom PostgreSQL-Server liegt
  sqldump: dump.sql
