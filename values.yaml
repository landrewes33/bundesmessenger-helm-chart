  #   - name: tmpnginx
  #     emptyDir: {}
  #   - name: backgrounds
  #     persistentVolumeClaim:
  #       claimName: element-backgrounds
  extraVolumes: []

  # (map) Additional volume mounts to mount into Synapse Admin.
  # Example:
  # extraVolumeMounts:
  #   - name: confnginx
  #     mountPath: /etc/nginx/conf.d/
  #   - name: lognginx
  #     mountPath: /var/log/nginx/
  #   - name: runnginx
