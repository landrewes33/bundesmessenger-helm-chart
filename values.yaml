######################################################################################
##          Setting up CoTurn
######################################################################################
#Standard: if enabled, coturn will be deployed under default namespace, to be used from more than one instance
# if coturn is enabled and existingcoturn too, it will configure the service to be used
# with a coturn deployed under the namespace coturn.namespace
# ingress_ns_standard is important if you deployed the standard-controller under an other namespace
coturn:
  enabled: false
  turnUris:
    udp: 3478
    tcp: 3478
  existingcoturn: 
    enabled: true
  default_ns: default
  image:
    repository: coturn/coturn
    tag: latest
    pullPolicy: IfNotPresent
  securityContext:
    runAsUser: 2011
    runAsGroup: 2011
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false

# if shared secret:
# LATER, weil wegen redis


######################################################################################
##          Setting up Synapse Admin
######################################################################################
synapse_admin:
  enabled: true
  adminUri:  
  image:
    repository: awesometechnologies/synapse-admin
    tag: 0.8.5
    pullPolicy: IfNotPresent
  ## Resource configuration to apply to the synapse-admin server.
  ##
  resources: 
    limits:
      cpu: 5m
      memory: 15Mi
    requests:
      cpu: 5m
      memory: 15Mi

  podSecurityContext: 
    runAsNonRoot: true
  securityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    runAsUser: 2010
  ## Configuration for mounting additional volumes into the application container.
  ##
  extraVolumes:
    - name: confnginx
      emptyDir: {}
    - name: lognginx
      emptyDir: {}
    - name: runnginx
      emptyDir: {}
    - name: tmpnginx
      emptyDir: {}
  # - name: backgrounds
  #   persistentVolumeClaim:
  #     claimName: element-backgrounds
  extraVolumeMounts:
    - name: confnginx
      mountPath: /etc/nginx/conf.d/
    - name: lognginx
      mountPath: /var/log/nginx/
    - name: runnginx
      mountPath: /var/run/
    - name: tmpnginx
      mountPath: /var/cache/nginx/


